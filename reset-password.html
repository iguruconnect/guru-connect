<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GURU CONNECT — Set New Password</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(135deg,#f7fbff,#eef4ff);font-family:Inter,Arial,sans-serif;color:#0f172a}.card{width:min(460px,100%);background:#fff;border:1px solid #dbe5f0;border-radius:24px;box-shadow:0 20px 60px rgba(15,61,145,.12);padding:28px}.logo{display:block;width:min(250px,75%);max-height:130px;object-fit:contain;margin:0 auto 16px}.eyebrow{text-align:center;font-size:13px;font-weight:900;letter-spacing:.08em;color:#155eef}.title{text-align:center;font-size:28px;font-weight:900;color:#0f172a;margin-top:6px}.sub{text-align:center;color:#64748b;font-size:14px;line-height:1.55;margin:8px 0 22px}.label{display:block;font-size:13px;font-weight:900;color:#334155;margin:14px 0 7px}.input{width:100%;border:1px solid #cbd5e1;border-radius:13px;padding:14px;font-size:16px;outline:none}.input:focus{border-color:#2563eb;box-shadow:0 0 0 3px #2563eb18}.btn{width:100%;border:0;border-radius:13px;padding:15px;margin-top:18px;background:#2563eb;color:#fff;font-size:15px;font-weight:900;cursor:pointer}.btn:disabled{opacity:.6;cursor:wait}.msg{display:none;margin-top:14px;padding:13px;border-radius:12px;font-size:13px;line-height:1.5;font-weight:700}.msg.show{display:block}.ok{background:#ecfdf5;color:#166534;border:1px solid #bbf7d0}.err{background:#fff1f2;color:#991b1b;border:1px solid #fecdd3}.back{display:block;text-align:center;margin-top:18px;color:#155eef;font-size:13px;font-weight:900;text-decoration:none}
</style>
</head>
<body>
<main class="card">
<img class="logo" src="guru-connect-round-logo.png" alt="GURU CONNECT">
<div class="eyebrow">SECURE ACCOUNT RECOVERY</div>
<div class="title">Set a new password</div>
<div class="sub">Open this page from the newest GURU CONNECT password-reset email. First verify the recovery link, then choose your new password.</div>
<label class="label" for="p1">NEW PASSWORD</label>
<input id="p1" class="input" type="password" minlength="8" autocomplete="new-password" placeholder="At least 8 characters">
<label class="label" for="p2">CONFIRM NEW PASSWORD</label>
<input id="p2" class="input" type="password" minlength="8" autocomplete="new-password" placeholder="Enter the same password again">
<button id="save" class="btn" type="button" disabled>VERIFYING RECOVERY LINK…</button>
<div id="msg" class="msg"></div>
<a class="back" href="index.html">← Back to GURU CONNECT</a>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
'use strict';
const SUPABASE_URL='https://hzqqswrnawrfgufbxgay.supabase.co';
const SUPABASE_KEY='sb_publishable_Oc5HvqDpisv76XrdsyFhiw_IpostIDu';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{
  persistSession:true,autoRefreshToken:true,detectSessionInUrl:false,flowType:'implicit'
}});
const $=id=>document.getElementById(id),msg=$('msg'),save=$('save');
let recoveryReady=false;
let resolving=false;

function show(t,ok=false){msg.textContent=t;msg.className='msg show '+(ok?'ok':'err')}
function cleanUrl(){
  try{
    const u=new URL(location.href);
    ['code','token_hash','type','error','error_code','error_description'].forEach(k=>u.searchParams.delete(k));
    u.hash='';
    history.replaceState({},document.title,u.pathname+(u.search?'?'+u.searchParams.toString():''));
  }catch(_){ }
}
async function getRealUser(){
  try{
    const r=await sb.auth.getUser();
    const u=r.data?.user;
    return (!r.error && u && u.email && !u.is_anonymous) ? u : null;
  }catch(_){return null}
}

function recoveryInput(){
  const u=new URL(location.href);
  const q=u.searchParams;
  const h=new URLSearchParams((u.hash||'').replace(/^#/,'').replace(/^\?/,'')||'');
  return {
    accessToken:h.get('access_token'),
    refreshToken:h.get('refresh_token'),
    hashType:h.get('type'),
    code:q.get('code'),
    tokenHash:q.get('token_hash')||h.get('token_hash'),
    type:q.get('type')||h.get('type'),
    error:q.get('error_description')||h.get('error_description')||q.get('error')||h.get('error')
  };
}

async function consumeRecovery(){
  if(resolving)return recoveryReady;
  resolving=true;
  try{
    const x=recoveryInput();
    if(x.error) throw new Error(decodeURIComponent(String(x.error).replace(/\+/g,' ')));

    if(x.accessToken && x.refreshToken){
      if(x.hashType && x.hashType!=='recovery') throw new Error('This link is not a password-recovery link.');
      const r=await sb.auth.setSession({access_token:x.accessToken,refresh_token:x.refreshToken});
      if(r.error)throw r.error;
    }else if(x.code){
      const r=await sb.auth.exchangeCodeForSession(x.code);
      if(r.error)throw r.error;
    }else if(x.tokenHash){
      if(x.type && x.type!=='recovery')throw new Error('This link is not a password-recovery link.');
      const r=await sb.auth.verifyOtp({token_hash:x.tokenHash,type:'recovery'});
      if(r.error)throw r.error;
    }else{
      const existing=await getRealUser();
      if(!existing)throw new Error('No password-recovery credential was found in this page. Please use the newest reset email link.');
    }

    const user=await getRealUser();
    if(!user)throw new Error('Recovery session could not be created. Please request a NEW password-reset email and use its newest link.');
    recoveryReady=true;
    cleanUrl();
    save.disabled=false;
    save.textContent='SAVE NEW PASSWORD';
    show('✓ Recovery verified for '+user.email+'. You can now set your new password.',true);
    return true;
  }catch(e){
    console.error('GURU CONNECT password recovery:',e);
    recoveryReady=false;
    save.disabled=true;
    save.textContent='RECOVERY LINK REQUIRED';
    show('Recovery link could not be verified: '+(e?.message||String(e)));
    return false;
  }finally{resolving=false}
}

// IMPORTANT: do not consume recovery credentials automatically on page load.
// Some email security scanners prefetch links. Supabase documents that this can
// consume single-use recovery links before the real user clicks them.
const input=recoveryInput();
if(input.error){
  show('Recovery link could not be verified: '+decodeURIComponent(String(input.error).replace(/\+/g,' ')));
}else if(input.accessToken||input.code||input.tokenHash){
  save.disabled=false;
  save.textContent='CONTINUE TO VERIFY RECOVERY';
  show('✓ Secure recovery link received. Click CONTINUE TO VERIFY RECOVERY to activate it.',true);
}else{
  getRealUser().then(u=>{
    if(u){recoveryReady=true;save.disabled=false;save.textContent='SAVE NEW PASSWORD';show('✓ Recovery session already active for '+u.email+'.',true);}
    else show('Please open the newest password-reset email link first.');
  });
}

save.onclick=async()=>{
  if(!recoveryReady){
    const ok=await consumeRecovery();
    if(!ok)return;
    // For a credential-bearing link, the first click only verifies it.
    if($('p1').value==='' && $('p2').value==='')return;
  }
  const a=$('p1').value,b=$('p2').value;
  if(a.length<8){show('Password must be at least 8 characters.');return;}
  if(a!==b){show('Passwords do not match.');return;}
  save.disabled=true;save.textContent='SAVING PASSWORD…';
  try{
    const user=await getRealUser();
    if(!user)throw new Error('Recovery session expired. Please request a new reset email.');
    const r=await sb.auth.updateUser({password:a});
    if(r.error)throw r.error;
    show('✓ Password updated successfully. Redirecting to login…',true);
    setTimeout(async()=>{try{await sb.auth.signOut({scope:'local'})}catch(_){}location.href='index.html';},1200);
  }catch(e){
    console.error('GURU CONNECT password update:',e);
    show('Password update failed: '+(e?.message||String(e)));
    save.disabled=false;save.textContent='SAVE NEW PASSWORD';
  }
};
</script>
</body></html>
