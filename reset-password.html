<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GURU CONNECT — Set New Password</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,#eef6ff,#f8fbff,#f5f3ff);font-family:Inter,Arial,sans-serif;color:#0f172a}
.card{width:min(480px,100%);background:#fff;border:1px solid #dbe3ef;border-radius:26px;padding:30px;box-shadow:0 24px 70px #0f172a18}
.logo{display:block;width:260px;height:70px;object-fit:contain;margin:auto auto 15px}
h1{text-align:center;margin:0;font-size:25px}.sub{text-align:center;color:#64748b;font-size:13px;line-height:1.55}
.label{display:block;font-size:11px;font-weight:950;color:#475569;margin:16px 0 6px}
.input{width:100%;padding:14px;border:1px solid #cbd5e1;border-radius:12px;font:700 14px Inter;outline:0}
.input:focus{border-color:#2563eb;box-shadow:0 0 0 3px #2563eb18}
.btn{width:100%;margin-top:18px;padding:14px;border:0;border-radius:12px;background:#2563eb;color:#fff;font-weight:950;cursor:pointer}
.btn:disabled{opacity:.65;cursor:wait}.msg{display:none;margin-top:14px;padding:13px;border-radius:11px;font-size:13px;font-weight:750;line-height:1.5}.msg.show{display:block}.ok{background:#ecfdf5;color:#166534}.err{background:#fff1f2;color:#991b1b}
.links{text-align:center;margin-top:18px;font-size:13px;font-weight:800}.links a{color:#2563eb;text-decoration:none}
#form{display:none}.loader{text-align:center;padding:15px;color:#64748b;font-size:13px;font-weight:700}
</style>

<style id="gc-global-official-branding">
.gc-official-wordmark{display:inline-flex!important;align-items:baseline!important;gap:.22em!important;white-space:nowrap!important;line-height:1.05!important;font-family:"Nunito Sans",Arial,sans-serif!important;text-decoration:none!important}
.gc-official-wordmark .gc-word-guru{color:#e11d2e!important;font-weight:900!important;letter-spacing:-.035em!important}
.gc-official-wordmark .gc-word-connect{color:#1764d8!important;font-weight:300!important;letter-spacing:.005em!important}
.gc-official-logo{display:block!important;width:clamp(48px,5.2vw,72px)!important;height:clamp(48px,5.2vw,72px)!important;max-width:72px!important;max-height:72px!important;min-width:0!important;object-fit:contain!important;object-position:center!important;aspect-ratio:1/1!important;flex:0 0 auto!important;opacity:1!important;filter:none!important;mix-blend-mode:normal!important;transform:none!important;border:0!important;box-shadow:none!important;background:transparent!important;padding:0!important;border-radius:0!important}
.gc-official-brand-lockup{display:inline-flex!important;align-items:center!important;justify-content:flex-start!important;gap:10px!important;max-width:100%!important;text-decoration:none!important;overflow:visible!important}
.gc-official-brand-lockup .gc-official-wordmark{font-size:clamp(20px,2.2vw,30px)!important}
#gc-popup-brand.gc-official-wordmark,.gc-footer-title.gc-official-wordmark,.brandtext.gc-official-wordmark{font-size:inherit!important}
@media(max-width:650px){.gc-official-logo{width:54px!important;height:54px!important}.gc-official-brand-lockup{gap:7px!important}.gc-official-brand-lockup .gc-official-wordmark{font-size:clamp(18px,5vw,25px)!important}}
</style>

</head>
<body>
<main class="card">
<img class="logo" src="guru-connect-brand.png" alt="GURU CONNECT">
<h1>Create a new password</h1>
<p class="sub">Use this secure page after opening the newest GURU CONNECT password-reset email.</p>
<div id="loader" class="loader">Checking your secure reset link…</div>
<form id="form">
<label class="label" for="password">NEW PASSWORD</label>
<input id="password" class="input" type="password" minlength="8" autocomplete="new-password" required>
<label class="label" for="password2">CONFIRM NEW PASSWORD</label>
<input id="password2" class="input" type="password" minlength="8" autocomplete="new-password" required>
<button id="save" class="btn" type="submit">UPDATE PASSWORD</button>
</form>
<div id="msg" class="msg"></div>
<div class="links"><a href="index.html">← Back to GURU CONNECT</a></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const U='https://hzqqswrnawrfgufbxgay.supabase.co';
const K='sb_publishable_Oc5HvqDpisv76XrdsyFhiw_IpostIDu';
const sb=supabase.createClient(U,K,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const $=id=>document.getElementById(id), msg=$('msg');
function show(t,ok=false){msg.textContent=t;msg.className='msg show '+(ok?'ok':'err');}
async function ready(){
  try{
    const hash=new URLSearchParams(location.hash.replace(/^#/,''));
    const type=hash.get('type');
    const access=hash.get('access_token');
    const refresh=hash.get('refresh_token');
    if(access&&refresh){
      await sb.auth.setSession({access_token:access,refresh_token:refresh});
    }
    let session=(await sb.auth.getSession()).data?.session;
    if(!session && type==='recovery'){
      await new Promise(r=>setTimeout(r,500));
      session=(await sb.auth.getSession()).data?.session;
    }
    if(!session){
      $('loader').textContent='This password-reset link is missing or has expired. Please request a new reset email.';
      show('Reset link is invalid or expired. Go back to the login page and request a new password-reset email.');
      return;
    }
    $('loader').style.display='none';
    $('form').style.display='block';
  }catch(e){
    console.error('Reset session error',e);
    $('loader').textContent='Unable to open the secure reset session.';
    show(e?.message||'The reset link could not be opened. Please request a new one.');
  }
}
$('form').addEventListener('submit',async e=>{
  e.preventDefault();
  const p=$('password').value,p2=$('password2').value,b=$('save');
  if(p.length<8)return show('Password must be at least 8 characters.');
  if(p!==p2)return show('The two passwords do not match.');
  b.disabled=true;b.textContent='UPDATING…';
  try{
    const r=await sb.auth.updateUser({password:p});
    if(r.error)throw r.error;
    show('✓ Password updated successfully. You can now login with your new password.',true);
    $('form').reset();
    setTimeout(()=>location.href='index.html',1600);
  }catch(e){
    console.error('Password update error',e);
    show('Password could not be updated: '+(e?.message||String(e)));
  }finally{b.disabled=false;b.textContent='UPDATE PASSWORD';}
});
sb.auth.onAuthStateChange((event,session)=>{
  if(event==='PASSWORD_RECOVERY'&&session){
    $('loader').style.display='none';$('form').style.display='block';
  }
});
ready();
</script>
<style id="gc-branded-popup-style">
#gc-popup-overlay{position:fixed;inset:0;background:rgba(7,18,38,.62);backdrop-filter:blur(5px);display:none;align-items:center;justify-content:center;z-index:2147483647;padding:18px;font-family:inherit}
#gc-popup-overlay.gc-open{display:flex;animation:gcFade .18s ease-out}
#gc-popup-card{width:min(420px,100%);background:#fff;border-radius:22px;box-shadow:0 24px 80px rgba(0,0,0,.28);overflow:hidden;text-align:center;border:1px solid rgba(255,255,255,.7);animation:gcRise .22s ease-out}
#gc-popup-top{padding:22px 24px 14px;background:linear-gradient(135deg,#eff6ff,#f0fdfa)}
#gc-popup-logo{width:70px;height:70px;object-fit:contain;border-radius:18px;background:#fff;padding:6px;box-shadow:0 5px 18px rgba(15,23,42,.1)}
#gc-popup-brand{font-weight:900;letter-spacing:1.2px;color:#12315b;font-size:18px;margin-top:9px}
#gc-popup-tag{font-size:10px;letter-spacing:2px;color:#0f766e;font-weight:800;margin-top:3px}
#gc-popup-icon{width:48px;height:48px;margin:17px auto 0;border-radius:50%;display:grid;place-items:center;font-size:25px;background:#dcfce7;color:#15803d}
#gc-popup-icon.gc-error{background:#fee2e2;color:#b91c1c}#gc-popup-icon.gc-warn{background:#fef3c7;color:#b45309}
#gc-popup-title{font-size:20px;font-weight:800;color:#14213d;margin:17px 20px 7px}
#gc-popup-message{white-space:pre-wrap;overflow-wrap:anywhere;color:#526176;font-size:14px;line-height:1.6;margin:0 24px 20px;max-height:35vh;overflow:auto}
#gc-popup-ok{border:0;border-radius:12px;background:linear-gradient(135deg,#2563eb,#0f766e);color:#fff;font-weight:800;letter-spacing:.4px;padding:12px 28px;min-width:125px;cursor:pointer;box-shadow:0 6px 16px rgba(37,99,235,.22)}
#gc-popup-actions{padding:0 22px 22px;display:flex;justify-content:center;gap:10px}#gc-popup-ok:focus{outline:3px solid #93c5fd;outline-offset:3px}
@keyframes gcFade{from{opacity:0}to{opacity:1}}@keyframes gcRise{from{transform:translateY(10px) scale(.98);opacity:.7}to{transform:none;opacity:1}}
@media(prefers-reduced-motion:reduce){#gc-popup-overlay,#gc-popup-card{animation:none}}
</style>
<div id="gc-popup-overlay" role="presentation"><section id="gc-popup-card" role="alertdialog" aria-modal="true" aria-labelledby="gc-popup-title" aria-describedby="gc-popup-message"><div id="gc-popup-top"><img id="gc-popup-logo" src="guru-connect-logo.png" alt="GURU CONNECT logo"><div id="gc-popup-brand">GURU CONNECT</div><div id="gc-popup-tag">CONNECTING MINDS • CREATING FUTURES</div><div id="gc-popup-icon">✓</div></div><h2 id="gc-popup-title">Notice</h2><p id="gc-popup-message"></p><div id="gc-popup-actions"><button id="gc-popup-ok" type="button">CONTINUE</button></div></section></div>
<script id="gc-branded-popup-script">(()=>{if(window.__gcBrandedPopupInstalled)return;window.__gcBrandedPopupInstalled=true;const overlay=document.getElementById('gc-popup-overlay');if(!overlay)return;const title=overlay.querySelector('#gc-popup-title'),msg=overlay.querySelector('#gc-popup-message'),icon=overlay.querySelector('#gc-popup-icon'),ok=overlay.querySelector('#gc-popup-ok');let queue=[],busy=false;function render(){if(!queue.length){overlay.classList.remove('gc-open');busy=false;return}busy=true;const item=queue[0];title.textContent=item.title;msg.textContent=item.message;icon.className=item.kind==='error'?'gc-error':item.kind==='warn'?'gc-warn':'';icon.textContent=item.kind==='error'?'!':item.kind==='warn'?'⚠':'✓';ok.textContent=item.button||'CONTINUE';overlay.classList.add('gc-open');ok.focus()}function close(){queue.shift();render()}ok.addEventListener('click',close);overlay.addEventListener('click',e=>{if(e.target===overlay)close()});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&overlay.classList.contains('gc-open')){e.preventDefault();close()}});const nativeAlert=window.alert.bind(window);window.alert=function(value){const message=String(value??'');const low=message.toLowerCase();const kind=/fail|error|unable|not saved|not updated|denied|invalid|expired/.test(low)?'error':/warning|please|cannot|missing/.test(low)?'warn':'success';queue.push({title:kind==='error'?'Action Unsuccessful':kind==='warn'?'Please Note':'Action Completed',message,kind});if(!busy)render()};window.gcShowPopup=(message,options={})=>{queue.push({title:options.title||'GURU CONNECT',message:String(message??''),kind:options.kind||'success',button:options.button});if(!busy)render()};})();</script>
<script id="gc-global-official-branding-script">
(function(){
  if(window.__gcOfficialBrandingApplied)return;window.__gcOfficialBrandingApplied=true;
  const logoURL='guru-connect-header-transparent.png';
  const isBrandImg=(img)=>{
    const src=(img.getAttribute('src')||'').toLowerCase();
    const alt=(img.getAttribute('alt')||'').toLowerCase();
    const cls=(typeof img.className==='string'?img.className:'').toLowerCase();
    const id=(img.id||'').toLowerCase();
    if(/verified|payment|upi|tick|hero|student|tutor|advert|banner|receipt-banner/.test(alt+' '+cls+' '+id)) return false;
    return /logo|brand|guru.?connect/.test(src+' '+alt+' '+cls+' '+id);
  };
  const wordmark=()=>{
    const el=document.createElement('span');el.className='gc-official-wordmark';
    el.innerHTML='<span class="gc-word-guru">GURU</span><span class="gc-word-connect">CONNECT</span>';
    return el;
  };
  document.querySelectorAll('img').forEach(img=>{
    if(!isBrandImg(img))return;
    img.setAttribute('src',logoURL);img.setAttribute('alt','GURU CONNECT official circular logo');
    img.removeAttribute('srcset');img.classList.add('gc-official-logo');
    const holder=img.closest('a, .brand, .logo, .brand-lockup, .gc-footer-brand, .gc-footer-logo-wrap, .gc-modern-login-brand, header, footer')||img.parentElement;
    if(!holder)return;
    holder.classList.add('gc-official-brand-lockup');
    const nearby=(holder.innerText||holder.textContent||holder.parentElement?.innerText||'').replace(/\s+/g,' ').trim().toUpperCase();
    const hasNearbyBrand=nearby.includes('GURU')&&nearby.includes('CONNECT');
    if(hasNearbyBrand){
      const scope=holder.parentElement||holder;
      const brandText=scope.querySelector('.brandtext,.gc-footer-title,#gc-popup-brand,.gc-modern-login-title,.exact-registration-brand');
      if(brandText&&!brandText.classList.contains('gc-official-wordmark')){
        brandText.innerHTML='<span class="gc-word-guru">GURU</span> <span class="gc-word-connect">CONNECT</span>';
        brandText.classList.add('gc-official-wordmark');
      }
    }else{
      let existing=holder.querySelector(':scope > .gc-official-wordmark');
      if(!existing){existing=wordmark();img.insertAdjacentElement('afterend',existing);}
    }
  });
  document.querySelectorAll('.brandtext,.gc-footer-title,#gc-popup-brand,.gc-modern-login-title,.exact-registration-brand').forEach(el=>{
    const txt=(el.innerText||el.textContent||'').replace(/\s+/g,' ').trim().toUpperCase();
    if(txt.includes('GURU')&&txt.includes('CONNECT')){
      el.innerHTML='<span class="gc-word-guru">GURU</span> <span class="gc-word-connect">CONNECT</span>';
      el.classList.add('gc-official-wordmark');
    }
  });
})();
</script>

</body>
</html>
