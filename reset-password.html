'use strict';
const SUPABASE_URL='https://hzqqswrnawrfgufbxgay.supabase.co';

const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});

let ready=false,booting=true;
function show(t,ok){msg.textContent=t;msg.className='msg '+(ok?'ok':'err');msg.style.display='block'}
async function recover(){
  try{
    const u=new URL(location.href), q=u.searchParams;
    const h=new URLSearchParams((location.hash||'').replace(/^#/,'?'));
    const code=q.get('code');
    const access=h.get('access_token')||q.get('access_token');

    const g=await sb.auth.getSession();

    if(!ready){show('This reset link is expired or invalid. Please request a new reset link from LOGIN → Forgot password.',false);save.disabled=true;return;}

  }catch(e){ready=false;save.disabled=true;show('Unable to verify this reset link: '+(e.message||e),false);}
