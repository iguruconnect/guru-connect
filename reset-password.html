<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Update Password — GURU CONNECT</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial,Helvetica,sans-serif;background:linear-gradient(135deg,#0f1f4f,#2563eb 55%,#06b6d4);display:flex;align-items:center;justify-content:center;padding:20px}.card{width:min(470px,100%);background:#fff;border-radius:26px;padding:30px;box-shadow:0 25px 70px rgba(0,0,0,.25)}h1{text-align:center;font-size:25px;margin:8px 0}.sub{text-align:center;color:#64748b;font-size:13px;font-weight:700;margin-bottom:22px}.field{margin:13px 0}.field label{display:block;font-size:11px;font-weight:900;color:#475569;margin-bottom:6px}.field input{width:100%;padding:14px;border:1px solid #cbd5e1;border-radius:13px;font-size:15px;font-weight:700}button{width:100%;border:0;border-radius:13px;padding:14px;background:#2563eb;color:#fff;font-weight:950;cursor:pointer;margin-top:8px}.back{background:#f1f5f9;color:#334155}.msg{display:none;margin-top:14px;padding:12px;border-radius:12px;font-size:12px;font-weight:800}.ok{display:block;background:#ecfdf5;color:#047857}.err{display:block;background:#fff1f2;color:#be123c}.wait{display:block;background:#eff6ff;color:#1d4ed8}.icon{width:62px;height:62px;margin:0 auto;border-radius:18px;background:#2563eb;color:#fff;display:flex;align-items:center;justify-content:center;font-size:28px}
</style>
</head>
<body>
<div class="card">
  <div class="icon">🔐</div>
  <h1>Update Password</h1>
  <div class="sub">GURU CONNECT secure password reset</div>
  <div class="field"><label>NEW PASSWORD</label><input id="pw1" type="password" autocomplete="new-password" placeholder="Minimum 8 characters"></div>
  <div class="field"><label>CONFIRM PASSWORD</label><input id="pw2" type="password" autocomplete="new-password" placeholder="Re-enter new password"></div>
  <button id="save" type="button" disabled>UPDATE PASSWORD</button>
  <button class="back" type="button" onclick="location.href='index.html'">BACK TO WEBSITE</button>
  <div id="msg" class="msg wait">Verifying your password-reset link…</div>
</div>
<script>
'use strict';
const SUPABASE_URL='https://hzqqswrnawrfgufbxgay.supabase.co';
const SUPABASE_KEY='sb_publishable_Oc5HvqDpisv76XrdsyFhiw_IpostIDu';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const msg=document.getElementById('msg'),save=document.getElementById('save'),pw1=document.getElementById('pw1'),pw2=document.getElementById('pw2');
let ready=false, finished=false;
function show(text,kind){msg.textContent=text;msg.className='msg '+kind;msg.style.display='block'}
function enable(){ready=true;save.disabled=false;show('Reset link verified. Enter your new password.', 'ok')}

// Register listener immediately so PASSWORD_RECOVERY is never missed.
sb.auth.onAuthStateChange(function(event,session){
  if(session && (event==='PASSWORD_RECOVERY'||event==='SIGNED_IN'||event==='INITIAL_SESSION')) enable();
});

async function recover(){
  try{
    const url=new URL(location.href);
    const hash=new URLSearchParams(location.hash.replace(/^#/,'').replace(/^\?/,'') );
    const code=url.searchParams.get('code');
    const access=hash.get('access_token');
    const refresh=hash.get('refresh_token');
    const type=hash.get('type')||url.searchParams.get('type');
    const tokenHash=url.searchParams.get('token_hash')||hash.get('token_hash');

    if(code){
      const x=await sb.auth.exchangeCodeForSession(code);
      if(x.error)throw x.error;
    } else if(access && refresh){
      const x=await sb.auth.setSession({access_token:access,refresh_token:refresh});
      if(x.error)throw x.error;
    } else if(tokenHash && type==='recovery'){
      const x=await sb.auth.verifyOtp({token_hash:tokenHash,type:'recovery'});
      if(x.error)throw x.error;
    }

    // Allow the SDK to finish processing a recovery URL, then check the session.
    for(let i=0;i<20;i++){
      const g=await sb.auth.getSession();
      if(g.data && g.data.session){enable();return true;}
      await new Promise(r=>setTimeout(r,150));
    }
    throw new Error('Recovery session is missing or expired. Please request a new reset link.');
  }catch(e){
    console.error('Recovery verification failed:',e);
    show('Reset link could not be verified: '+(e.message||e), 'err');
    save.disabled=true;return false;
  }
}

save.addEventListener('click',async function(){
  if(finished)return;
  const a=pw1.value,b=pw2.value;
  if(a.length<8){show('Password must be at least 8 characters.','err');return}
  if(a!==b){show('Passwords do not match.','err');return}
  save.disabled=true;save.textContent='UPDATING…';
  try{
    const g=await sb.auth.getSession();
    if(!g.data || !g.data.session)throw new Error('Recovery session is missing or expired. Please request a new reset link.');
    const r=await sb.auth.updateUser({password:a});
    if(r.error)throw r.error;
    finished=true;pw1.value='';pw2.value='';
    show('PASSWORD UPDATED SUCCESSFULLY. You can now login with your new password.','ok');
    setTimeout(async()=>{try{await sb.auth.signOut()}catch(e){}location.href='index.html';},1200);
  }catch(e){
    console.error('Update password failed:',e);
    show('UPDATE PASSWORD FAILED: '+(e.message||e),'err');
    save.disabled=false;save.textContent='UPDATE PASSWORD';
  }
});

recover();
</script>
</body></html>
