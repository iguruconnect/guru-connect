<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GURU CONNECT — Create New Password</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:18px;font-family:Inter,Arial,sans-serif;background:linear-gradient(135deg,#06142f,#123b8f 55%,#06b6d4);color:#17356f}
.card{width:min(560px,100%);background:#fff;border-radius:28px;overflow:hidden;box-shadow:0 25px 80px #0005}.head{text-align:center;padding:28px;background:#eff6ff;border-bottom:1px solid #dbeafe}.head h1{margin:8px 0;font-size:28px;color:#123b8f}.head p{margin:0;color:#64748b;font-size:12px;line-height:1.55}.body{padding:24px}.label{display:block;font-size:11px;font-weight:950;margin:0 0 7px}.input{width:100%;padding:14px;border:2px solid #cbd5e1;border-radius:13px;font-size:15px;font-weight:700;outline:none}.input:focus{border-color:#2563eb;box-shadow:0 0 0 4px #dbeafe}.btn{width:100%;margin-top:14px;border:0;border-radius:13px;padding:14px;background:#16a34a;color:#fff;font-weight:950;cursor:pointer}.btn:disabled{opacity:.6}.msg{display:none;margin-top:13px;padding:12px;border-radius:12px;font-size:12px;font-weight:800;line-height:1.5}.msg.show{display:block}.ok{background:#ecfdf5;color:#166534;border:1px solid #bbf7d0}.err{background:#fff1f2;color:#991b1b;border:1px solid #fecdd3}.loading{background:#eff6ff;color:#24508a;border:1px solid #bfdbfe}.link{display:block;text-align:center;margin-top:17px;color:#2563eb;font-size:12px;font-weight:900;text-decoration:none}.hidden{display:none!important}
</style></head>
<body><main class="card"><section class="head"><h1>🔐 Create New Password</h1><p>Use the secure link from your GURU CONNECT email. Set your new password below.</p></section>
<section class="body">
<div id="gate" class="msg show loading">Verifying your secure reset link…</div>
<div id="form" class="hidden">
<label class="label" for="p1">NEW PASSWORD</label><input id="p1" class="input" type="password" minlength="8" autocomplete="new-password" placeholder="At least 8 characters">
<label class="label" for="p2" style="margin-top:15px">CONFIRM NEW PASSWORD</label><input id="p2" class="input" type="password" minlength="8" autocomplete="new-password" placeholder="Enter the same password again">
<button id="save" class="btn">UPDATE PASSWORD</button>
</div>
<div id="msg" class="msg"></div><a class="link" href="index.html">← Back to GURU CONNECT</a>
</section></main>
<script>
'use strict';
const URL='https://hzqqswrnawrfgufbxgay.supabase.co',KEY='sb_publishable_Oc5HvqDpisv76XrdsyFhiw_IpostIDu';
const sb=supabase.createClient(URL,KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storageKey:'guru-connect-password-recovery-url-v1'}});
const gate=document.getElementById('gate'),form=document.getElementById('form'),msg=document.getElementById('msg'),save=document.getElementById('save');
function show(t,ok){msg.textContent=t;msg.className='msg show '+(ok?'ok':'err')}
function showGate(t,ok=false){gate.textContent=t;gate.className='msg show '+(ok?'ok':'loading')}
let ready=false;
function activate(session){
 if(!session?.user||session.user.is_anonymous===true)return false;
 ready=true;gate.classList.add('hidden');form.classList.remove('hidden');document.getElementById('p1').focus();return true;
}
async function boot(){
 try{
   const params=new URLSearchParams(location.search);
   const code=params.get('code');
   if(code){const ex=await sb.auth.exchangeCodeForSession(code);if(ex.error)throw ex.error;if(activate(ex.data?.session))return;}
   const {data,error}=await sb.auth.getSession();
   if(error)throw error;
   if(activate(data?.session))return;
   showGate('Open the newest password-reset email and click its secure reset link. This page only accepts an active recovery session.');
 }catch(e){showGate('Reset link verification failed: '+(e.message||e),false)}
}
sb.auth.onAuthStateChange((event,session)=>{
 if(event==='PASSWORD_RECOVERY'||event==='SIGNED_IN')activate(session);
});
save.onclick=async()=>{
 if(!ready)return show('Your secure reset link has not been verified yet.',false);
 const a=document.getElementById('p1').value,b=document.getElementById('p2').value;
 if(a.length<8)return show('Password must be at least 8 characters.',false);
 if(a!==b)return show('Passwords do not match.',false);
 save.disabled=true;save.textContent='UPDATING PASSWORD…';
 try{
   const current=(await sb.auth.getSession()).data?.session;
   if(!current?.user||current.user.is_anonymous===true)throw new Error('Your secure reset session is missing or invalid. Please request a new reset link.');
   const r=await sb.auth.updateUser({password:a});
   if(r.error)throw r.error;
   show('✓ Password updated successfully. Redirecting to GURU CONNECT login…',true);
   document.getElementById('p1').value='';document.getElementById('p2').value='';
   setTimeout(async()=>{try{await sb.auth.signOut({scope:'local'})}catch(_){}location.href='index.html'},1400);
 }catch(e){show('Password update failed: '+(e.message||e),false);save.disabled=false;save.textContent='UPDATE PASSWORD'}
};
boot();
</script></body></html>
