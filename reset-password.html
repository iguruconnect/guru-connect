<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reset Password — GURU CONNECT</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial,Helvetica,sans-serif;background:linear-gradient(135deg,#0f1f4f,#2563eb 55%,#06b6d4);display:flex;align-items:center;justify-content:center;padding:20px;color:#0f172a}.card{width:min(470px,100%);background:#fff;border-radius:26px;padding:30px;box-shadow:0 25px 70px rgba(0,0,0,.25)}.brand{text-align:center}.brand img{max-width:100%;height:auto;max-height:120px;object-fit:contain}.icon{width:62px;height:62px;margin:8px auto 14px;border-radius:18px;background:linear-gradient(135deg,#2563eb,#4338ca);color:#fff;display:flex;align-items:center;justify-content:center;font-size:28px}.brand h1{margin:0;font-size:24px}.brand p{margin:7px 0 22px;color:#64748b;font-size:13px;font-weight:600}.field{margin:13px 0}.field label{display:block;font-size:11px;font-weight:900;color:#475569;margin-bottom:6px;text-transform:uppercase}.field input{width:100%;padding:14px;border:1px solid #cbd5e1;border-radius:13px;font-size:15px;font-weight:700;outline:none}.field input:focus{border-color:#2563eb;box-shadow:0 0 0 3px rgba(37,99,235,.1)}button{width:100%;border:0;border-radius:13px;padding:14px;background:#2563eb;color:#fff;font-weight:950;font-size:13px;cursor:pointer;margin-top:8px}button:disabled{opacity:.6}.back{background:#f1f5f9;color:#334155}.msg{margin-top:14px;padding:12px;border-radius:12px;font-size:12px;font-weight:800;display:none}.ok{display:block;background:#ecfdf5;color:#047857}.err{display:block;background:#fff1f2;color:#be123c}.hint{text-align:center;margin-top:16px;color:#94a3b8;font-size:10px;font-weight:700;line-height:1.5}
</style>
</head>
<body>
<div class="card">
  <div class="brand">
    <div class="icon">🔐</div>
    <h1>Create New Password</h1>
    <p>GURU CONNECT secure password reset</p>
  </div>
  <div class="field"><label>New Password</label><input id="pw1" type="password" autocomplete="new-password" placeholder="Minimum 8 characters"></div>
  <div class="field"><label>Confirm Password</label><input id="pw2" type="password" autocomplete="new-password" placeholder="Re-enter new password"></div>
  <button id="save" type="button">UPDATE PASSWORD</button>
  <button class="back" type="button" onclick="location.href='index.html'">BACK TO WEBSITE</button>
  <div id="msg" class="msg"></div>
  <div class="hint">Your new password is handled by Supabase Authentication. GURU CONNECT does not display or store your password.</div>
</div>
<script>
const SUPABASE_URL='https://hzqqswrnawrfgufbxgay.supabase.co';
const SUPABASE_KEY='sb_publishable_Oc5HvQdpisv76XrdsyFhiw_IpostIDu';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const msg=document.getElementById('msg'),save=document.getElementById('save');
function show(text,ok){msg.textContent=text;msg.className='msg '+(ok?'ok':'err');msg.style.display='block';}
async function init(){
  try{
    const {data:{session}}=await sb.auth.getSession();
    const hash=location.hash||''; const query=location.search||'';
    if(!session && !/access_token|code=|type=recovery|error=/i.test(hash+query))show('Please use the latest password reset link from your email. If the link has expired, request a new reset email.',false);
    sb.auth.onAuthStateChange(async (event,session)=>{if(event==='PASSWORD_RECOVERY'&&!session)show('Recovery session is invalid or expired. Please request a new reset link.',false);});
  }catch(e){show('Unable to open password recovery: '+(e.message||e),false)}
}
save.onclick=async()=>{
 const a=document.getElementById('pw1').value,b=document.getElementById('pw2').value;
 if(a.length<8)return show('Password must be at least 8 characters.',false);
 if(a!==b)return show('Passwords do not match.',false);
 save.disabled=true;save.textContent='UPDATING…';msg.style.display='none';
 try{
   const {data:{session}}=await sb.auth.getSession();
   if(!session)throw new Error('Recovery session is missing or expired. Please request a new reset link.');
   const {error}=await sb.auth.updateUser({password:a});
   if(error)throw error;
   show('Password updated successfully. You can now login with your new password.',true);
   setTimeout(async()=>{try{await sb.auth.signOut()}catch(_){} location.href='index.html';},1500);
 }catch(e){show('Password update failed: '+(e.message||e),false)}finally{save.disabled=false;save.textContent='UPDATE PASSWORD'}
};
init();
</script>
</body></html>
