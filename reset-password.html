<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GURU CONNECT — Set New Password</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(135deg,#f7fbff,#eef4ff);font-family:Inter,Arial,sans-serif;color:#0f172a}.card{width:min(460px,100%);background:#fff;border:1px solid #dbe5f0;border-radius:24px;box-shadow:0 20px 60px rgba(15,61,145,.12);padding:28px}.logo{display:block;width:min(250px,75%);max-height:130px;object-fit:contain;margin:0 auto 16px}.eyebrow{text-align:center;font-size:13px;font-weight:900;letter-spacing:.08em;color:#155eef}.title{text-align:center;font-size:28px;font-weight:900;color:#0f172a;margin-top:6px}.sub{text-align:center;color:#64748b;font-size:14px;line-height:1.55;margin:8px 0 22px}.label{display:block;font-size:13px;font-weight:900;color:#334155;margin:14px 0 7px}.input{width:100%;border:1px solid #cbd5e1;border-radius:13px;padding:14px;font-size:16px;outline:none}.input:focus{border-color:#2563eb;box-shadow:0 0 0 3px #2563eb18}.btn{width:100%;border:0;border-radius:13px;padding:15px;margin-top:18px;background:#2563eb;color:#fff;font-size:15px;font-weight:900;cursor:pointer}.btn:disabled{opacity:.6;cursor:wait}.msg{display:none;margin-top:14px;padding:13px;border-radius:12px;font-size:13px;line-height:1.5;font-weight:700}.msg.show{display:block}.ok{background:#ecfdf5;color:#166534;border:1px solid #bbf7d0}.err{background:#fff1f2;color:#991b1b;border:1px solid #fecdd3}.back{display:block;text-align:center;margin-top:18px;color:#155eef;font-size:13px;font-weight:900;text-decoration:none}
</style>
</head>
<body>
<main class="card">
<img class="logo" src="guru-connect-round-logo.png" alt="GURU CONNECT">
<div class="eyebrow">SECURE ACCOUNT RECOVERY</div>
<div class="title">Set a new password</div>
<div class="sub">Open this page from the newest GURU CONNECT password-reset email, then choose your new password.</div>
<label class="label" for="p1">NEW PASSWORD</label>
<input id="p1" class="input" type="password" minlength="8" autocomplete="new-password" placeholder="At least 8 characters">
<label class="label" for="p2">CONFIRM NEW PASSWORD</label>
<input id="p2" class="input" type="password" minlength="8" autocomplete="new-password" placeholder="Enter the same password again">
<button id="save" class="btn" type="button" disabled>VERIFYING RECOVERY LINK…</button>
<div id="msg" class="msg"></div>
<a class="back" href="index.html">← Back to GURU CONNECT</a>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
'use strict';
const SUPABASE_URL='https://hzqqswrnawrfgufbxgay.supabase.co';
const SUPABASE_KEY='sb_publishable_Oc5HvqDpisv76XrdsyFhiw_IpostIDu';

// Password recovery is deliberately handled manually here.  This supports
// both Supabase recovery formats:
//   1) implicit: #access_token=...&refresh_token=...&type=recovery
//   2) PKCE/custom-template: ?code=... OR ?token_hash=...&type=recovery
// We do NOT let the SDK auto-consume the URL before our code sees it.
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{
  persistSession:true,
  autoRefreshToken:true,
  detectSessionInUrl:false,
  flowType:'implicit'
}});
const $=id=>document.getElementById(id),msg=$('msg'),save=$('save');
let recoveryReady=false;
let resolving=false;

function show(t,ok=false){
  msg.textContent=t;
  msg.className='msg show '+(ok?'ok':'err');
}
function cleanUrl(){
  try{
    const u=new URL(location.href);
    u.searchParams.delete('code');
    u.searchParams.delete('token_hash');
    u.searchParams.delete('type');
    u.searchParams.delete('error');
    u.searchParams.delete('error_code');
    u.searchParams.delete('error_description');
    u.hash='';
    history.replaceState({},document.title,u.pathname+(u.search?'?'+u.searchParams.toString():''));
  }catch(_){ }
}
async function getRealUser(){
  try{
    const r=await sb.auth.getUser();
    const u=r.data?.user;
    if(r.error || !u || !u.email || u.is_anonymous) return null;
    return u;
  }catch(_){return null}
}
async function waitForUser(){
  for(let i=0;i<20;i++){
    const u=await getRealUser();
    if(u) return u;
    await new Promise(r=>setTimeout(r,150));
  }
  return null;
}

async function consumeRecoveryUrl(){
  if(resolving) return recoveryReady;
  resolving=true;
  try{
    const u=new URL(location.href);
    const q=u.searchParams;
    const h=new URLSearchParams((u.hash||'').replace(/^#/,'').replace(/^\?/,'') || '');

    const err=q.get('error_description') || h.get('error_description') || q.get('error') || h.get('error');
    if(err) throw new Error(decodeURIComponent(err.replace(/\+/g,' ')));

    // 1. Implicit recovery link: access/refresh tokens are in the fragment.
    const accessToken=h.get('access_token');
    const refreshToken=h.get('refresh_token');
    const hashType=h.get('type');
    if(accessToken && refreshToken){
      if(hashType && hashType!=='recovery') throw new Error('This link is not a password-recovery link.');
      const s=await sb.auth.setSession({access_token:accessToken,refresh_token:refreshToken});
      if(s.error) throw s.error;
      cleanUrl();
    } else {
      // 2. PKCE recovery link: exchange ?code=...
      const code=q.get('code');
      if(code){
        const current=(await sb.auth.getSession()).data?.session;
        if(!current?.user?.email){
          const ex=await sb.auth.exchangeCodeForSession(code);
          if(ex.error) throw ex.error;
        }
        cleanUrl();
      } else {
        // 3. Custom Supabase email template: token_hash + type=recovery.
        const tokenHash=q.get('token_hash') || h.get('token_hash');
        const type=q.get('type') || h.get('type');
        if(tokenHash){
          if(type && type!=='recovery') throw new Error('This link is not a password-recovery link.');
          const v=await sb.auth.verifyOtp({token_hash:tokenHash,type:'recovery'});
          if(v.error) throw v.error;
          cleanUrl();
        }
      }
    }

    const user=await waitForUser();
    if(!user){
      recoveryReady=false;
      save.disabled=true;
      save.textContent='RECOVERY LINK REQUIRED';
      show('The recovery email reached this page, but no valid recovery session was created. Please request a NEW password-reset email and click its newest RESET PASSWORD link.');
      return false;
    }

    recoveryReady=true;
    save.disabled=false;
    save.textContent='SAVE NEW PASSWORD';
    show('✓ Recovery verified for '+user.email+'. You can now set your new password.',true);
    return true;
  }catch(e){
    console.error('GURU CONNECT password recovery:',e);
    recoveryReady=false;
    save.disabled=true;
    save.textContent='RECOVERY LINK REQUIRED';
    show('Recovery link could not be verified: '+(e?.message||String(e)));
    return false;
  }finally{resolving=false}
}

// Handles a recovery event if the SDK emits one after manual URL processing.
sb.auth.onAuthStateChange((event,session)=>{
  if((event==='PASSWORD_RECOVERY' || event==='SIGNED_IN') && session?.user?.email && !session.user.is_anonymous){
    recoveryReady=true;
    save.disabled=false;
    save.textContent='SAVE NEW PASSWORD';
    show('✓ Recovery verified for '+session.user.email+'. You can now set your new password.',true);
  }
});

save.onclick=async()=>{
  const a=$('p1').value;
  const b=$('p2').value;
  if(!recoveryReady){
    await consumeRecoveryUrl();
    if(!recoveryReady) return;
  }
  if(a.length<8){show('Password must be at least 8 characters.');return;}
  if(a!==b){show('Passwords do not match.');return;}
  save.disabled=true;
  save.textContent='SAVING PASSWORD…';
  try{
    const user=await getRealUser();
    if(!user) throw new Error('Recovery session expired. Please request a new reset email.');
    const r=await sb.auth.updateUser({password:a});
    if(r.error) throw r.error;
    show('✓ Password updated successfully. Redirecting to login…',true);
    setTimeout(async()=>{
      try{await sb.auth.signOut({scope:'local'})}catch(_){ }
      location.href='index.html';
    },1200);
  }catch(e){
    console.error('GURU CONNECT password update:',e);
    show('Password update failed: '+(e?.message||String(e)));
    save.disabled=false;
    save.textContent='SAVE NEW PASSWORD';
  }
};

consumeRecoveryUrl();
</script>
</body></html>
