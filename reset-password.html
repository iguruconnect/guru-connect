<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GURU CONNECT — Create New Password</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:18px;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;background:radial-gradient(circle at 10% 10%,#dbeafe,transparent 35%),radial-gradient(circle at 90% 90%,#ccfbf1,transparent 35%),#f8fafc;color:#0f172a}.card{width:min(560px,100%);background:#fff;border:1px solid #dbe3ef;border-radius:28px;overflow:hidden;box-shadow:0 28px 90px rgba(15,23,42,.16)}.head{padding:28px;background:linear-gradient(135deg,#0b2b66,#155eef 65%,#0891b2);color:#fff}.head h1{margin:0 0 8px;font-size:29px;letter-spacing:-.8px}.head p{margin:0;color:#dbeafe;font-size:12px;line-height:1.6}.body{padding:26px}.msg{display:none;padding:13px;border-radius:12px;font-size:12px;font-weight:800;line-height:1.55}.msg.show{display:block}.loading{background:#eff6ff;color:#24508a;border:1px solid #bfdbfe}.ok{background:#ecfdf5;color:#166534;border:1px solid #bbf7d0}.err{background:#fff1f2;color:#991b1b;border:1px solid #fecdd3}.hidden{display:none!important}.label{display:block;font-size:10px;font-weight:950;text-transform:uppercase;letter-spacing:.7px;color:#475569;margin:15px 0 7px}.input{width:100%;padding:14px;border:1px solid #cbd5e1;border-radius:13px;font-size:15px;font-weight:700;outline:none;background:#f8fafc}.input:focus{border-color:#60a5fa;background:#fff;box-shadow:0 0 0 4px #dbeafe}.btn{width:100%;margin-top:14px;border:0;border-radius:13px;padding:14px;background:#155eef;color:#fff;font-weight:950;cursor:pointer}.btn:disabled{opacity:.6}.links{display:flex;justify-content:center;gap:16px;margin-top:18px;padding-top:18px;border-top:1px solid #e2e8f0}.links a{color:#155eef;text-decoration:none;font-size:11px;font-weight:900}</style></head><body><main class="card"><section class="head"><h1>🔐 Create a new password</h1><p>Your secure recovery link has brought you here. Choose a new password of at least 8 characters.</p></section><section class="body"><div id="gate" class="msg show loading">Verifying secure recovery link…</div><div id="form" class="hidden"><label class="label" for="p1">NEW PASSWORD</label><input id="p1" class="input" type="password" minlength="8" autocomplete="new-password" placeholder="At least 8 characters"><label class="label" for="p2">CONFIRM NEW PASSWORD</label><input id="p2" class="input" type="password" minlength="8" autocomplete="new-password" placeholder="Enter the same password again"><button id="save" class="btn">UPDATE PASSWORD</button><div id="msg" class="msg" style="margin-top:14px"></div></div><div class="links"><a href="login-student.html">Student Login</a><a href="login-tutor.html">Tutor Login</a><a href="index.html">Website</a></div></section></main><script>
'use strict';
const U='https://hzqqswrnawrfgufbxgay.supabase.co',K='sb_publishable_Oc5HvqDpisv76XrdsyFhiw_IpostIDu';
const sb=supabase.createClient(U,K,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const gate=document.getElementById('gate'),form=document.getElementById('form'),msg=document.getElementById('msg'),save=document.getElementById('save');
function show(t,ok=false){msg.textContent=t;msg.className='msg show '+(ok?'ok':'err')}
function showForm(session){if(!session?.user||session.user.is_anonymous===true)return false;gate.className='msg hidden';form.classList.remove('hidden');document.getElementById('p1').focus();return true}
async function boot(){
 try{
   // Supabase may land the recovery flow on Site URL (homepage) depending on the
   // project's Redirect URL allow-list. This page accepts both implicit-token and PKCE code flows.
   const hash=new URLSearchParams((location.hash||'').replace(/^#/,''));
   const q=new URLSearchParams(location.search||'');
   if(hash.get('access_token')&&hash.get('refresh_token')){
     const r=await sb.auth.setSession({access_token:hash.get('access_token'),refresh_token:hash.get('refresh_token')});
     if(r.error)throw r.error; if(showForm(r.data?.session))return;
   }
   if(q.get('code')){
     const r=await sb.auth.exchangeCodeForSession(q.get('code'));
     if(r.error)throw r.error; if(showForm(r.data?.session))return;
   }
   // Some custom Supabase templates use token_hash + type=recovery.
   if(q.get('token_hash')&&q.get('type')==='recovery'){
     const r=await sb.auth.verifyOtp({token_hash:q.get('token_hash'),type:'recovery'});
     if(r.error)throw r.error; if(showForm(r.data?.session))return;
   }
   const s=await sb.auth.getSession();
   if(showForm(s.data?.session))return;
   gate.textContent='This password-reset link is missing or expired. Please request one new reset email and use the newest message.';
 }catch(e){gate.textContent='Reset link verification failed: '+(e.message||e)}
}
sb.auth.onAuthStateChange((event,session)=>{if(event==='PASSWORD_RECOVERY'||event==='SIGNED_IN')showForm(session)});
save.onclick=async()=>{
 const a=document.getElementById('p1').value,b=document.getElementById('p2').value;
 if(a.length<8)return show('Password must be at least 8 characters.');
 if(a!==b)return show('Passwords do not match.');
 save.disabled=true;save.textContent='UPDATING PASSWORD…';
 try{
   const q=await sb.auth.getSession(); if(!q.data?.session?.user)throw new Error('Secure recovery session is missing. Please request a new reset email.');
   const r=await sb.auth.updateUser({password:a}); if(r.error)throw r.error;
   show('✓ Password updated successfully. You can now sign in with your new password.',true);
   setTimeout(async()=>{try{await sb.auth.signOut({scope:'local'})}catch(_){}location.href='login-student.html'},1300);
 }catch(e){show('Password update failed: '+(e.message||e));save.disabled=false;save.textContent='UPDATE PASSWORD'}
};
boot();
</script></body></html>
