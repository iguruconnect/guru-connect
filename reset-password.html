<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>GURU CONNECT — Set New Password</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#eef5ff,#f8fbff);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#0f172a;padding:18px}
.card{width:min(500px,100%);background:#fff;border:1px solid #dbe5f0;border-radius:24px;padding:28px;box-shadow:0 25px 70px rgba(15,23,42,.14)}
.logo{width:100%;height:82px;object-fit:contain;object-position:left center}.eyebrow{font-size:11px;font-weight:900;letter-spacing:.12em;color:#155eef}.title{font-size:25px;font-weight:900;margin:6px 0}.sub{font-size:13px;line-height:1.55;color:#64748b}
label{display:block;font-size:12px;font-weight:800;margin:16px 0 7px}input{width:100%;padding:14px;border:1px solid #cbd5e1;border-radius:12px;font-size:16px;outline:0}input:focus{border-color:#2563eb;box-shadow:0 0 0 3px #2563eb18}
button{width:100%;margin-top:14px;padding:14px;border:0;border-radius:12px;background:#155eef;color:#fff;font-weight:900;font-size:14px;cursor:pointer}button:disabled{opacity:.6}
.msg{margin-top:14px;padding:12px;border-radius:12px;font-size:12px;font-weight:700;line-height:1.5}.ok{background:#ecfdf5;color:#047857;border:1px solid #a7f3d0}.bad{background:#fef2f2;color:#991b1b;border:1px solid #fecaca}.info{background:#eff6ff;color:#1e3a8a;border:1px solid #bfdbfe}
a{display:block;text-align:center;margin-top:16px;color:#155eef;text-decoration:none;font-size:12px;font-weight:800}
</style>
</head>
<body>
<main class="card">
<img class="logo" src="guru-connect-brand.png" alt="GURU CONNECT">
<div class="eyebrow">SECURE ACCOUNT RECOVERY</div>
<div class="title">Set a new password</div>
<div class="sub" id="status">Checking your recovery link…</div>
<div id="form" style="display:none">
<label for="password">NEW PASSWORD</label>
<input id="password" type="password" autocomplete="new-password" minlength="8" placeholder="Minimum 8 characters">
<label for="confirm">CONFIRM NEW PASSWORD</label>
<input id="confirm" type="password" autocomplete="new-password" minlength="8" placeholder="Repeat the new password">
<button id="save">SAVE NEW PASSWORD</button>
</div>
<div id="msg"></div>
<a href="login-staff.html">← Back to Admin Login</a>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
'use strict';
const URL='https://hzqqswrnawrfgufbxgay.supabase.co';
const KEY='sb_publishable_Oc5HvqDpisv76XrdsyFhiw_IpostIDu';
const sb=supabase.createClient(URL,KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,flowType:'implicit'}});
const status=document.getElementById('status'),form=document.getElementById('form'),password=document.getElementById('password'),confirm=document.getElementById('confirm'),save=document.getElementById('save'),msg=document.getElementById('msg');
function show(kind,text){msg.className='msg '+kind;msg.textContent=text}
function showForm(){form.style.display='block';status.textContent='Recovery verified. Choose a new password.';}
async function check(){
 try{
   const {data,error}=await sb.auth.getSession();
   if(error)throw error;
   if(data.session){showForm();return true}
   return false;
 }catch(e){console.error(e);return false}
}
sb.auth.onAuthStateChange(function(event,session){if(event==='PASSWORD_RECOVERY'&&session)showForm()});
(async function(){
 let ok=await check();
 if(!ok){
   await new Promise(r=>setTimeout(r,800));
   ok=await check();
 }
 if(!ok){status.textContent='This reset link is missing or expired.';show('bad','Please return to Admin Login and request a fresh reset email. Use the newest email only.');}
})();
save.onclick=async function(){
 const p=password.value,c=confirm.value;
 if(p.length<8){show('bad','Password must be at least 8 characters.');return}
 if(p!==c){show('bad','Passwords do not match.');return}
 save.disabled=true;save.textContent='SAVING…';
 try{
   const {data}=await sb.auth.getSession();
   if(!data.session)throw new Error('Recovery session is missing or expired.');
   const {error}=await sb.auth.updateUser({password:p});
   if(error)throw error;
   form.style.display='none';
   status.textContent='Password reset complete.';
   show('ok','✓ Password changed successfully. You can now log in with your new password.');
   setTimeout(function(){location.href='login-staff.html?reset=success'},1200);
 }catch(e){console.error(e);show('bad','Password update failed: '+(e&&e.message?e.message:e));}
 finally{save.disabled=false;save.textContent='SAVE NEW PASSWORD'}
};
})();
</script>
</body>
</html>
