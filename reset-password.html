<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GURU CONNECT — Reset Password</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:Arial,sans-serif;background:#f3f6fb;display:flex;align-items:center;justify-content:center;padding:20px;color:#172033}
.card{width:100%;max-width:430px;background:#fff;border-radius:18px;padding:30px;box-shadow:0 12px 40px rgba(0,0,0,.12)}
.logo{text-align:center;font-size:25px;font-weight:800;color:#2563eb;margin-bottom:8px}
h1{text-align:center;font-size:22px;margin:8px 0 22px}
label{display:block;font-weight:700;margin:14px 0 7px}
input{width:100%;padding:13px;border:1px solid #ccd4e0;border-radius:10px;font-size:16px}
button{width:100%;border:0;border-radius:10px;padding:14px;background:#2563eb;color:#fff;font-size:16px;font-weight:800;cursor:pointer;margin-top:20px}
button:disabled{opacity:.55;cursor:not-allowed}
.msg{margin-top:15px;padding:12px;border-radius:10px;display:none;line-height:1.45;font-size:14px}
.ok{display:block;background:#eaf7ef;color:#17663a}
.err{display:block;background:#fff0f0;color:#a11b1b}
.info{display:block;background:#eef5ff;color:#174b91}
.small{text-align:center;font-size:13px;color:#697386;margin-top:15px}
.hidden{display:none!important}
</style>
</head>
<body>
<div class="card">
  <div class="logo">GURU CONNECT</div>
  <h1>Reset your password</h1>

  <div id="status" class="msg info">Checking your secure reset link…</div>

  <form id="form" class="hidden">
    <label for="password">New password</label>
    <input id="password" type="password" minlength="6" autocomplete="new-password" required>

    <label for="confirm">Confirm new password</label>
    <input id="confirm" type="password" minlength="6" autocomplete="new-password" required>

    <button id="update" type="submit">UPDATE PASSWORD</button>
  </form>

  <div id="done" class="msg ok hidden"></div>
  <div class="small">For your security, reset links are single-use.</div>
</div>

<script>
const SUPABASE_URL = "https://hzqqswrnawrfgufbxgay.supabase.co";
const SUPABASE_KEY = "sb_publishable_Oc5HvqDpisv76XrdsyFhiw_IpostIDu";
const REDIRECT_URL = "https://www.guruconnnect.in/reset-password.html";

const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
  auth: {
    persistSession: true,
    autoRefreshToken: true,
    detectSessionInUrl: true,
    flowType: "pkce"
  }
});

const statusEl = document.getElementById("status");
const form = document.getElementById("form");
const done = document.getElementById("done");

function showStatus(text, type="info"){
  statusEl.textContent = text;
  statusEl.className = "msg " + type;
}
function showForm(){ statusEl.className="msg hidden"; form.classList.remove("hidden"); }
function cleanUrl(){
  try{ history.replaceState({}, document.title, window.location.pathname); }catch(e){}
}

async function startRecovery(){
  try{
    // 1) PKCE/code flow: exchange the one-time code for a session.
    const params = new URLSearchParams(window.location.search);
    const code = params.get("code");
    if(code){
      const {error} = await supabaseClient.auth.exchangeCodeForSession(code);
      if(error) throw error;
      const {data:{session}} = await supabaseClient.auth.getSession();
      if(session && session.user){
        showForm();
        cleanUrl();
        return;
      }
    }

    // 2) Implicit recovery flow: Supabase may put access_token/refresh_token in hash.
    // Supabase JS with detectSessionInUrl normally consumes this automatically.
    const hash = window.location.hash || "";
    if(hash.includes("access_token=")){
      // Give the SDK a moment to process the hash.
      await new Promise(r=>setTimeout(r,900));
    }

    const {data:{session}, error} = await supabaseClient.auth.getSession();
    if(error) throw error;

    if(session && session.user){
      // Do not accept an anonymous session as a recovery session.
      const identities = session.user.identities || [];
      const isAnonymous = session.user.is_anonymous === true ||
                          identities.length === 0;
      if(isAnonymous){
        await supabaseClient.auth.signOut({scope:"local"}).catch(()=>{});
        throw new Error("This is not a valid password recovery session. Please request a fresh reset link.");
      }

      showForm();
      cleanUrl();
      return;
    }

    throw new Error("The reset link is missing, expired, or has already been used. Please request a fresh reset link from GURU CONNECT.");
  }catch(err){
    console.error("Recovery initialization:", err);
    form.classList.add("hidden");
    showStatus(err?.message || "The reset link is invalid or expired. Please request a fresh reset link.", "err");
  }
}

form.addEventListener("submit", async (e)=>{
  e.preventDefault();

  const password = document.getElementById("password").value;
  const confirm = document.getElementById("confirm").value;

  if(password.length < 6){
    showStatus("Password must be at least 6 characters.", "err");
    return;
  }
  if(password !== confirm){
    showStatus("Passwords do not match.", "err");
    return;
  }

  const btn = document.getElementById("update");
  btn.disabled = true;
  btn.textContent = "UPDATING…";
  showStatus("Updating your password…","info");

  try{
    const {data:{session}} = await supabaseClient.auth.getSession();
    if(!session || !session.user){
      throw new Error("Your recovery session is no longer valid. Please request a fresh reset link.");
    }

    const identities = session.user.identities || [];
    if(session.user.is_anonymous === true || identities.length === 0){
      throw new Error("Anonymous sessions cannot reset a password. Please request a fresh reset link.");
    }

    const {error} = await supabaseClient.auth.updateUser({password});
    if(error) throw error;

    form.classList.add("hidden");
    statusEl.className="msg hidden";
    done.textContent="Password updated successfully. You can now log in with your new password.";
    done.classList.remove("hidden");

    setTimeout(async ()=>{
      await supabaseClient.auth.signOut({scope:"local"}).catch(()=>{});
      window.location.href = "https://www.guruconnnect.in/";
    }, 2200);

  }catch(err){
    console.error("Password update:", err);
    showStatus(err?.message || "Updating password failed. Please request a fresh reset link.", "err");
    btn.disabled = false;
    btn.textContent = "UPDATE PASSWORD";
  }
});

supabaseClient.auth.onAuthStateChange((event, session)=>{
  if(event === "PASSWORD_RECOVERY" && session && session.user){
    showForm();
    cleanUrl();
  }
});

startRecovery();
</script>
</body>
</html>
