<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reset Password — GURU CONNECT</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial,Helvetica,sans-serif;background:linear-gradient(135deg,#0f1f4f,#2563eb 55%,#06b6d4);display:flex;align-items:center;justify-content:center;padding:20px}.card{width:min(470px,100%);background:#fff;border-radius:26px;padding:30px;box-shadow:0 25px 70px rgba(0,0,0,.25)}h1{text-align:center;font-size:25px;margin:8px 0}.sub{text-align:center;color:#64748b;font-size:13px;font-weight:700;margin-bottom:22px}.field{margin:13px 0}.field label{display:block;font-size:11px;font-weight:900;color:#475569;margin-bottom:6px}.field input{width:100%;padding:14px;border:1px solid #cbd5e1;border-radius:13px;font-size:15px;font-weight:700}button{width:100%;border:0;border-radius:13px;padding:14px;background:#2563eb;color:#fff;font-weight:950;cursor:pointer;margin-top:8px}.back{background:#f1f5f9;color:#334155}.msg{display:none;margin-top:14px;padding:12px;border-radius:12px;font-size:12px;font-weight:800}.ok{display:block;background:#ecfdf5;color:#047857}.err{display:block;background:#fff1f2;color:#be123c}.icon{width:62px;height:62px;margin:0 auto;border-radius:18px;background:#2563eb;color:#fff;display:flex;align-items:center;justify-content:center;font-size:28px}
</style>
</head>
<body>
<div class="card">
  <div class="icon">🔐</div>
  <h1>Create New Password</h1>
  <div class="sub">GURU CONNECT secure password reset</div>
  <div class="field"><label>NEW PASSWORD</label><input id="pw1" type="password" autocomplete="new-password" placeholder="Minimum 8 characters"></div>
  <div class="field"><label>CONFIRM PASSWORD</label><input id="pw2" type="password" autocomplete="new-password" placeholder="Re-enter new password"></div>
  <button id="save" type="button">UPDATE PASSWORD</button>
  <button class="back" type="button" onclick="location.href='index.html'">BACK TO WEBSITE</button>
  <div id="msg" class="msg"></div>
</div>
<script>
const SUPABASE_URL='https://hzqqswrnawrfgufbxgay.supabase.co';
const SUPABASE_KEY='sb_publishable_Oc5HvqDpisv76XrdsyFhiw_IpostIDu';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,flowType:'implicit'}});
const msg=document.getElementById('msg'),save=document.getElementById('save'),pw1=document.getElementById('pw1'),pw2=document.getElementById('pw2');
let recoveryReady=false, bootDone=false;
function show(t,ok){msg.textContent=t;msg.className='msg '+(ok?'ok':'err');msg.style.display='block'}
async function establishRecoverySession(){
  try{
    const u=new URL(location.href);
    const hash=new URLSearchParams((location.hash||'').replace(/^#/,'?'));
    const code=u.searchParams.get('code');
    const access=hash.get('access_token');
    const refresh=hash.get('refresh_token');
    const tokenHash=u.searchParams.get('token_hash')||hash.get('token_hash');
    const type=u.searchParams.get('type')||hash.get('type');
    if(code){
      const ex=await sb.auth.exchangeCodeForSession(code);
      if(ex.error)throw ex.error;
      if(ex.data?.session)recoveryReady=true;
    }else if(access&&refresh){
      const ss=await sb.auth.setSession({access_token:access,refresh_token:refresh});
      if(ss.error)throw ss.error;
      if(ss.data?.session)recoveryReady=true;
    }else if(tokenHash && type==='recovery'){
      const vr=await sb.auth.verifyOtp({token_hash:tokenHash,type:'recovery'});
      if(vr.error)throw vr.error;
      if(vr.data?.session)recoveryReady=true;
    }
    const gs=await sb.auth.getSession();
    if(gs.data?.session)recoveryReady=true;
    if(!recoveryReady){
      show('This reset link is expired or invalid. Please request a new reset link from LOGIN → Forgot password.',false);
      save.disabled=true;
      return false;
    }
    show('Recovery verified. Enter your new password.',true);
    return true;
  }catch(e){
    console.error('Recovery session error',e);
    show('Unable to verify this reset link: '+(e.message||e),false);
    save.disabled=true;
    return false;
  }
}
sb.auth.onAuthStateChange((event,session)=>{
  if((event==='PASSWORD_RECOVERY'||event==='SIGNED_IN')&&session){
    recoveryReady=true;
    if(!bootDone)show('Recovery verified. Enter your new password.',true);
    save.disabled=false;
  }
});

save.onclick=async function(){
  const a=pw1.value,b=pw2.value;
  if(a.length<8)return show('Password must be at least 8 characters.',false);
  if(a!==b)return show('Passwords do not match.',false);
  save.disabled=true;save.textContent='UPDATING…';
  try{
    const gs=await sb.auth.getSession();
    if(!gs.data?.session)throw new Error('Recovery session is missing or expired. Please request a new reset link.');
    const r=await sb.auth.updateUser({password:a});
    if(r.error)throw r.error;
    show('Password updated successfully. You can now login with your new password.',true);
    pw1.value='';pw2.value='';
    setTimeout(async()=>{try{await sb.auth.signOut()}catch(_){}location.href='index.html'},1400);
  }catch(e){
    console.error('Password update failed',e);
    show('Password update failed: '+(e.message||e),false);
    save.disabled=false;
  }finally{save.textContent='UPDATE PASSWORD';}
};
(async()=>{bootDone=true;await establishRecoverySession()})();
</script>
</body></html>
