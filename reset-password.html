<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GURU CONNECT — Reset Password</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;font-family:Arial,sans-serif;background:#f1f5f9;min-height:100vh;display:grid;place-items:center;padding:20px}.card{width:min(430px,100%);background:#fff;border-radius:24px;padding:28px;box-shadow:0 20px 50px #0f172a22}h1{margin:0 0 8px;font-size:24px}p{color:#64748b;font-size:14px}input{width:100%;box-sizing:border-box;padding:14px;border:1px solid #cbd5e1;border-radius:12px;margin:7px 0;font-size:15px}button{width:100%;padding:14px;border:0;border-radius:12px;background:#2563eb;color:#fff;font-weight:800;margin-top:10px;cursor:pointer}button:disabled{opacity:.6}#status{margin-top:14px;font-size:13px;font-weight:700;color:#475569}.ok{color:#059669!important}.err{color:#dc2626!important}</style></head><body><main class="card"><h1>🔐 Create New Password</h1><p id="desc">Enter your new password below.</p><div id="form"><input id="p1" type="password" autocomplete="new-password" minlength="8" placeholder="New password (8+ characters)"><input id="p2" type="password" autocomplete="new-password" minlength="8" placeholder="Confirm new password"><button id="update" disabled>UPDATE PASSWORD</button></div><div id="status">Checking secure reset session…</div></main><script>
const URL='https://hzqqswrnawrfgufbxgay.supabase.co',KEY='sb_publishable_Oc5HvqDpisv76XrdsyFhiw_IpostIDu';
const supabaseClient=supabase.createClient(URL,KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const $=id=>document.getElementById(id),status=(m,c)=>{$('status').textContent=m;$('status').className=c||''};
let ready=false;
async function establish(){
 try{
  // Supabase v2 can exchange the recovery URL automatically. If a code is present, exchange it explicitly.
  const u=new URL(location.href), code=u.searchParams.get('code');
  if(code){const r=await supabaseClient.auth.exchangeCodeForSession(code);if(r.error)throw r.error;}
  const s=await supabaseClient.auth.getSession();
  if(s.data?.session){ready=true;$('update').disabled=false;status('Secure reset session ready. Enter your new password.','ok');return true;}
  // Give the URL-token processing a little time on slow browsers/CDNs.
  await new Promise(r=>setTimeout(r,900));
  const s2=await supabaseClient.auth.getSession();
  if(s2.data?.session){ready=true;$('update').disabled=false;status('Secure reset session ready. Enter your new password.','ok');return true;}
  status('This reset link is expired or invalid. Request a new reset link.','err');return false;
 }catch(e){console.error(e);status('Could not open the secure reset session: '+(e.message||e),'err');return false}
}
supabaseClient.auth.onAuthStateChange((event,session)=>{if(event==='PASSWORD_RECOVERY'&&session){ready=true;$('update').disabled=false;status('Secure reset session ready. Enter your new password.','ok');}});
$('update').addEventListener('click',async()=>{if(!ready)return status('Reset session is not ready. Please open the email link again.','err');const a=$('p1').value,b=$('p2').value;if(a.length<8)return status('Password must be at least 8 characters.','err');if(a!==b)return status('Passwords do not match.','err');const btn=$('update');btn.disabled=true;btn.textContent='UPDATING…';try{const r=await supabaseClient.auth.updateUser({password:a});if(r.error)throw r.error;status('Password updated successfully. Redirecting to login…','ok');await supabaseClient.auth.signOut();setTimeout(()=>location.href='index.html',1200);}catch(e){status('Update failed: '+(e.message||e),'err');btn.disabled=false;btn.textContent='UPDATE PASSWORD';}});
establish();
</script></body></html>
