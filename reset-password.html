<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GURU CONNECT — Set New Password</title><link rel="preconnect" href="https://cdn.jsdelivr.net"><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(135deg,#f7fbff,#eef4ff);font-family:Inter,Arial,sans-serif;color:#0f172a}.card{width:min(460px,100%);background:#fff;border:1px solid #dbe5f0;border-radius:24px;box-shadow:0 20px 60px rgba(15,61,145,.12);padding:28px}.logo{display:block;width:min(230px,70%);max-height:120px;object-fit:contain;margin:0 auto 16px}.title{text-align:center;font-size:25px;font-weight:900;color:#0f3d91}.sub{text-align:center;color:#64748b;font-size:13px;line-height:1.5;margin:8px 0 22px}.label{display:block;font-size:12px;font-weight:900;color:#334155;margin:14px 0 6px}.input{width:100%;border:1px solid #cbd5e1;border-radius:13px;padding:13px 14px;font-size:14px;outline:none}.input:focus{border-color:#2563eb;box-shadow:0 0 0 3px #2563eb18}.btn{width:100%;border:0;border-radius:13px;padding:14px;margin-top:18px;background:#2563eb;color:#fff;font-size:14px;font-weight:900;cursor:pointer}.btn:disabled{opacity:.6}.msg{display:none;margin-top:14px;padding:12px;border-radius:12px;font-size:12px;line-height:1.5;font-weight:700}.msg.show{display:block}.ok{background:#ecfdf5;color:#166534;border:1px solid #bbf7d0}.err{background:#fff1f2;color:#991b1b;border:1px solid #fecdd3}.back{display:block;text-align:center;margin-top:18px;color:#155eef;font-size:12px;font-weight:900;text-decoration:none}</style></head><body><main class="card"><img class="logo" src="guru-connect-round-logo.png" alt="GURU CONNECT"><div class="title">Set New Password</div><div class="sub">Your secure password-reset link has been confirmed. Create a new password below.</div><label class="label" for="p1">NEW PASSWORD</label><input id="p1" class="input" type="password" minlength="8" autocomplete="new-password" placeholder="At least 8 characters"><label class="label" for="p2">CONFIRM NEW PASSWORD</label><input id="p2" class="input" type="password" minlength="8" autocomplete="new-password" placeholder="Enter the same password again"><button id="save" class="btn" type="button">UPDATE PASSWORD</button><div id="msg" class="msg"></div><a class="back" href="index.html">← Back to GURU CONNECT</a></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
'use strict';
const sb=supabase.createClient('https://hzqqswrnawrfgufbxgay.supabase.co','sb_publishable_Oc5HvqDpisv76XrdsyFhiw_IpostIDu',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const $=id=>document.getElementById(id),msg=$('msg');function show(t,ok){msg.textContent=t;msg.className='msg show '+(ok?'ok':'err')}
let ready=false;
function checkSession(){sb.auth.getSession().then(({data})=>{if(data?.session){ready=true;show('✓ Recovery link verified. You can now set your new password.',true)}else show('Open this page from the newest GURU CONNECT password-reset email. The recovery link may have expired.',false)}).catch(e=>show('Recovery session could not be verified: '+(e.message||e),false))}
sb.auth.onAuthStateChange((event,session)=>{if(event==='PASSWORD_RECOVERY'&&session){ready=true;show('✓ Recovery link verified. You can now set your new password.',true)}});checkSession();
$('save').onclick=async()=>{const a=$('p1').value,b=$('p2').value,btn=$('save');if(a.length<8)return show('Password must be at least 8 characters.');if(a!==b)return show('Passwords do not match.');if(!ready){const q=await sb.auth.getSession();if(!q.data?.session)return show('Recovery session is missing. Please request a new password-reset email.');}btn.disabled=true;btn.textContent='UPDATING PASSWORD…';try{const r=await sb.auth.updateUser({password:a});if(r.error)throw r.error;show('✓ Password updated successfully. Redirecting to login…',true);setTimeout(async()=>{try{await sb.auth.signOut({scope:'local'})}catch(_){}location.href='index.html'},1200)}catch(e){show('Password update failed: '+(e.message||e),false);btn.disabled=false;btn.textContent='UPDATE PASSWORD'}};
</script></body></html>
