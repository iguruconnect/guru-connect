<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GURU CONNECT — Reset Password</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(135deg,#eef5ff,#f8fbff);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;box-sizing:border-box}.card{width:min(460px,100%);background:#fff;border-radius:24px;padding:32px;box-shadow:0 20px 60px rgba(15,23,42,.18);text-align:center}.logo{font-size:28px;font-weight:900;color:#1459d9}.sub{color:#64748b;font-size:14px;margin:8px 0 24px}input{width:100%;box-sizing:border-box;padding:14px;border:1px solid #dbe2ea;border-radius:12px;margin:7px 0;font-size:15px;font-weight:600}button{width:100%;padding:14px;border:0;border-radius:12px;background:#2563eb;color:#fff;font-weight:900;font-size:14px;margin-top:12px;cursor:pointer}.back{background:#f1f5f9;color:#334155}.msg{min-height:20px;margin-top:14px;font-size:13px;font-weight:700}.ok{color:#059669}.err{color:#dc2626}</style></head>
<body><div class="card"><div class="logo">GURU CONNECT</div><div class="sub">Create a new password for your account</div><input id="p1" type="password" minlength="8" placeholder="New password (8+ characters)" autocomplete="new-password"><input id="p2" type="password" minlength="8" placeholder="Confirm new password" autocomplete="new-password"><button id="save">UPDATE PASSWORD</button><button class="back" onclick="location.href='https://www.guruconnnect.in/'">BACK TO WEBSITE</button><div id="msg" class="msg"></div></div>
<script>
const URL='https://hzqqswrnawrfgufbxgay.supabase.co',KEY='sb_publishable_Oc5HvqDpisv76XrdsyFhiw_IpostIDu';
const sb=supabase.createClient(URL,KEY);const msg=document.getElementById('msg');
function show(t,c){msg.className='msg '+(c||'');msg.textContent=t}
async function init(){
  // With Supabase implicit recovery links, the access token is in the URL hash. The
  // client library consumes it and emits PASSWORD_RECOVERY.
  let ready=false;
  sb.auth.onAuthStateChange((event,session)=>{if(event==='PASSWORD_RECOVERY'&&session)ready=true;});
  const h=location.hash||'';
  if(/access_token=/.test(h)||/type=recovery/.test(h)){
    const {data:{session}}=await sb.auth.getSession();
    ready=!!session;
  } else {
    const {data:{session}}=await sb.auth.getSession();
    ready=!!session;
  }
  if(!ready)show('Open this page from the latest password reset email link.','err');
}
document.getElementById('save').onclick=async()=>{const a=p1.value,b=p2.value;if(a.length<8)return show('Password must be at least 8 characters.','err');if(a!==b)return show('Passwords do not match.','err');const {data:{session}}=await sb.auth.getSession();if(!session)return show('Reset session expired. Please request a new reset email.','err');const {error}=await sb.auth.updateUser({password:a});if(error)return show(error.message,'err');show('Password updated successfully. You can now login.','ok');setTimeout(async()=>{await sb.auth.signOut();location.href='https://www.guruconnnect.in/index.html';},1200)};
init();
</script></body></html>
