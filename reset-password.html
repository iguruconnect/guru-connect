<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Update Password — GURU CONNECT</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial,Helvetica,sans-serif;background:linear-gradient(135deg,#0f1f4f,#2563eb 55%,#06b6d4);display:flex;align-items:center;justify-content:center;padding:20px}.card{width:min(470px,100%);background:#fff;border-radius:26px;padding:30px;box-shadow:0 25px 70px rgba(0,0,0,.25)}h1{text-align:center;font-size:25px;margin:8px 0}.sub{text-align:center;color:#64748b;font-size:13px;font-weight:700;margin-bottom:22px}.field{margin:13px 0}.field label{display:block;font-size:11px;font-weight:900;color:#475569;margin-bottom:6px}.field input{width:100%;padding:14px;border:1px solid #cbd5e1;border-radius:13px;font-size:15px;font-weight:700}button{width:100%;border:0;border-radius:13px;padding:14px;background:#2563eb;color:#fff;font-weight:950;cursor:pointer;margin-top:8px}.back{background:#f1f5f9;color:#334155}.msg{display:block;margin-top:14px;padding:12px;border-radius:12px;font-size:12px;font-weight:800;background:#eff6ff;color:#1d4ed8}.ok{background:#ecfdf5;color:#047857}.err{background:#fff1f2;color:#be123c}.icon{width:62px;height:62px;margin:0 auto;border-radius:18px;background:#2563eb;color:#fff;display:flex;align-items:center;justify-content:center;font-size:28px}.disabled{opacity:.6;cursor:not-allowed}
</style>
</head>
<body>
<div class="card">
  <div class="icon">🔐</div>
  <h1>Update Password</h1>
  <div class="sub">GURU CONNECT secure password reset</div>
  <div class="field"><label>NEW PASSWORD</label><input id="pw1" type="password" autocomplete="new-password" placeholder="Minimum 8 characters"></div>
  <div class="field"><label>CONFIRM PASSWORD</label><input id="pw2" type="password" autocomplete="new-password" placeholder="Re-enter new password"></div>
  <button id="save" type="button">UPDATE PASSWORD</button>
  <button class="back" type="button" onclick="location.href='index.html'">BACK TO WEBSITE</button>
  <div id="msg" class="msg">Checking your password-reset link…</div>
</div>
<script>
'use strict';
const SUPABASE_URL='https://hzqqswrnawrfgufbxgay.supabase.co';
const SUPABASE_KEY='sb_publishable_Oc5HvqDpisv76XrdsyFhiw_IpostIDu';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,flowType:'pkce'}});
const msg=document.getElementById('msg'),save=document.getElementById('save'),pw1=document.getElementById('pw1'),pw2=document.getElementById('pw2');
let recoveryReady=false,working=false;
function show(text,kind){msg.textContent=text;msg.className='msg '+(kind||'');}
function setReady(){recoveryReady=true;save.disabled=false;save.classList.remove('disabled');show('Reset link verified. Enter your new password.','ok');}
function setError(text){recoveryReady=false;save.disabled=false;save.classList.remove('disabled');show(text,'err');}
async function ensureSession(){
  const url=new URL(location.href);
  const hash=new URLSearchParams((location.hash||'').replace(/^#/,'').replace(/^\?/,'').replace(/&amp;/g,'&'));
  const access=hash.get('access_token'),refresh=hash.get('refresh_token'),type=hash.get('type')||url.searchParams.get('type');
  const code=url.searchParams.get('code');
  const tokenHash=url.searchParams.get('token_hash')||hash.get('token_hash');
  try{
    let g=await sb.auth.getSession();
    if(g.data&&g.data.session)return true;
    if(access&&refresh){const r=await sb.auth.setSession({access_token:access,refresh_token:refresh});if(r.error)throw r.error;return !!r.data.session;}
    if(code){const r=await sb.auth.exchangeCodeForSession(code);if(r.error)throw r.error;return !!r.data.session;}
    if(tokenHash&&type==='recovery'){const r=await sb.auth.verifyOtp({token_hash:tokenHash,type:'recovery'});if(r.error)throw r.error;return !!r.data.session;}
    for(let i=0;i<25;i++){g=await sb.auth.getSession();if(g.data&&g.data.session)return true;await new Promise(r=>setTimeout(r,200));}
    return false;
  }catch(e){throw e;}
}
sb.auth.onAuthStateChange(function(event,session){if(session&&(event==='PASSWORD_RECOVERY'||event==='SIGNED_IN'||event==='INITIAL_SESSION'))setReady();});
async function boot(){
  try{
    const ok=await ensureSession();
    if(ok)setReady();else setError('This reset link is missing or expired. Please request a new reset link.');
  }catch(e){console.error(e);setError('Reset link could not be verified: '+(e.message||e));}
}
save.addEventListener('click',async function(){
  if(working)return;
  const a=pw1.value,b=pw2.value;
  if(a.length<8){show('Password must be at least 8 characters.','err');return;}
  if(a!==b){show('Passwords do not match.','err');return;}
  working=true;save.disabled=true;save.classList.add('disabled');save.textContent='UPDATING…';
  try{
    let g=await sb.auth.getSession();
    if(!g.data||!g.data.session){const ok=await ensureSession();if(!ok)throw new Error('Recovery session is missing or expired. Please request a new reset link.');}
    const r=await sb.auth.updateUser({password:a});
    if(r.error)throw r.error;
    show('PASSWORD UPDATED SUCCESSFULLY. Redirecting to login…','ok');
    pw1.value='';pw2.value='';
    setTimeout(async()=>{try{await sb.auth.signOut()}catch(_){} location.href='index.html';},1200);
  }catch(e){console.error('Update password failed:',e);show('UPDATE PASSWORD FAILED: '+(e.message||e),'err');save.disabled=false;save.classList.remove('disabled');save.textContent='UPDATE PASSWORD';working=false;}
});
boot();
</script>
</body>
</html>
