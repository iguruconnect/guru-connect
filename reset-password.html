<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GURU CONNECT — Set New Password</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(135deg,#f7fbff,#eef4ff);font-family:Inter,Arial,sans-serif;color:#0f172a}.card{width:min(460px,100%);background:#fff;border:1px solid #dbe5f0;border-radius:24px;box-shadow:0 20px 60px rgba(15,61,145,.12);padding:28px}.logo{display:block;width:min(250px,75%);max-height:130px;object-fit:contain;margin:0 auto 16px}.eyebrow{text-align:center;font-size:13px;font-weight:900;letter-spacing:.08em;color:#155eef}.title{text-align:center;font-size:28px;font-weight:900;color:#0f172a;margin-top:6px}.sub{text-align:center;color:#64748b;font-size:14px;line-height:1.55;margin:8px 0 22px}.label{display:block;font-size:13px;font-weight:900;color:#334155;margin:14px 0 7px}.input{width:100%;border:1px solid #cbd5e1;border-radius:13px;padding:14px;font-size:16px;outline:none}.input:focus{border-color:#2563eb;box-shadow:0 0 0 3px #2563eb18}.btn{width:100%;border:0;border-radius:13px;padding:15px;margin-top:18px;background:#2563eb;color:#fff;font-size:15px;font-weight:900;cursor:pointer}.btn:disabled{opacity:.6;cursor:wait}.msg{display:none;margin-top:14px;padding:13px;border-radius:12px;font-size:13px;line-height:1.5;font-weight:700}.msg.show{display:block}.ok{background:#ecfdf5;color:#166534;border:1px solid #bbf7d0}.err{background:#fff1f2;color:#991b1b;border:1px solid #fecdd3}.back{display:block;text-align:center;margin-top:18px;color:#155eef;font-size:13px;font-weight:900;text-decoration:none}
</style>
</head>
<body>
<main class="card">
<img class="logo" src="guru-connect-round-logo.png" alt="GURU CONNECT">
<div class="eyebrow">SECURE ACCOUNT RECOVERY</div>
<div class="title">Set a new password</div>
<div class="sub">Open this page from the newest GURU CONNECT password-reset email, then choose your new password.</div>
<label class="label" for="p1">NEW PASSWORD</label>
<input id="p1" class="input" type="password" minlength="8" autocomplete="new-password" placeholder="At least 8 characters">
<label class="label" for="p2">CONFIRM NEW PASSWORD</label>
<input id="p2" class="input" type="password" minlength="8" autocomplete="new-password" placeholder="Enter the same password again">
<button id="save" class="btn" type="button" disabled>VERIFYING RECOVERY LINK…</button>
<div id="msg" class="msg"></div>
<a class="back" href="index.html">← Back to GURU CONNECT</a>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
'use strict';
const SUPABASE_URL='https://hzqqswrnawrfgufbxgay.supabase.co';
const SUPABASE_KEY='sb_publishable_Oc5HvqDpisv76XrdsyFhiw_IpostIDu';
// Recovery links can be opened from a mail app, a different browser tab, or a
// security scanner. Do not depend on the browser having an earlier session.
// We also disable Supabase's automatic URL handling so we can explicitly handle
// both the implicit (#access_token=...) and PKCE (?code=...) recovery formats.
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false,flowType:'implicit'}});
const $=id=>document.getElementById(id),msg=$('msg'),save=$('save');
function show(t,ok=false){msg.textContent=t;msg.className='msg show '+(ok?'ok':'err')}
let recoveryReady=false,resolving=false;

async function getRecoverySession(){
  // 1) Supabase implicit recovery link: tokens are in the URL fragment.
  const hash=new URLSearchParams((location.hash||'').replace(/^#/,'').replace(/^\?/ ,''));
  const accessToken=hash.get('access_token');
  const refreshToken=hash.get('refresh_token');
  const type=hash.get('type');
  if(accessToken && refreshToken && (!type || type==='recovery')){
    const r=await sb.auth.setSession({access_token:accessToken,refresh_token:refreshToken});
    if(r.error) throw r.error;
    history.replaceState({},document.title,location.pathname+location.search);
    return r.data.session;
  }

  // 2) Supabase PKCE recovery link: ?code=... . This works when the reset
  // request and the email link are opened in the same browser context.
  const url=new URL(location.href);
  const code=url.searchParams.get('code');
  if(code){
    const r=await sb.auth.exchangeCodeForSession(code);
    if(r.error) throw r.error;
    url.searchParams.delete('code');
    history.replaceState({},document.title,url.pathname+(url.search?'?'+url.searchParams.toString():''));
    return r.data.session;
  }

  return (await sb.auth.getSession()).data?.session||null;
}

async function resolveRecovery(){
  if(resolving) return recoveryReady;
  resolving=true;
  try{
    const session=await getRecoverySession();
    const user=session?.user;
    if(!user || !user.email || user.is_anonymous){
      recoveryReady=false;
      save.disabled=true;save.textContent='RECOVERY LINK REQUIRED';
      show('This password page is not holding a valid recovery session. Please click the newest password-reset email link again. If you opened an older link, request a new reset email.',false);
      return false;
    }

    // Confirm the session against Supabase before enabling the password update.
    const verified=await sb.auth.getUser();
    if(verified.error || !verified.data?.user?.email){
      throw verified.error || new Error('Recovery session could not be verified.');
    }
    recoveryReady=true;
    save.disabled=false;save.textContent='SAVE NEW PASSWORD';
    show('✓ Recovery verified for '+verified.data.user.email+'. You can now set your new password.',true);
    return true;
  }catch(e){
    console.error('Recovery verification failed:',e);
    recoveryReady=false;save.disabled=true;save.textContent='RECOVERY LINK REQUIRED';
    show('Recovery link could not be verified. Please request a new reset email and open the newest link.',false);
    return false;
  }finally{resolving=false}
}

sb.auth.onAuthStateChange(async(event,session)=>{
  if(event==='PASSWORD_RECOVERY' && session?.user?.email && !session.user.is_anonymous){
    recoveryReady=true;save.disabled=false;save.textContent='SAVE NEW PASSWORD';
    show('✓ Recovery verified for '+session.user.email+'. You can now set your new password.',true);
  }
});

save.onclick=async()=>{
  const a=$('p1').value,b=$('p2').value;
  if(!recoveryReady){await resolveRecovery();if(!recoveryReady)return}
  if(a.length<8)return show('Password must be at least 8 characters.');
  if(a!==b)return show('Passwords do not match.');
  save.disabled=true;save.textContent='SAVING PASSWORD…';
  try{
    const session=(await sb.auth.getSession()).data?.session;
    if(!session?.user?.email)throw new Error('Recovery session expired. Please request a new reset email.');
    const r=await sb.auth.updateUser({password:a});
    if(r.error)throw r.error;
    show('✓ Password updated successfully. Redirecting to login…',true);
    setTimeout(async()=>{try{await sb.auth.signOut({scope:'local'})}catch(_){}location.href='index.html'},1200);
  }catch(e){
    console.error('Password update failed:',e);
    show('Password update failed: '+(e.message||e),false);
    save.disabled=false;save.textContent='SAVE NEW PASSWORD';
  }
};

resolveRecovery();
</script>
</body></html>
