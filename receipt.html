<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GURU CONNECT — Receipt</title><style>
*{box-sizing:border-box}body{margin:0;background:#f1f5f9;color:#0f172a;font-family:Arial,Helvetica,sans-serif}.toolbar{position:sticky;top:0;background:#fff;border-bottom:1px solid #e2e8f0;padding:12px;display:flex;justify-content:center;gap:10px;z-index:5}.btn{border:0;border-radius:9px;padding:10px 16px;font-weight:800;cursor:pointer}.print{background:#123b8f;color:#fff}.back{background:#e2e8f0}.page{width:min(800px,94vw);margin:28px auto;background:#fff;padding:40px;box-shadow:0 10px 35px rgba(15,23,42,.12)}.brand{text-align:center;border-bottom:2px solid #123b8f;padding-bottom:18px}.brandLogo{width:76px;height:76px;margin:0 auto 10px}.brandLogo svg{width:100%;height:100%;display:block}.brand h1{margin:0;color:#123b8f;font-size:28px;letter-spacing:.5px}.brand p{margin:6px 0 0;color:#64748b;font-weight:700}.meta{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:22px 0}.metaBox{border:1px solid #e2e8f0;border-radius:10px;padding:12px}.label{font-size:10px;text-transform:uppercase;color:#64748b;font-weight:900}.value{margin-top:4px;font-weight:800;overflow-wrap:anywhere}.category{display:inline-block;margin-top:5px;background:#eff6ff;color:#123b8f;padding:5px 9px;border-radius:999px;font-size:11px}.services{width:100%;border-collapse:collapse;margin-top:18px}.services th,.services td{border:1px solid #dbe4f0;padding:11px;text-align:left}.services th{background:#f8fafc;font-size:11px;text-transform:uppercase}.services .amt{text-align:right;white-space:nowrap}.total{display:flex;justify-content:flex-end;gap:35px;border-top:2px solid #123b8f;margin-top:14px;padding-top:15px;font-size:18px;font-weight:900}.foot{text-align:center;margin-top:45px;padding-top:15px;border-top:1px solid #e2e8f0;color:#64748b;font-size:11px}@media(max-width:600px){.page{padding:22px}.meta{grid-template-columns:1fr}.brand h1{font-size:23px}}
@media print{body{background:#fff}.toolbar{display:none}.page{width:100%;margin:0;box-shadow:none;padding:20px}.page{page-break-after:avoid}}
</style></head><body><div class="toolbar"><button class="btn print" onclick="window.print()">🖨️ PRINT / SAVE PDF</button><button class="btn back" onclick="history.length>1?history.back():location.href='admin.html'">← BACK TO ADMIN</button></div><main class="page"><div class="brand"><div class="brandLogo"><svg viewBox="0 0 120 120" aria-label="GURU CONNECT logo" role="img"><defs><linearGradient id="gcg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#08265c"/><stop offset="1" stop-color="#155eef"/></linearGradient></defs><circle cx="60" cy="60" r="54" fill="url(#gcg)"/><circle cx="60" cy="60" r="43" fill="#fff"/><path d="M34 60c0-14 11-25 26-25 9 0 17 4 22 11l-10 8c-3-4-7-7-12-7-8 0-14 6-14 13s6 13 14 13c5 0 9-2 12-6h-13V56h28v28h-11v-7c-5 6-12 9-20 9-15 0-26-11-26-26Z" fill="#155eef"/></svg></div><h1>GURU CONNECT</h1><p>OFFICIAL PAYMENT RECEIPT</p></div><div class="meta"><div class="metaBox"><div class="label">Receipt No.</div><div class="value" id="receiptNo"></div></div><div class="metaBox"><div class="label">Date</div><div class="value" id="date"></div></div><div class="metaBox"><div class="label">Received From</div><div class="value" id="name"></div><div class="category" id="category"></div></div><div class="metaBox"><div class="label">Contact</div><div class="value" id="contact">—</div><div class="label" id="refLabel" style="margin-top:8px">Transaction Reference</div><div class="value" id="reference">—</div></div></div><table class="services"><thead><tr><th>#</th><th>Service / Description</th><th class="amt">Amount (₹)</th></tr></thead><tbody id="serviceRows"></tbody></table><div class="total"><span>TOTAL</span><span>₹ <span id="total">0.00</span></span></div><div class="foot">Thank you for choosing GURU CONNECT.<br>This receipt is generated by the GURU CONNECT Admin Control Center.</div></main><script>
const q=new URLSearchParams(location.search);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const data={category:q.get('category')||'Student',name:q.get('name')||'—',email:q.get('email')||'',phone:q.get('phone')||'',date:q.get('date')||new Date().toISOString().slice(0,10),reference:q.get('reference')||'',services:[],total:Number(q.get('total')||0)};
try{data.services=JSON.parse(q.get('services')||'[]')}catch(e){data.services=[]}
const receiptNo='GC-'+new Date().getFullYear()+'-'+Date.now().toString().slice(-7);document.getElementById('receiptNo').textContent=receiptNo;document.getElementById('date').textContent=data.date;document.getElementById('name').textContent=data.name;document.getElementById('category').textContent=data.category;document.getElementById('contact').textContent=[data.email,data.phone].filter(Boolean).join(' · ')||'—';document.getElementById('reference').textContent=data.reference||'—';
let total=0;document.getElementById('serviceRows').innerHTML=data.services.map((s,i)=>{const a=Number(s.amount||0);total+=a;return '<tr><td>'+(i+1)+'</td><td>'+esc(s.name||'Service')+'</td><td class="amt">₹ '+a.toFixed(2)+'</td></tr>'}).join('')||'<tr><td colspan="3">No services recorded.</td></tr>';document.getElementById('total').textContent=(Number.isFinite(total)?total:data.total).toFixed(2);
</script></body></html>
