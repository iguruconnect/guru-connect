<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GURU CONNECT — Staff / Admin Login</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(135deg,#eef6ff,#f8fafc);min-height:100vh;display:grid;place-items:center}.card{width:min(440px,92vw);background:#fff;border-radius:24px;padding:30px;box-shadow:0 18px 60px #0f172a20}h1{margin:0 0 8px;color:#123b8f;font-size:27px}p{color:#64748b}.badge{display:inline-block;background:#123b8f;color:white;border-radius:999px;padding:7px 12px;font-size:11px;font-weight:800}label{display:block;font-size:12px;font-weight:800;color:#334155;margin:18px 0 7px}input{width:100%;box-sizing:border-box;padding:13px;border:1px solid #cbd5e1;border-radius:12px;font-size:15px}button{width:100%;border:0;border-radius:12px;padding:14px;margin-top:18px;background:#123b8f;color:#fff;font-weight:900;cursor:pointer}.reset{background:#059669}.back{display:block;text-align:center;margin-top:18px;color:#123b8f;text-decoration:none;font-weight:800;font-size:13px}.msg{margin-top:14px;padding:11px;border-radius:10px;font-size:13px;display:none}</style></head><body><main class="card"><span class="badge">GURU CONNECT • STAFF / ADMIN</span><h1>Admin Login</h1><p>Sign in with the registered Staff/Admin email.</p><form id="f"><label>Email</label><input id="email" type="email" value="guruconnect.in@gmail.com" autocomplete="username" required><label>Password</label><input id="password" type="password" autocomplete="current-password" required><button id="login">LOGIN</button></form><button class="reset" id="reset">🔑 FORGOT STAFF / ADMIN PASSWORD?<br>SEND RESET EMAIL</button><div class="msg" id="msg"></div><a class="back" href="index.html">← Back to GURU CONNECT</a></main><script>const URL='https://hzqqswrnawrfgufbxgay.supabase.co',KEY='sb_publishable_Oc5HvqDpisv76XrdsyFhiw_IpostIDu',ADMIN='1df7606a-3a96-4116-b022-804b37a3c3dd',EMAIL='guruconnect.in@gmail.com';const sb=supabase.createClient(URL,KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});const msg=(x,ok=false)=>{let m=document.getElementById('msg');m.textContent=x;m.style.display='block';m.style.background=ok?'#ecfdf5':'#fef2f2';m.style.color=ok?'#047857':'#b91c1c'};document.getElementById('f').onsubmit=async e=>{e.preventDefault();let b=document.getElementById('login');b.disabled=true;b.textContent='SIGNING IN…';try{let email=document.getElementById('email').value.trim().toLowerCase(),password=document.getElementById('password').value;if(email!==EMAIL)throw Error('Please use the registered Staff/Admin email: '+EMAIL);let r=await sb.auth.signInWithPassword({email,password});if(r.error)throw r.error;if(!r.data.user||r.data.user.id!==ADMIN)throw Error('This account is not the authorized GURU CONNECT Admin account.');localStorage.setItem('is_staff_logged','true');localStorage.setItem('gc_staff_supabase_auth','true');localStorage.setItem('active_user_role','staff');localStorage.setItem('active_user_id',r.data.user.id);localStorage.setItem('active_user_email',r.data.user.email);location.href='index.html#staff-admin'}catch(err){msg(err.message)}finally{b.disabled=false;b.textContent='LOGIN'}};document.getElementById('reset').onclick=async()=>{try{let email=document.getElementById('email').value.trim().toLowerCase()||EMAIL;if(email!==EMAIL)email=EMAIL;let r=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname.replace(/login-staff\.html$/,'')+'forgot-password.html'});if(r.error)throw r.error;msg('Password reset email sent to '+EMAIL+'. Please check Inbox and Spam/Junk.',true)}catch(err){msg('Reset request failed: '+err.message)}};</script></body></html>
