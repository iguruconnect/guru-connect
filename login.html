<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GURU CONNECT — Login</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,#eef6ff,#f8fbff,#f5f3ff);font-family:Inter,Arial;color:#0f172a}.card{width:min(460px,100%);background:#fff;border:1px solid #dbe3ef;border-radius:26px;padding:30px;box-shadow:0 24px 70px #0f172a18}.logo{display:block;width:min(280px,80%);height:72px;object-fit:contain;margin:auto auto 15px}.roles{display:flex;gap:8px;margin:15px 0}.role{flex:1;padding:11px;border:1px solid #dbe3ef;border-radius:11px;background:#f8fafc;font-weight:900;cursor:pointer}.role.active{background:#eff6ff;border-color:#60a5fa;color:#155eef}.label{display:block;font-size:11px;font-weight:950;letter-spacing:.07em;color:#475569;margin:13px 0 6px}.input{width:100%;padding:14px;border:1px solid #cbd5e1;border-radius:12px;font:700 14px Inter;outline:0}.input:focus{border-color:#60a5fa;box-shadow:0 0 0 4px #dbeafe}.btn{width:100%;margin-top:17px;padding:14px;border:0;border-radius:12px;background:#155eef;color:#fff;font-weight:950;cursor:pointer}.msg{display:none;margin-top:13px;padding:12px;border-radius:11px;font-size:13px;font-weight:750}.msg.show{display:block}.ok{background:#ecfdf5;color:#166534}.err{background:#fff1f2;color:#991b1b}.links{text-align:center;margin-top:17px;font-size:13px;font-weight:800}.links a{color:#155eef;text-decoration:none}</style></head><body><main class="card"><img class="logo" src="guru-connect-brand.png" alt="GURU CONNECT"><h2 style="text-align:center;margin:0">Member Login</h2><p style="text-align:center;color:#64748b;font-size:13px">Use the email and password from your verified account.</p><div class="roles"><button class="role active" data-role="student">🎓 Student</button><button class="role" data-role="tutor">👨‍🏫 Tutor</button><button class="role" data-role="staff">🛡️ Staff</button></div><label class="label">EMAIL</label><input id="email" class="input" type="email" autocomplete="email"><label class="label">PASSWORD</label><input id="password" class="input" type="password" autocomplete="current-password"><button id="login" class="btn">SIGN IN</button><div id="msg" class="msg"></div><div class="links"><a href="registration.html">Create account</a> &nbsp;•&nbsp; <a href="forgot-password.html">Forgot password?</a> &nbsp;•&nbsp; <a href="index.html">Home</a></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const U='https://hzqqswrnawrfgufbxgay.supabase.co',K='sb_publishable_Oc5HvqDpisv76XrdsyFhiw_IpostIDu',sb=supabase.createClient(U,K,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});let role=new URLSearchParams(location.search).get('role')||'student';const $=id=>document.getElementById(id),msg=$('msg');function show(t,ok=false){msg.textContent=t;msg.className='msg show '+(ok?'ok':'err')}document.querySelectorAll('.role').forEach(b=>b.onclick=()=>{role=b.dataset.role;document.querySelectorAll('.role').forEach(x=>x.classList.toggle('active',x===b))});document.querySelectorAll('.role').forEach(x=>x.classList.toggle('active',x.dataset.role===role));$('login').onclick=async()=>{const email=$('email').value.trim().toLowerCase(),password=$('password').value;if(!email||!password)return show('Enter your email and password.');const b=$('login');b.disabled=true;b.textContent='SIGNING IN…';try{const r=await sb.auth.signInWithPassword({email,password});if(r.error)throw r.error;const u=r.data?.user;if(!u?.email_confirmed_at){await sb.auth.signOut();throw new Error('Please verify your email before logging in.')}if(role==='staff'){if(email!=='guruconnect.in@gmail.com')throw new Error('This account is not the configured Staff/Admin account.');location.href='admin.html';return}const p=await sb.from(role==='tutor'?'tutor_profiles':'student_profiles').select('*').eq('user_id',u.id).maybeSingle();if(p.error)throw p.error;if(!p.data)throw new Error('Your '+role+' profile is not available. Please contact Staff/Admin.');if(String(p.data.registration_status||'registered').toLowerCase()!=='registered')throw new Error('Your email is verified, but the profile is not active yet. Please contact Staff/Admin.');localStorage.setItem('active_user_id',u.id);localStorage.setItem('active_user_email',email);localStorage.setItem('active_user_role',role);localStorage.setItem('active_user_name',p.data.name||'');localStorage.setItem('active_user_profile_id',p.data.id);location.href='index.html'}catch(e){console.error(e);show(e?.message||'Login failed.')}finally{b.disabled=false;b.textContent='SIGN IN'}};</script></body></html>
