<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GURU CONNECT — Secure Login</title><meta http-equiv="Cache-Control" content="no-store"><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#eff6ff,#f0fdfa);font-family:Inter,Arial,sans-serif;color:#12315b}.card{width:min(430px,90vw);background:#fff;border:1px solid #dbeafe;border-radius:24px;padding:30px;text-align:center;box-shadow:0 22px 60px rgba(15,23,42,.16)}img{width:min(520px,100%);height:auto;max-height:none;object-fit:contain;display:block;margin:0 auto}.brand{font-size:24px;font-weight:950;margin-top:4px}.msg{color:#64748b;font-size:14px;line-height:1.6}.btn{display:inline-block;margin-top:15px;background:linear-gradient(135deg,#2563eb,#0f766e);color:#fff;text-decoration:none;font-weight:900;padding:12px 20px;border-radius:12px}</style></head><body><main class="card"><img src="guru-connect-brand-lockup-transparent.png" alt="GURU CONNECT"><p class="msg">Opening your secure GURU CONNECT login…</p><a class="btn" id="continue" href="index.html">CONTINUE TO LOGIN</a></main><script>(function(){const q=new URLSearchParams(location.search);const role=(q.get('role')||'student').toLowerCase();const target='index.html?open_login=1&role='+encodeURIComponent(role);document.getElementById('continue').href=target;setTimeout(()=>location.replace(target),350);})();</script></body></html>
