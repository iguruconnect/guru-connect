<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="preload" as="image" href="guru-connect-round-logo.png">
<title>GURU CONNECT — My Kingdom</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:linear-gradient(135deg,#f7fbff,#eef4ff);color:#0f172a}.top{position:sticky;top:0;z-index:50;background:#fff;border-bottom:1px solid #e2e8f0}header{padding:13px 20px;display:flex;justify-content:space-between;align-items:center}header a,header button{border:0;background:0;padding:7px 14px;cursor:pointer;font:500 12px Inter,sans-serif;border-radius:8px;color:#0f172a}header a:hover,header button:hover{background:#f1f5f9}header button.active{background:#0f172a;color:#fff}.brand{display:flex;align-items:center;gap:8px}.brand img{height:32px;width:auto}.who{font-size:13px;font-weight:600;color:#64748b}main{max-width:1200px;margin:0 auto;padding:20px}.hero{text-align:center;margin-bottom:40px}h1{font-size:32px;font-weight:900;margin:0 0 8px;color:#0f172a}h1+p{font-size:14px;color:#64748b;margin:0 0 20px}.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-top:20px}.step{background:#fff;padding:16px 12px;border-radius:12px;text-align:center;font-size:13px;font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.08);border:1px solid #e2e8f0}
</style>
</head>
<body>
<header class="top">
<div class="brand"><img src="guru-connect-round-logo.png" alt="GURU CONNECT"></div>
<div id="who" class="who">Loading...</div>
<div>
<button id="kingdomBtn" class="active">👑 MY KINGDOM</button>
<button id="websiteBtn">🌐 WEBSITE</button>
<button id="logoutBtn">🚪 LOGOUT</button>
</div>
</header>
<main>
<section class="hero">
<h1>👑 MY KINGDOM — Learning Request Portal</h1>
<p>Connect with tutors on WhatsApp after accepting learning requests</p>
<section class="steps">
<div class="step"><b>1</b>POST LR</div>
<div class="step"><b>2</b>TUTOR SENDS CONNECTION</div>
<div class="step"><b>3</b>STUDENT ACCEPTS</div>
<div class="step"><b>4</b>WHATSAPP OPENS</div>
<div class="step"><b>5</b>LEARNING BEGINS</div>
</section>
</section>
<div class="wrap">
<div id="globalError"></div>
<div class="tabs" id="tabs"></div>
<section id="app"><div class="card empty">Loading…</div></section>
</div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
'use strict';
const SUPABASE_URL='https://hzqqswrnawrfgufbxgay.supabase.co';
const SUPABASE_KEY='sb_publishable_Oc5HvqDpisv76XrdsyFhiw_IpostIDu';
const $=id=>document.getElementById(id);
let sb=null,me=null,role='',profile=null,tab='requests';

function msg(t,kind='error'){$('globalError').innerHTML='<div class="'+kind+'">'+esc(t)+'</div>';}
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function safe(p){return Promise.race([p,new Promise((_,rej)=>setTimeout(()=>rej(new Error('Timeout')),15000)))])}
function pid(){return String(profile?.id||'')}

function normalizeWhatsAppNumber(v){
  const raw=String(v??'').trim();
  let digits=raw.replace(/\D/g,'');
  if(!digits)return '';
  if(digits.startsWith('00'))digits=digits.slice(2);
  if(digits.length===11&&digits.startsWith('0'))digits=digits.slice(1);
  if(digits.length===10)digits='91'+digits;
  return digits;
}

function gcIsMobileDevice(){
  return /Android|iPhone|iPad|iPod|Windows Phone|webOS|BlackBerry/i.test(navigator.userAgent||'');
}

async function lookupLrrWhatsAppContact(requestId,targetRole){
  const rq=await safe(sb.from('gc_learning_requests_v2').select('id,student_id,tutor_id').eq('id',String(requestId)).maybeSingle());
  if(rq.error)throw rq.error;
  if(!rq.data)throw new Error('Learning Request was not found.');
  
  const targetId=String(targetRole==='tutor'?rq.data.tutor_id||'':rq.data.student_id||'');
  if(!targetId)throw new Error('The connected '+targetRole+' account could not be identified.');
  
  let phone='',name='';
  const table=targetRole==='tutor'?'tutor_profiles':'student_profiles';
  
  const tries=[
    ()=>sb.from('profiles').select('phone,full_name,name,user_id').eq('id',targetId).maybeSingle(),
    ()=>sb.from('profiles').select('phone,full_name,name,user_id').eq('user_id',targetId).maybeSingle(),
    ()=>sb.from(table).select('phone,name,full_name,user_id,id').eq('id',targetId).maybeSingle(),
    ()=>sb.from(table).select('phone,name,full_name,user_id,id').eq('user_id',targetId).maybeSingle()
  ];
  
  for(const run of tries){
    try{
      const x=await safe(run());
      if(!x.error&&x.data){
        phone=phone||x.data.phone||'';
        name=name||x.data.full_name||x.data.name||'';
        if(phone)break;
      }
    }catch(_){}
  }
  
  if(!phone){
    try{
      const p=await safe(sb.from(table).select('phone,name,full_name,user_id').eq('id',targetId).maybeSingle());
      if(!p.error&&p.data){
        phone=p.data.phone||'';
        name=name||p.data.full_name||p.data.name||'';
        const uid=String(p.data.user_id||'');
        if(!phone&&uid){
          const u=await safe(sb.from(table).select('phone,name,full_name').eq('user_id',uid).maybeSingle());
          if(!u.error&&u.data){
            phone=u.data.phone||'';
            name=name||u.data.full_name||u.data.name||'';
          }
        }
      }
    }catch(_){}
  }
  return {phone,name};
}

async function openWhatsAppForRequest(requestId,targetRole){
  const popup=window.open('about:blank','_blank');
  try{
    let phone='',name='';
    
    // PRIMARY: Try the RPC function (most reliable)
    try {
      const q=await safe(sb.rpc('gc_get_whatsapp_contact',{
        p_request_id:requestId,
        p_target_role:targetRole
      }));
      if(!q.error && q.data){
        phone=normalizeWhatsAppNumber(q.data.phone||'');
        name=String(q.data.name||'');
        console.log('RPC phone lookup:', {phone, name, raw: q.data.phone});
      }
    }catch(e){
      console.warn('RPC lookup failed:', e.message);
    }
    
    // FALLBACK: Direct database query if RPC didn't work
    if(!phone){
      const fallback=await lookupLrrWhatsAppContact(requestId,targetRole);
      phone=normalizeWhatsAppNumber(fallback.phone);
      name=name||fallback.name||'';
      console.log('Fallback phone lookup:', {phone, name, raw: fallback.phone});
    }
    
    // VERIFY: Ensure we have a valid phone number
    if(!phone){
      throw new Error('No valid mobile number is saved for the connected user. Please update the registered mobile number in the profile/admin user editor.');
    }
    
    name=name||(targetRole==='tutor'?'Tutor':'Student');
    const text=`Hello ${name}, I am contacting you through GURU CONNECT regarding our accepted learning connection.`;
    const encoded=encodeURIComponent(text);
    
    const webUrl='https://wa.me/'+phone+'?text='+encoded;
    const appUrl='whatsapp://send?phone='+phone+'&text='+encoded;
    
    if(gcIsMobileDevice()){
      if(popup&&!popup.closed){
        popup.location.href=appUrl;
        setTimeout(()=>{
          try{
            if(!popup.closed && document.visibilityState!=='hidden')popup.location.href=webUrl;
          }catch(_){}
        },1400);
      }else{
        window.location.href=appUrl;
        setTimeout(()=>{
          try{
            if(document.visibilityState!=='hidden')window.location.href=webUrl;
          }catch(_){}
        },1400);
      }
    }else{
      if(popup&&!popup.closed)popup.location.href=webUrl;
      else window.location.href=webUrl;
    }
  }catch(e){
    if(popup&&!popup.closed)popup.close();
    msg('WhatsApp chat could not be opened: '+(e.message||e));
  }
}

async function init(){
  try{
    if(!window.supabase?.createClient)throw new Error('Supabase library did not load.');
    sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true}});
    const s=await safe(sb.auth.getSession());
    me=s.data.session?.user;
    if(!me){$('who').textContent='Not logged in';return;}
    const ident=await safe(sb.rpc('gc_get_my_member_profile'));
    if(ident.error)throw ident.error;
    role=String(ident.data?.role||'').toLowerCase();
    profile=ident.data?.profile||null;
    if(!profile||!['student','tutor'].includes(role))throw new Error('Profile not linked.');
    $('who').textContent=(role==='student'?'STUDENT':'TUTOR')+' • '+(profile.name||profile.full_name||me.email||'');
  }catch(e){msg(e.message||e);}
}

init();

document.getElementById('kingdomBtn').onclick=()=>msg('Learning Requests loaded. Click on Learning Requests to view accepted connections and open WhatsApp.');
document.getElementById('websiteBtn').onclick=()=>window.location.href='index.html';
document.getElementById('logoutBtn').onclick=async()=>{try{await sb?.auth?.signOut()}catch(_){}window.location.href='index.html';};

})();
</script>
</body>
</html>
