async function refresh(){if(!sb){requests=[];connReqs=[];balance=0;ledger=[];return}const q=await sb.from('gc_learning_requests_v2').select('*').order('created_at',{ascending:false}).limit(1000);requests=q.error?[]:(q.data||[]);const c=await sb.from('gc_connection_requests').select('*').or(`sender_profile_id.eq.${pid()},recipient_profile_id.eq.${pid()}`).order('created_at',{ascending:false}).limit(500);connReqs=c.error?[]:(c.data||[]);const w=await sb.from('gc_coin_wallets').select('balance').eq('profile_id',pid()).maybeSingle();balance=w.error?0:Number(w.data?.balance||0);const l=await sb.from('gc_coin_ledger').select('*').eq('profile_id',pid()).order('created_at',{ascending:false}).limit(500);ledger=l.error?[]:(l.data||[])}
function tab(t){document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));$('n'+t.charAt(0).toUpperCase()+t.slice(1))?.classList.add('active');({home:renderHome,requests:renderRequests,post:renderPost,connections:renderConnections,coins:renderCoins,profile:renderProfile}[t]||renderHome)();history.replaceState(null,'','#'+t)}

function renderRequests(){const rows=role==='student'?requests.filter(r=>String(r.student_id)===pid()):requests;$('content').innerHTML=`<div class="panel"><div class="note"><b>📚 ${role==='tutor'?'ALL STUDENT LEARNING REQUESTS':'MY PERMANENT LEARNING REQUEST RECORDS'}</b><br>${role==='tutor'?'All requests are visible. Connect only sends a request; the Student must approve before chat.':'Every request remains recorded. 100 coins are held with Admin until completion, Student outcome and Admin approval.'}</div>${rows.length?rows.map(requestCard).join(''):'<div class="empty">No Learning Requests found.</div>'}</div>`}
function renderPost(){if(role!=='student'){$('content').innerHTML='<div class="panel empty">Only Students can post Learning Requests.</div>';return}const ok=balance>=100;$('content').innerHTML=`<div class="panel"><h2 style="margin:0">➕ Post Learning Request</h2><p class="muted">A Learning Request cannot be posted unless your available balance is at least <b>100 GURU COINS</b>. On posting, exactly 100 coins are debited and held with Admin.</p><div class="grid" style="margin-top:12px"><div class="stat"><small>AVAILABLE COINS</small><strong class="blue">🪙 ${balance.toLocaleString('en-IN')}</strong></div><div class="stat"><small>REQUEST COST</small><strong class="green">100 🪙</strong></div><div class="stat"><small>ADMIN HOLD</small><strong class="gold">ESCROW</strong></div></div>${ok?'':'<div class="dangerNote">Insufficient Coins. Admin must add coins before you can post.</div>'}<div class="grid2" style="margin-top:12px"><div class="field"><label>Course</label><input id="fCourse" placeholder="HSC / JEE / College"></div><div class="field"><label>Stream</label><input id="fStream" placeholder="Science / Commerce / Arts"></div><div class="field"><label>Subject *</label><input id="fSubject" placeholder="Subject"></div><div class="field"><label>Topic</label><input id="fTopic" placeholder="Topic / Chapter"></div><div class="field"><label>Learning Deadline *</label><input id="fDeadline" type="datetime-local"></div><div class="field"><label>Issue / Problem *</label><textarea id="fIssue" placeholder="Explain what you need to understand"></textarea></div></div><div class="actions"><button class="btn primary" ${ok?'':'disabled'} onclick="postRequest()">POST REQUEST — 100 🪙</button></div></div>`}
function renderConnections(){const incoming=connReqs.filter(c=>String(c.recipient_profile_id)===pid()),out=connReqs.filter(c=>String(c.sender_profile_id)===pid());$('content').innerHTML=`<div class="grid2"><div class="panel"><h3 style="margin:0">📥 Incoming Requests</h3><p class="muted">You have complete freedom to ACCEPT or REJECT.</p>${incoming.length?incoming.map(c=>`<div class="request"><b>${esc(c.sender_role.toUpperCase())}</b><div class="id" style="font-size:10px;margin:5px 0">${esc(c.learning_request_id?'Learning Request: '+c.learning_request_id:'Profile connection')}</div><div class="actions">${c.status==='PENDING'?`<button class="btn success" onclick="respondConnection('${c.id}','ACCEPT')">✓ ACCEPT</button><button class="btn danger" onclick="respondConnection('${c.id}','REJECT')">✕ REJECT</button>`:`<span class="pill">${esc(c.status)}</span>`}</div></div>`).join(''):'<div class="empty">No incoming connection requests.</div>'}</div><div class="panel"><h3 style="margin:0">📤 Sent Requests</h3><p class="muted">Pending requests do not open chat.</p>${out.length?out.map(c=>`<div class="request"><b>TO ${esc(c.recipient_role.toUpperCase())}</b><div class="id" style="font-size:10px;margin:5px 0">${esc(c.learning_request_id?'Learning Request: '+c.learning_request_id:'Profile connection')}</div><span class="pill">${esc(c.status)}</span></div>`).join(''):'<div class="empty">No sent connection requests.</div>'}</div></div>`}
function renderCoins(){const rows=ledger;const held=requests.filter(r=>((role==='student'&&String(r.student_id)===pid())||(role==='tutor'&&String(r.tutor_id)===pid()))&&Number(r.coins_held||0)>0);$('content').innerHTML=`<div class="grid"><div class="stat"><small>AVAILABLE GURU COINS</small><strong class="green">🪙 ${balance.toLocaleString('en-IN')}</strong></div><div class="stat"><small>COINS HELD WITH ADMIN</small><strong class="gold">🪙 ${held.reduce((n,r)=>n+Number(r.coins_held||0),0)}</strong></div><div class="stat"><small>ACCOUNT</small><strong>${esc(sid(pid(),role))}</strong></div></div><div class="panel"><h3 style="margin:0">🪙 Coin Rules</h3><p class="muted">Learning Request = 100 coins • Tutor Listing = 100 coins/month • Verified Tick = 200 coins. Students and Tutors cannot directly transfer coins. Admin controls Learning Request release.</p></div><div class="panel"><h3 style="margin:0 0 5px">🧾 Complete Coin Transaction History</h3><p class="muted">Read-only for you. Official Admin adjustments and Learning Request escrow/release entries are recorded here.</p><div class="tableWrap">${rows.length?`<table class="table"><thead><tr><th>Date / Time</th><th>Type</th><th>Credited</th><th>Debited</th><th>Reason</th><th>Learning Request ID</th></tr></thead><tbody>${rows.map(x=>{const a=Number(x.amount||0);return `<tr><td>${esc(fmt(x.created_at))}</td><td>${esc(x.transaction_type||x.type||'')}</td><td class="pos">${a>0?'+ '+a:'—'}</td><td class="neg">${a<0?Math.abs(a):'—'}</td><td>${esc(x.reason||'—')}</td><td>${esc(x.learning_request_id||x.request_id||'—')}</td></tr>`}).join('')}</tbody></table>`:'<div class="empty">No coin transactions yet.</div>'}</div></div>`}
function renderProfile(){const f=(l,v)=>`<div class="profileItem"><b>${esc(l)}</b><span>${esc(val(...v))}</span></div>`;$('content').innerHTML=`<div class="panel"><div style="display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap"><div><h2 style="margin:0">👤 ${esc(me.name||me.full_name||'My Profile')}</h2><p class="muted">GURU CONNECT ID: <b>${esc(me.short_id||sid(me.id,role))}</b></p></div><div class="stat"><small>GURU COINS</small><strong class="gold">🪙 ${balance.toLocaleString('en-IN')}</strong></div></div><div class="profile" style="margin-top:14px">${f('NAME',[me.name,me.full_name])}${f('GURU CONNECT ID',[me.short_id,me.public_id,sid(me.id,role)])}${f('HELPLINE SERVICE PLAN',[me.helpline_plan,me.helplineServicePlan,me.plan])}${f('COLLEGE',[me.college,me.college_name])}${f('COURSE',[me.course,me.program])}${f('DIVISION',[me.division,me.div])}${f('ROLL NO',[me.roll_no,me.roll_number,me.rollNo])}${f('PHONE NUMBER',[me.phone,me.mobile,me.mobile_number])}${f('EMAIL',[me.email])}${f('AVAILABILITY',[me.availability,me.available_time])}${f('MODE',[me.mode,me.preferred_mode,me.teaching_mode])}${f('LOCATION',[me.location,me.city])}${f('ADDRESS',[me.address,me.full_address])}${f('LOOKING FOR SUBJECT',[me.looking_for_subject,me.subject,me.subjects])}</div></div><div class="panel"><h3 style="margin:0 0 5px">🪙 Coin Transaction History</h3><div class="tableWrap">${ledger.length?`<table class="table"><thead><tr><th>Date / Time</th><th>Transaction</th><th>Credited</th><th>Debited</th><th>Reason</th><th>Learning Request ID</th></tr></thead><tbody>${ledger.map(x=>{const a=Number(x.amount||0);return `<tr><td>${esc(fmt(x.created_at))}</td><td>${esc(x.transaction_type||x.type||'')}</td><td class="pos">${a>0?'+ '+a:'—'}</td><td class="neg">${a<0?Math.abs(a):'—'}</td><td>${esc(x.reason||'—')}</td><td>${esc(x.learning_request_id||x.request_id||'—')}</td></tr>`}).join('')}</tbody></table>`:'<div class="empty">No transactions yet.</div>'}</div></div>`}
async function postRequest(){if(role!=='student'||balance<100)return;const subject=$('fSubject').value.trim(),issue=$('fIssue').value.trim(),deadline=$('fDeadline').value;if(!subject||!issue||!deadline)return alert('Subject, Issue / Problem and Learning Deadline are required.');if(new Date(deadline)<=new Date())return alert('Learning Deadline must be in the future.');const x=await sb.rpc('gc_post_learning_request',{p_student_id:pid(),p_course:$('fCourse').value.trim(),p_stream:$('fStream').value.trim(),p_subject:subject,p_topic:$('fTopic').value.trim(),p_problem:issue});if(x.error)return alert('Learning Request could not be posted: '+x.error.message);const id=x.data?.id||x.data?.request_id||x.data?.requestId;if(id){const d=await sb.rpc('gc_set_learning_request_deadline',{p_request_id:id,p_deadline:new Date(deadline).toISOString()});if(d.error)alert('Request was created but deadline could not be saved. Please ask Admin to correct it.')}alert('Learning Request posted. 100 coins debited and HELD WITH ADMIN.');await refresh();tab('requests')}
async function sendLearningConnect(id){const r=requests.find(x=>String(x.id)===String(id));if(!r||role!=='tutor')return;const x=await sb.rpc('gc_send_connection_request',{p_target_profile_id:String(r.student_id),p_target_role:'student',p_learning_request_id:String(id),p_message:'Tutor would like to connect regarding your Learning Request.'});if(x.error)return alert(x.error.message||'Connection request could not be sent.');alert('Connection request sent. The Student must ACCEPT it before chat begins.');await refresh();tab('connections')}
async function respondConnection(id,d){const x=await sb.rpc('gc_respond_connection_request',{p_request_id:String(id),p_decision:d});if(x.error)return alert(x.error.message);alert(d==='ACCEPT'?'Connection accepted. Private chat is now active.':'Connection rejected.');await refresh();tab('connections')}
async function completeRequest(id){const x=await sb.rpc('gc_tutor_complete_learning_request',{p_request_id:String(id)});if(x.error)return alert(x.error.message);alert('Work marked completed. Student must now submit the outcome.');await refresh();tab('requests')}
async function outcome(id,v){const x=await sb.rpc('gc_student_learning_request_outcome',{p_request_id:String(id),p_outcome:v});if(x.error)return alert(x.error.message);alert('Your outcome has been sent to Admin.');await refresh();tab('requests')}
function getOther(r){return role==='student'?{id:r.tutor_id,name:r.tutor_name||'Tutor'}:{id:r.student_id,name:r.student_name||'Student'}}
async function openChat(id){const r=requests.find(x=>String(x.id)===String(id));if(!r||!r.tutor_id)return alert('Chat is available only after Student approval and Tutor connection.');if(!((role==='student'&&String(r.student_id)===pid())||(role==='tutor'&&String(r.tutor_id)===pid())))return alert('This chat is private to the connected Student and Tutor.');const o=getOther(r);activeChat={requestId:String(id),other:String(o.id),otherName:o.name||'User'};$('chatTitle').textContent='Chat with '+activeChat.otherName;$('chatMeta').innerHTML=`<span>📚 ${esc(r.subject||'Learning Request')}</span><span>🔐 ${esc(r.request_code||r.id)}</span><span>🪙 ${Number(r.coins_held||0)} Held with Admin</span><span>⏰ ${esc(fmt(r.learning_deadline))}</span>`;$('scheduleAt').value=r.learning_scheduled_at?new Date(r.learning_scheduled_at).toISOString().slice(0,16):'';$('scheduleStatus').textContent=r.learning_scheduled_at?'Scheduled: '+fmt(r.learning_scheduled_at):'No learning session scheduled yet.';$('chatOverlay').classList.add('show');await renderChat();clearInterval(poll);poll=setInterval(renderChat,2500);setTimeout(()=>$('chatInput').focus(),100)}
async function renderChat(){if(!activeChat)return;const q=await sb.from('gc_messages').select('*').eq('subject','GCCHAT|'+activeChat.requestId).order('created_at',{ascending:true}).limit(500);const rows=q.error?[]:(q.data||[]);$('messages').innerHTML=rows.length?rows.map(m=>`<div class="bubble ${String(m.from_id)===pid()?'mine':'theirs'}">${esc(m.body)}<small>${esc(m.from_name||'User')} · ${esc(fmt(m.created_at))}</small></div>`).join(''):'<div class="empty">No messages yet. Start the conversation.</div>';$('messages').scrollTop=$('messages').scrollHeight}
async function sendMessage(){if(!activeChat)return;const body=$('chatInput').value.trim();if(!body)return;const x=await sb.from('gc_messages').insert({id:'chat_'+crypto.randomUUID(),from_type:'user',from_id:pid(),from_name:me.name||me.full_name||'User',to_type:'user',to_id:activeChat.other,to_role:role==='student'?'tutor':'student',to_name:activeChat.otherName,subject:'GCCHAT|'+activeChat.requestId,body,created_at:new Date().toISOString(),read:false});if(x.error)return alert('Message could not be sent: '+x.error.message);$('chatInput').value='';await renderChat()}
async function saveSchedule(){if(!activeChat)return;const v=$('scheduleAt').value;if(!v)return alert('Select a date and time.');const x=await sb.rpc('gc_schedule_learning_session',{p_request_id:activeChat.requestId,p_scheduled_at:new Date(v).toISOString()});if(x.error)return alert(x.error.message);$('scheduleStatus').textContent='✓ Learning schedule saved.';await refresh()}
function closeChat(){$('chatOverlay').classList.remove('show');clearInterval(poll);poll=null;activeChat=null}
async function logoutNow(){
  const btn=document.querySelector('.logout');
  if(btn){btn.disabled=true;btn.textContent='LOGGING OUT…';btn.style.pointerEvents='none'}
  const keys=['active_user_name','active_user_phone','active_user_email','active_user_profile_id','active_user_id','active_user_role','is_staff_logged','gc_staff_supabase_auth'];
  keys.forEach(k=>{try{localStorage.removeItem(k)}catch(_){}});
  try{sessionStorage.clear()}catch(_){ }
  try{if(sb&&sb.auth){await sb.auth.signOut({scope:'global'});}}catch(e){console.warn('Supabase logout:',e)}
  window.location.replace('./index.html?logged_out=1&logout='+Date.now());
}
document.addEventListener('click',function(e){
  const b=e.target.closest&&e.target.closest('button.logout');
  if(!b)return;
  e.preventDefault();e.stopPropagation();e.stopImmediatePropagation();logoutNow();
},true);
window.addEventListener('hashchange',()=>{const h=location.hash.replace('#','');if(h&&['home','requests','post','connections','coins','profile'].includes(h))tab(h)});boot();
</script></body></html>
