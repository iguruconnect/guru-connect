<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GURU CONNECT — Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:#eef4fb;color:#10234e}button,input,textarea,select{font:inherit}button{cursor:pointer}.top{background:linear-gradient(135deg,#0b1b3c,#1456c7);color:#fff;padding:16px 20px;position:sticky;top:0;z-index:20;box-shadow:0 8px 28px #0b1b3c2b}.topin{max-width:1250px;margin:auto;display:flex;align-items:center;gap:14px}.brand{font-weight:1000;letter-spacing:.8px;font-size:20px;flex:1}.role{font-size:11px;font-weight:900;background:#ffffff18;border:1px solid #ffffff35;padding:7px 10px;border-radius:999px}.logout{border:0;background:#ffe4e6;color:#a3152a;border-radius:10px;padding:10px 14px;font-weight:950}.wrap{max-width:1250px;margin:22px auto;padding:0 14px}.hero{background:#fff;border:1px solid #d9e4f3;border-radius:22px;padding:20px;box-shadow:0 10px 30px #183d7a10}.hero h1{margin:0;font-size:25px}.hero p{margin:7px 0 0;color:#64748b;font-size:12px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.tab{border:1px solid #d6e1ef;background:#fff;color:#334155;border-radius:12px;padding:10px 14px;font-weight:950;font-size:11px}.tab.active{background:#155eef;color:#fff;border-color:#155eef}.panel{background:#fff;border:1px solid #dbe5f1;border-radius:20px;padding:17px;box-shadow:0 8px 25px #183d7a0b;margin-bottom:14px}.note{background:#eff6ff;border:1px solid #bfdbfe;color:#1e40af;padding:12px;border-radius:13px;font-size:11px;font-weight:750}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.field label{display:block;font-size:9px;font-weight:950;color:#64748b;text-transform:uppercase;margin-bottom:5px}.field input,.field textarea,.field select{width:100%;border:1px solid #cbd5e1;border-radius:11px;padding:11px;background:#fff;outline:none}.field textarea{min-height:100px;resize:vertical}.primary{border:0;background:#155eef;color:#fff;border-radius:11px;padding:12px 15px;font-weight:950}.green{background:#059669}.red{background:#dc2626}.gold{background:#b7791f}.muted{color:#64748b;font-size:11px}.balance{font-size:30px;font-weight:1000;color:#155eef}.req{border:1px solid #dbe5ef;border-radius:17px;padding:15px;margin:10px 0;background:#fff}.reqtop{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.req h3{margin:0 0 4px;font-size:16px}.pill{display:inline-flex;padding:5px 9px;border-radius:999px;font-size:9px;font-weight:950;background:#eef2ff;color:#3730a3;white-space:nowrap}.openpill{background:#ecfdf5;color:#047857}.hold{color:#a16207;font-weight:950}.meta{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:12px 0}.meta div{background:#f8fafc;border-radius:10px;padding:8px}.meta b{display:block;font-size:8px;color:#64748b;text-transform:uppercase}.meta span{font-size:11px;font-weight:800;word-break:break-word}.actions{display:flex;gap:8px;flex-wrap:wrap}.chatOverlay{position:fixed;inset:0;background:#020617bb;backdrop-filter:blur(6px);z-index:100;display:none;align-items:center;justify-content:center;padding:12px}.chatOverlay.show{display:flex}.chat{width:min(920px,100%);height:min(760px,94vh);background:#fff;border-radius:22px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 30px 90px #0008}.chathead{background:linear-gradient(135deg,#0f172a,#155eef);color:#fff;padding:15px;display:flex;gap:12px;align-items:center}.chathead>div:first-child{flex:1}.chathead h2{margin:0;font-size:17px}.chathead p{margin:4px 0 0;font-size:10px;color:#dbeafe}.x{border:0;background:#ffffff20;color:#fff;width:38px;height:38px;border-radius:10px;font-size:20px}.chatmeta{padding:9px 14px;background:#f8fafc;border-bottom:1px solid #e2e8f0;font-size:10px;font-weight:800;display:flex;gap:15px;flex-wrap:wrap}.messages{flex:1;overflow:auto;padding:15px;background:#f1f5f9}.bubble{max-width:78%;padding:10px 12px;border-radius:15px;margin:7px 0;font-size:12px;line-height:1.4}.mine{margin-left:auto;background:#155eef;color:#fff;border-bottom-right-radius:5px}.theirs{background:#fff;color:#172554;border:1px solid #dbe5ef;border-bottom-left-radius:5px}.bubble small{display:block;font-size:8px;opacity:.72;margin-top:5px}.schedule{padding:10px 14px;border-top:1px solid #e2e8f0;background:#fff}.schedulegrid{display:grid;grid-template-columns:1fr auto;gap:8px}.composer{display:grid;grid-template-columns:1fr auto;gap:8px;padding:10px 14px;background:#fff;border-top:1px solid #e2e8f0}.composer input{width:100%;border:1px solid #cbd5e1;border-radius:11px;padding:11px}.empty{text-align:center;padding:40px;color:#64748b;font-weight:800;font-size:12px}.danger{color:#991b1b}.success{color:#047857}.hidden{display:none!important}
@media(max-width:760px){.topin{flex-wrap:wrap}.brand{min-width:160px}.role{order:3;width:100%;text-align:center}.grid,.grid3,.meta{grid-template-columns:1fr}.reqtop{flex-direction:column}.composer,.schedulegrid{grid-template-columns:1fr}.bubble{max-width:88%}.wrap{padding:0 8px;margin:12px auto}.hero,.panel{border-radius:16px;padding:13px}.logout{padding:9px 11px;font-size:10px}}
</style>
</head>
<body>
<header class="top"><div class="topin"><div class="brand">GURU CONNECT</div><div id="roleBadge" class="role">SECURE DASHBOARD</div><button class="logout" onclick="logoutDashboard()">↪ LOGOUT</button></div></header>
<main class="wrap">
<section class="hero"><h1 id="welcome">My Dashboard</h1><p id="subtitle">Manage your learning requests, connections, messages and coins.</p></section>
<nav class="tabs"><button class="tab active" id="tabRequests" onclick="showTab('requests')">📚 LEARNING REQUESTS</button><button class="tab" id="tabPost" onclick="showTab('post')">➕ POST REQUEST</button><button class="tab" id="tabConnections" onclick="showTab('connections')">💬 CONNECTIONS & CHAT</button><button class="tab" id="tabCoins" onclick="showTab('coins')">🪙 MY COINS</button></nav>
<section id="content"></section>
</main>
<div id="chatOverlay" class="chatOverlay"><div class="chat"><div class="chathead"><div><h2 id="chatTitle">Chat</h2><p id="chatSub">GURU CONNECT internal chat</p></div><button class="x" onclick="closeChat()">×</button></div><div id="chatMeta" class="chatmeta"></div><div id="messages" class="messages"></div><div class="schedule"><div class="muted" style="margin-bottom:5px;font-weight:900">📅 LEARNING SCHEDULING</div><div class="schedulegrid"><input id="scheduleAt" type="datetime-local"><button class="primary gold" onclick="saveSchedule()">SET SCHEDULE</button></div><div id="scheduleStatus" class="muted" style="margin-top:5px"></div></div><div class="composer"><input id="chatInput" placeholder="Write a message to the student/tutor…" maxlength="5000" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMessage()}"><button class="primary" onclick="sendMessage()">SEND</button></div></div></div>
<script>
const SUPABASE_URL='https://hzqqswrnawrfgufbxgay.supabase.co';
const SUPABASE_KEY='sb_publishable_Oc5HvqDpisv76XrdsyFhiw_IpostID';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let me=null, role='', requests=[], balance=0, ledgerRows=[], activeChat=null, poll=null;
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=v=>{try{return new Date(v).toLocaleString('en-IN',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})}catch(_){return v||''}};
function profileId(){return String(me?.id||'')}
async function boot(){
 const s=await sb.auth.getSession(); const u=s.data?.session?.user;
 if(!u){location.href='index.html';return}
 const [st,tr]=await Promise.all([
  sb.from('student_profiles').select('*').eq('user_id',u.id).maybeSingle(),
  sb.from('tutor_profiles').select('*').eq('user_id',u.id).maybeSingle()
 ]);
 if(st.data){me={...st.data,user_id:u.id};role='student'} else if(tr.data){me={...tr.data,user_id:u.id};role='tutor'} else {location.href='index.html';return}
 localStorage.setItem('active_user_role',role);localStorage.setItem('active_user_profile_id',me.id);localStorage.setItem('active_user_id',u.id);localStorage.setItem('active_user_name',me.name||u.email||'User');
 document.getElementById('welcome').textContent=`Welcome, ${me.name||'User'}`;document.getElementById('roleBadge').textContent=role==='student'?'STUDENT • LOGGED IN':'TUTOR • LOGGED IN';
 document.getElementById('subtitle').textContent=role==='student'?'Post a Learning Request, connect with your Tutor, schedule learning and confirm satisfaction.':'View every Student Learning Request, connect directly, chat and schedule learning.';
 document.getElementById('tabPost').classList.toggle('hidden',role!=='student');
 await refresh();
 if(location.hash==='#connections')showTab('connections');else if(location.hash==='#post')showTab('post');else showTab('requests');
}
async function refresh(){
 const q=await sb.from('gc_learning_requests_v2').select('*').order('created_at',{ascending:false}).limit(500);
 if(!q.error)requests=q.data||[]; else console.warn(q.error);
 const w=await sb.from('gc_coin_wallets').select('balance').eq('profile_id',profileId()).maybeSingle();if(!w.error)balance=Number(w.data?.balance||0);
 const l=await sb.from('gc_coin_ledger').select('*').eq('profile_id',profileId()).order('created_at',{ascending:false}).limit(300);if(!l.error)ledgerRows=l.data||[];
 renderRequests();
}
function statusLabel(r){return String(r.status||'OPEN').replaceAll('_',' ')}
function requestCard(r){
 const mineStudent=role==='student'&&String(r.student_id)===profileId(); const mineTutor=role==='tutor'&&String(r.tutor_id)===profileId();
 const connected=!!r.tutor_id;
 let actions='';
 if(role==='tutor'&&r.status==='OPEN'&&!connected)actions+=`<button class="primary green" onclick="connectRequest('${esc(r.id)}')">CONNECT WITH STUDENT</button>`;
 if((mineTutor||mineStudent)&&connected)actions+=`<button class="primary" onclick="openChatFor('${esc(r.id)}')">💬 ${role==='tutor'?'CHAT WITH STUDENT':'CHAT WITH TUTOR'}</button>`;
 if(mineTutor&&['TUTOR_ACCEPTED','TUTOR_COMPLETED','PENDING_ADMIN_APPROVAL','PENDING_ADMIN_REVIEW'].includes(r.status))actions+=`<span class="pill">YOUR CONNECTION</span>`;
 if(mineTutor&&r.status==='TUTOR_ACCEPTED')actions+=`<button class="primary gold" onclick="completeRequest('${esc(r.id)}')">WORK COMPLETED</button>`;
 if(mineStudent&&r.status==='TUTOR_COMPLETED')actions+=`<button class="primary green" onclick="studentOutcome('${esc(r.id)}','SATISFIED')">✓ CONFIRMATION: LR SATISFIED</button><button class="primary red" onclick="studentOutcome('${esc(r.id)}','NOT_SATISFIED')">LR NOT SATISFIED</button>`;
 return `<article class="req"><div class="reqtop"><div><h3>${esc(r.subject||'Learning Request')}</h3><div class="muted">${esc(r.request_code||r.id)} · ${esc(r.course||'')} ${r.stream?'• '+esc(r.stream):''}</div></div><span class="pill ${r.status==='OPEN'?'openpill':''}">${esc(statusLabel(r))}</span></div><div class="meta"><div><b>Student</b><span>${esc(r.student_short_id||r.student_id||'—')}</span></div><div><b>Tutor</b><span>${esc(r.tutor_short_id||r.tutor_id||'Not connected')}</span></div><div><b>Learning Deadline</b><span>${r.learning_deadline?fmt(r.learning_deadline):'Not set'}</span></div><div><b>Topic</b><span>${esc(r.topic||'—')}</span></div><div><b>Coins Held — Admin</b><span class="hold">🪙 ${Number(r.coins_held||0)} HELD</span></div><div><b>Student Confirmation</b><span>${esc(r.student_outcome||'Pending')}</span></div></div><div class="muted" style="margin-bottom:10px"><b>Issue / Problem:</b> ${esc(r.issue||r.problem||'—')}</div><div class="actions">${actions}</div></article>`;
}
function renderRequests(){const c=document.getElementById('content');let rows=role==='student'?requests.filter(r=>String(r.student_id)===profileId()):requests;if(!rows.length){c.innerHTML='<div class="panel empty">No Learning Requests found.</div>';return}c.innerHTML=`<div class="panel"><div class="note"><b>📚 Learning Request Board</b> — ${role==='tutor'?'All Student Learning Requests are listed here.':'Your Learning Requests are listed here.'} Every request carries <b>100 GURU COINS</b>. The coins are held under Admin control until the Student confirms <b>LR SATISFIED</b> and Admin approves the release.</div>${rows.map(requestCard).join('')}</div>`}
function renderPost(){document.getElementById('content').innerHTML=`<div class="panel"><h2 style="margin:0 0 7px;font-size:18px">➕ Post Learning Request</h2><p class="muted">100 GURU COINS are required before a request can be sent. When successfully posted, 100 coins are debited and placed on Admin Hold — they are not paid to the Tutor yet.</p><div class="grid3" style="margin:13px 0"><div class="panel" style="margin:0;padding:12px"><div class="muted">YOUR BALANCE</div><div class="balance">${balance.toLocaleString('en-IN')} 🪙</div></div><div class="panel" style="margin:0;padding:12px"><div class="muted">REQUEST COST</div><div style="font-size:28px;font-weight:1000;color:#047857">100 🪙</div></div><div class="panel" style="margin:0;padding:12px"><div class="muted">ADMIN HOLD</div><div style="font-size:20px;font-weight:1000;color:#a16207">ESCROW</div></div></div>${balance<100?'<div class="note danger" style="background:#fff1f2;border-color:#fecaca"><b>Insufficient coins.</b> Add at least 100 coins before posting.</div>':''}<div class="grid"><div class="field"><label>Course</label><input id="fCourse" placeholder="HSC / JEE / College"></div><div class="field"><label>Stream</label><input id="fStream" placeholder="Science / Commerce / Arts"></div><div class="field"><label>Subject *</label><input id="fSubject" placeholder="Physics"></div><div class="field"><label>Topic / Chapter</label><input id="fTopic" placeholder="Electrostatics"></div><div class="field"><label>Learning Deadline *</label><input id="fDeadline" type="datetime-local"><div class="muted" style="margin-top:4px">Tell the Tutor the date/time by which this topic is important for you.</div></div><div class="field"><label>Issue / Problem *</label><textarea id="fIssue" placeholder="Explain exactly what you did not understand."></textarea></div></div><button class="primary" style="margin-top:12px" ${balance<100?'disabled':''} onclick="postRequest()">POST LEARNING REQUEST — 100 🪙</button></div>`}
function renderConnections(){let rows=requests.filter(r=>role==='student'?String(r.student_id)===profileId()&&r.tutor_id:String(r.tutor_id)===profileId());document.getElementById('content').innerHTML=`<div class="panel"><h2 style="margin:0 0 5px;font-size:18px">💬 Connections & Live Chat</h2><p class="muted">Each connected Learning Request has its own private internal Tutor ↔ Student conversation and learning schedule.</p>${rows.length?rows.map(r=>`<article class="req"><div class="reqtop"><div><h3>${esc(r.subject||'Learning Request')}</h3><div class="muted">${esc(r.request_code||r.id)} · 🪙 ${Number(r.coins_held||0)} Held with Admin</div></div><button class="primary" onclick="openChatFor('${esc(r.id)}')">OPEN CHAT</button></div><div class="meta"><div><b>Student</b><span>${esc(r.student_short_id||r.student_id)}</span></div><div><b>Tutor</b><span>${esc(r.tutor_short_id||r.tutor_id)}</span></div><div><b>Deadline</b><span>${r.learning_deadline?fmt(r.learning_deadline):'Not set'}</span></div></div></article>`).join(''):'<div class="empty">No connected Learning Requests yet.</div>'}</div>`}
function renderCoins(){document.getElementById('content').innerHTML=`<div class="grid"><div class="panel"><div class="muted">CURRENT COIN BALANCE</div><div class="balance">${balance.toLocaleString('en-IN')} 🪙</div></div><div class="panel"><div class="muted">LEARNING REQUEST RULE</div><div style="font-size:20px;font-weight:1000">100 🪙 / REQUEST</div><div class="muted" style="margin-top:4px">Held by Admin until approved release.</div></div></div><div class="panel"><h2 style="margin:0 0 10px;font-size:16px">Transaction History</h2>${ledgerRows.length?`<div style="overflow:auto"><table style="width:100%;border-collapse:collapse;font-size:11px"><tr><th style="text-align:left;padding:8px">Date</th><th style="text-align:left;padding:8px">Type</th><th style="text-align:left;padding:8px">Amount</th><th style="text-align:left;padding:8px">Reason</th></tr>${ledgerRows.map(x=>`<tr><td style="padding:8px;border-top:1px solid #e2e8f0">${esc(fmt(x.created_at))}</td><td style="padding:8px;border-top:1px solid #e2e8f0">${esc(x.transaction_type||x.type||'')}</td><td style="padding:8px;border-top:1px solid #e2e8f0">${Number(x.amount||0)>0?'+':''}${esc(x.amount)}</td><td style="padding:8px;border-top:1px solid #e2e8f0">${esc(x.reason||'')}</td></tr>`).join('')}</table></div>`:'<div class="empty">No transactions found.</div>'}</div>`}
function showTab(t){document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.getElementById(t==='requests'?'tabRequests':t==='post'?'tabPost':t==='connections'?'tabConnections':'tabCoins').classList.add('active');if(t==='requests')renderRequests();if(t==='post')renderPost();if(t==='connections')renderConnections();if(t==='coins')renderCoins()}
async function postRequest(){
 const subject=document.getElementById('fSubject')?.value.trim(),issue=document.getElementById('fIssue')?.value.trim(),deadline=document.getElementById('fDeadline')?.value;
 if(!subject||!issue||!deadline)return alert('Subject, Issue / Problem and Learning Deadline are required.');
 if(new Date(deadline)<=new Date())return alert('Learning Deadline must be in the future.');
 if(balance<100)return alert('You need at least 100 GURU COINS. The request cannot be sent.');
 const w=await sb.from('gc_coin_wallets').select('balance').eq('profile_id',profileId()).maybeSingle();if(w.error)return alert(w.error.message);if(Number(w.data?.balance||0)<100)return alert('Insufficient GURU COINS.');
 let r=await sb.rpc('gc_post_learning_request',{p_student_id:profileId(),p_course:document.getElementById('fCourse').value.trim(),p_stream:document.getElementById('fStream').value.trim(),p_subject:subject,p_topic:document.getElementById('fTopic').value.trim(),p_problem:issue});
 if(r.error)return alert('Learning Request could not be posted: '+r.error.message);
 const id=r.data?.id||r.data?.request_id||r.data?.requestId;let deadlineSaved=false;
 if(id){const u=await sb.rpc('gc_set_learning_request_deadline',{p_request_id:id,p_deadline:new Date(deadline).toISOString()});deadlineSaved=!u.error;if(u.error)console.warn('Deadline RPC unavailable',u.error)}
 if(!deadlineSaved&&id){const u=await sb.from('gc_learning_requests_v2').update({learning_deadline:new Date(deadline).toISOString()}).eq('id',id).eq('student_id',profileId());deadlineSaved=!u.error}
 if(!deadlineSaved)alert('Request was posted and coins were held, but the deadline could not be saved. Run the supplied migration SQL and try again.');else alert('Learning Request posted. 100 coins debited and held with Admin.');
 await refresh();showTab('requests');
}
async function connectRequest(id){const r=await sb.rpc('gc_accept_learning_request',{p_request_id:id});if(r.error)return alert('Could not connect: '+r.error.message);await refresh();await openChatFor(id)}
async function completeRequest(id){const r=await sb.rpc('gc_tutor_complete_learning_request',{p_request_id:id});if(r.error)return alert(r.error.message);alert('Tutor marked the Learning Request completed. Student can now submit LR SATISFIED confirmation.');await refresh();}
async function studentOutcome(id,outcome){if(outcome==='SATISFIED'&&!confirm('Confirm: LR SATISFIED? This tells Admin that the Learning Request was satisfactorily completed.'))return;const r=await sb.rpc('gc_student_learning_request_outcome',{p_request_id:id,p_outcome:outcome});if(r.error)return alert(r.error.message);alert(outcome==='SATISFIED'?'LR SATISFIED submitted to Admin for approval.':'Not satisfied submitted to Admin.');await refresh();}
async function openChatFor(id){const r=requests.find(x=>String(x.id)===String(id));if(!r||!r.tutor_id){return alert('Chat opens after a Tutor connects to this Learning Request.')}const other=role==='student'?r.tutor_id:r.student_id;const otherName=role==='student'?(r.tutor_name||'Tutor'):(r.student_name||'Student');activeChat={requestId:String(id),other:String(other),otherName,subject:r.subject,code:r.request_code,coinsHeld:Number(r.coins_held||0)};document.getElementById('chatTitle').textContent='Chat with '+otherName;document.getElementById('chatSub').textContent='GURU CONNECT · Private Learning Request Chat';document.getElementById('chatMeta').innerHTML=`<span>📚 ${esc(r.subject||'Learning Request')}</span><span>🔐 ${esc(r.request_code||r.id)}</span><span>🪙 ${Number(r.coins_held||0)} Held with Admin</span><span>⏰ Deadline: ${r.learning_deadline?esc(fmt(r.learning_deadline)):'Not set'}</span>`;document.getElementById('chatOverlay').classList.add('show');await renderChat();clearInterval(poll);poll=setInterval(renderChat,3000)}
function closeChat(){document.getElementById('chatOverlay').classList.remove('show');clearInterval(poll);poll=null;activeChat=null}
function chatKey(){return 'GCCHAT|'+activeChat.requestId}
async function getMessages(){let q=await sb.from('gc_messages').select('*').or(`and(from_id.eq.${profileId()},to_id.eq.${activeChat.other}),and(from_id.eq.${activeChat.other},to_id.eq.${profileId()})`).order('created_at',{ascending:true}).limit(500);return q.error?[]:(q.data||[])}
async function renderChat(){if(!activeChat)return;const rows=await getMessages();document.getElementById('messages').innerHTML=rows.length?rows.map(m=>`<div class="bubble ${String(m.from_id)===profileId()?'mine':'theirs'}">${esc(m.body)}<small>${esc(m.from_name||'User')} · ${esc(fmt(m.created_at))}</small></div>`).join(''):'<div class="empty">No messages yet. Start the conversation.</div>';const box=document.getElementById('messages');box.scrollTop=box.scrollHeight}
async function sendMessage(){if(!activeChat)return;const input=document.getElementById('chatInput'),body=input.value.trim();if(!body)return;const id='chat_'+crypto.randomUUID();const now=new Date().toISOString();const r=await sb.from('gc_messages').insert({id,from_type:'user',from_id:profileId(),from_name:me.name||'User',to_type:'user',to_id:activeChat.other,to_role:role==='student'?'tutor':'student',to_name:activeChat.otherName,subject:'GCCHAT|'+activeChat.requestId+'|'+activeChat.subject,body,created_at:now,read:false});if(r.error)return alert('Message could not be sent: '+r.error.message);input.value='';await renderChat()}
async function saveSchedule(){if(!activeChat)return;const at=document.getElementById('scheduleAt').value;if(!at)return alert('Select a date and time.');let r=await sb.rpc('gc_schedule_learning_session',{p_request_id:activeChat.requestId,p_scheduled_at:new Date(at).toISOString()});if(r.error){const u=await sb.from('gc_learning_requests_v2').update({learning_scheduled_at:new Date(at).toISOString()}).eq('id',activeChat.requestId);if(u.error)return alert('Schedule could not be saved. Run the supplied migration SQL first.')}document.getElementById('scheduleStatus').textContent='Learning schedule saved for both Student and Tutor.';await refresh()}
async function logoutDashboard(){try{await sb.auth.signOut()}catch(_){}['active_user_name','active_user_phone','active_user_email','active_user_profile_id','active_user_id','active_user_role'].forEach(k=>localStorage.removeItem(k));location.href='index.html'}
boot();
</script>
</body></html>
