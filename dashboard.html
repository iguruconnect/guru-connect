<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:#f4f7fc;color:#10234e}button,input,textarea,select{font:inherit}button{cursor:pointer}.top{background:linear-gradient(135deg,#0b1b3c,#155eef);color:#fff;padding:14px 18px;position:sticky;top:0;z-index:30;box-shadow:0 8px 25px #0b1b3c22}.topin{max-width:1280px;margin:auto;display:flex;align-items:center;gap:12px}.brand{font-size:21px;font-weight:1000;letter-spacing:.5px;flex:1}.badge{font-size:10px;font-weight:950;padding:8px 11px;border:1px solid #ffffff30;background:#ffffff15;border-radius:999px}.logout{border:0;background:#ffe4e6;color:#a3152a;border-radius:10px;padding:10px 14px;font-weight:950}.wrap{max-width:1280px;margin:18px auto;padding:0 14px}.welcome{background:linear-gradient(135deg,#fff,#eef6ff);border:1px solid #d9e4f3;border-radius:22px;padding:20px;box-shadow:0 8px 25px #183d7a0c}.welcome h1{margin:0;font-size:27px}.welcome p{margin:6px 0 0;color:#64748b;font-size:12px}.nav{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:14px 0}.nav button{border:1px solid #d8e2ef;background:#fff;color:#334155;border-radius:12px;padding:11px 8px;font-size:10px;font-weight:950}.nav button.active{background:#155eef;color:#fff;border-color:#155eef}.panel{background:#fff;border:1px solid #dbe5f1;border-radius:18px;padding:17px;box-shadow:0 7px 24px #183d7a0b;margin-bottom:12px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.stat{padding:15px;border-radius:15px;background:#f8fafc;border:1px solid #e2e8f0}.stat small{display:block;color:#64748b;font-size:9px;font-weight:950;text-transform:uppercase}.stat strong{display:block;margin-top:5px;font-size:24px}.blue{color:#155eef}.gold{color:#a16207}.green{color:#047857}.red{color:#b91c1c}.muted{font-size:11px;color:#64748b}.note{background:#eff6ff;border:1px solid #bfdbfe;color:#1e40af;border-radius:13px;padding:12px;font-size:11px;font-weight:700}.field label{display:block;font-size:9px;font-weight:950;color:#64748b;text-transform:uppercase;margin:0 0 5px}.field input,.field textarea,.field select{width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:10px;background:#fff;outline:none}.field textarea{min-height:100px;resize:vertical}.primary{border:0;background:#155eef;color:#fff;border-radius:10px;padding:11px 14px;font-weight:950;font-size:11px}.success{background:#059669}.danger{background:#dc2626}.warning{background:#b7791f}.secondary{background:#eef2f7;color:#243b63;border:1px solid #d5deea}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px}.request{border:1px solid #dce5f0;border-radius:16px;padding:15px;margin:10px 0;background:#fff}.request-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.request h3{margin:0 0 3px;font-size:16px}.pill{display:inline-flex;padding:5px 9px;border-radius:999px;background:#eef2ff;color:#3730a3;font-size:9px;font-weight:950;white-space:nowrap}.pill.open{background:#ecfdf5;color:#047857}.pill.pending{background:#fff7ed;color:#9a3412}.meta{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}.meta div{background:#f8fafc;border-radius:10px;padding:8px}.meta b{display:block;font-size:8px;color:#64748b;text-transform:uppercase}.meta span{display:block;margin-top:3px;font-size:11px;font-weight:800;word-break:break-word}.chatOverlay{position:fixed;inset:0;background:#020617bb;backdrop-filter:blur(7px);z-index:100;display:none;align-items:center;justify-content:center;padding:12px}.chatOverlay.show{display:flex}.chat{width:min(920px,100%);height:min(780px,94vh);background:#fff;border-radius:22px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 30px 100px #0008}.chatHead{background:linear-gradient(135deg,#0b1b3c,#155eef);color:#fff;padding:14px 15px;display:flex;gap:10px;align-items:center}.chatHead>div{flex:1}.chatHead h2{margin:0;font-size:17px}.chatHead p{margin:4px 0 0;font-size:10px;color:#dbeafe}.close{border:0;background:#ffffff20;color:#fff;width:38px;height:38px;border-radius:10px;font-size:20px}.chatMeta{display:flex;gap:10px;flex-wrap:wrap;padding:9px 13px;background:#f8fafc;border-bottom:1px solid #e2e8f0;font-size:9px;font-weight:900}.messages{flex:1;overflow:auto;background:#f1f5f9;padding:14px}.bubble{max-width:78%;padding:10px 12px;border-radius:15px;margin:7px 0;font-size:12px;line-height:1.4}.mine{margin-left:auto;background:#155eef;color:#fff;border-bottom-right-radius:5px}.theirs{background:#fff;border:1px solid #dbe5ef;color:#172554;border-bottom-left-radius:5px}.bubble small{display:block;font-size:8px;opacity:.7;margin-top:4px}.schedule{padding:10px 13px;border-top:1px solid #e2e8f0}.scheduleRow{display:grid;grid-template-columns:1fr auto;gap:8px}.scheduleRow input{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:10px}.composer{display:grid;grid-template-columns:1fr auto;gap:8px;padding:10px 13px;border-top:1px solid #e2e8f0}.composer input{width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:10px}.empty{text-align:center;padding:35px;color:#64748b;font-size:12px;font-weight:800}.hidden{display:none!important}.requestActions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.reqSender{font-size:12px;font-weight:900}.requestBox{background:#fffaf0;border:1px solid #fde68a}.king{background:linear-gradient(135deg,#fff7ed,#fff)}
@media(max-width:850px){.nav{grid-template-columns:repeat(3,1fr)}.grid,.grid2,.meta{grid-template-columns:1fr 1fr}.topin{flex-wrap:wrap}.brand{min-width:170px}.badge{order:3;width:100%;text-align:center}}

<body>
<header class="top"><div class="topin"><div class="brand">GURU CONNECT</div><div id="roleBadge" class="badge">SECURE DASHBOARD</div><button class="logout" onclick="logoutNow()">↪ LOGOUT</button></div></header>
<main class="wrap">
<section class="welcome"><h1 id="welcome">My Kingdom</h1><p id="subtitle">Everything related to your GURU CONNECT account is here.</p></section>

</main>
<div id="chatOverlay" class="chatOverlay"><div class="chat"><div class="chatHead"><div><h2 id="chatTitle">Chat</h2><p>Private GURU CONNECT internal chat</p></div><button class="close" onclick="closeChat()">×</button></div><div id="chatMeta" class="chatMeta"></div><div id="messages" class="messages"></div><div class="schedule"><div class="muted" style="font-weight:950;margin-bottom:5px">📅 LEARNING SCHEDULING</div><div class="scheduleRow"><input id="scheduleAt" type="datetime-local"><button class="primary warning" onclick="saveSchedule()">SET SCHEDULE</button></div><div id="scheduleStatus" class="muted" style="margin-top:5px"></div></div><div class="composer"><input id="chatInput" maxlength="5000" placeholder="Write your message…" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMessage()}"><button class="primary" onclick="sendMessage()">SEND</button></div></div></div>
<script>
const SUPABASE_URL='https://hzqqswrnawrfgufbxgay.supabase.co';
const SUPABASE_KEY='sb_publishable_Oc5HvqDpisv76XrdsyFhiw_IpostID';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let me=null,role='',requests=[],connReqs=[],balance=0,ledger=[],activeChat=null,poll=null;
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=v=>{if(!v)return '—';const d=new Date(v);return isNaN(d)?String(v):d.toLocaleString('en-IN',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'})};
const pid=()=>String(me?.id||'');
async function boot(){
 const ss=await sb.auth.getSession(),u=ss.data?.session?.user;if(!u){location.href='index.html';return}
 const [st,tr]=await Promise.all([sb.from('student_profiles').select('*').eq('user_id',u.id).maybeSingle(),sb.from('tutor_profiles').select('*').eq('user_id',u.id).maybeSingle()]);
 if(st.data){me={...st.data,user_id:u.id};role='student'}else if(tr.data){me={...tr.data,user_id:u.id};role='tutor'}else{location.href='index.html';return}
 localStorage.setItem('active_user_role',role);localStorage.setItem('active_user_profile_id',me.id);localStorage.setItem('active_user_id',u.id);localStorage.setItem('active_user_name',me.name||u.email||'User');localStorage.setItem('active_user_email',u.email||'');
 welcome.textContent=`Welcome to Your Kingdom, ${me.name||'User'}`;roleBadge.textContent=role==='student'?'STUDENT • LOGGED IN':'TUTOR • LOGGED IN';subtitle.textContent=role==='student'?'Your Learning Requests, connections, messages, schedule and coins — all in one place.':'All Student Learning Requests, your connection approvals, chats, schedule and coins — all in one place.';
 nPost.classList.toggle('hidden',role!=='student');
 await refresh();
 const h=location.hash.replace('#','');tab(['home','requests','post','connections','coins','profile'].includes(h)?h:'home');
}
async function refresh(){
 const q=await sb.from('gc_learning_requests_v2').select('*').order('created_at',{ascending:false}).limit(500);requests=q.error?[]:(q.data||[]);
 const c=await sb.from('gc_connection_requests').select('*').or(`sender_profile_id.eq.${pid()},recipient_profile_id.eq.${pid()}`).order('created_at',{ascending:false}).limit(300);connReqs=c.error?[]:(c.data||[]);
 const w=await sb.from('gc_coin_wallets').select('balance').eq('profile_id',pid()).maybeSingle();balance=Number(w.data?.balance||0);
 const l=await sb.from('gc_coin_ledger').select('*').eq('profile_id',pid()).order('created_at',{ascending:false}).limit(300);ledger=l.error?[]:(l.data||[]);
}
function tab(t){document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));const id={home:'nHome',requests:'nRequests',post:'nPost',connections:'nConnections',coins:'nCoins',profile:'nProfile'}[t];document.getElementById(id)?.classList.add('active');if(t==='home')renderHome();if(t==='requests')renderRequests();if(t==='post')renderPost();if(t==='connections')renderConnections();if(t==='coins')renderCoins();if(t==='profile')renderProfile();history.replaceState(null,'','#'+t)}
function mine(r){return role==='student'?String(r.student_id)===pid():String(r.tutor_id)===pid()}
function renderHome(){
 const own=role==='student'?requests.filter(r=>String(r.student_id)===pid()):requests.filter(r=>String(r.tutor_id)===pid());
 const pending=connReqs.filter(r=>String(r.recipient_profile_id)===pid()&&r.status==='PENDING').length;
 const active=own.filter(r=>r.tutor_id&&['TUTOR_ACCEPTED','TUTOR_COMPLETED','PENDING_ADMIN_APPROVAL','PENDING_ADMIN_REVIEW','COMPLETED','APPROVED'].includes(String(r.status))).length;
 document.getElementById('content').innerHTML=`<div class="grid"><div class="stat"><small>LEARNING REQUESTS</small><strong class="blue">${role==='student'?requests.filter(r=>String(r.student_id)===pid()).length:requests.length}</strong></div><div class="stat"><small>CONNECTION REQUESTS</small><strong class="gold">${pending}</strong></div><div class="stat"><small>GURU COINS</small><strong class="green">🪙 ${balance.toLocaleString('en-IN')}</strong></div></div><div class="panel king"><h2 style="margin:0 0 6px">👑 Your GURU CONNECT Kingdom</h2><p class="muted">${role==='student'?'Post learning help, see the complete record of your requests, accept or reject Tutor connection requests, chat privately, schedule learning and manage your coins.':'See every Student Learning Request, send connection requests, wait for the Student to accept, chat privately, schedule learning and manage your coins.'}</p><div class="actions"><button class="primary" onclick="tab('requests')">📚 OPEN LEARNING BOARD</button><button class="primary secondary" onclick="tab('connections')">🤝 CONNECTIONS</button><button class="primary secondary" onclick="tab('coins')">🪙 COIN ACCOUNT</button></div></div>`}
function requestCard(r){
 const ownStudent=role==='student'&&String(r.student_id)===pid(), ownTutor=role==='tutor'&&String(r.tutor_id)===pid();
 const connected=!!r.tutor_id;let a='';
 if(role==='tutor'&&r.status==='OPEN'&&!connected)a+=`<button class="primary success" onclick="sendLearningConnect('${r.id}')">CONNECT WITH STUDENT</button>`;
 if(role==='tutor'&&ownTutor&&r.status==='TUTOR_ACCEPTED')a+=`<button class="primary warning" onclick="completeRequest('${r.id}')">WORK COMPLETED</button>`;
 if((ownStudent||ownTutor)&&connected)a+=`<button class="primary" onclick="openChat('${r.id}')">💬 ${role==='student'?'CHAT WITH TUTOR':'CHAT WITH STUDENT'}</button>`;
 if(ownStudent&&r.status==='TUTOR_COMPLETED')a+=`<button class="primary success" onclick="studentOutcome('${r.id}','SATISFIED')">✓ CONFIRMATION: LR SATISFIED</button><button class="primary danger" onclick="studentOutcome('${r.id}','NOT_SATISFIED')">LR NOT SATISFIED</button>`;
 const pending=connReqs.some(c=>String(c.learning_request_id)===String(r.id)&&c.status==='PENDING'&&String(c.sender_profile_id)===pid());
 if(role==='tutor'&&r.status==='OPEN'&&!connected&&pending)a=`<span class="pill pending">CONNECTION REQUEST SENT — WAITING FOR STUDENT</span>`;
 return `<article class="request"><div class="request-head"><div><h3>${esc(r.subject||'Learning Request')}</h3><div class="muted">${esc(r.request_code||r.id)} · ${esc(r.course||'')} ${r.stream?'• '+esc(r.stream):''}</div></div><span class="pill ${r.status==='OPEN'?'open':''}">${esc(String(r.status||'OPEN').replaceAll('_',' '))}</span></div><div class="meta"><div><b>Student</b><span>${esc(r.student_short_id||r.student_id||'—')}</span></div><div><b>Tutor</b><span>${esc(r.tutor_short_id||r.tutor_id||'Not connected')}</span></div><div><b>Learning Deadline</b><span>${r.learning_deadline?fmt(r.learning_deadline):'Not set'}</span></div><div><b>Topic</b><span>${esc(r.topic||'—')}</span></div><div><b>Coins Held — Admin</b><span class="gold">🪙 ${Number(r.coins_held||0)} HELD</span></div><div><b>Student Confirmation</b><span>${esc(r.student_outcome||'Pending')}</span></div></div><div class="muted" style="margin-top:10px"><b>Issue:</b> ${esc(r.issue||r.problem||'—')}</div><div class="requestActions">${a}</div></article>`}
function renderRequests(){let rows=role==='student'?requests.filter(r=>String(r.student_id)===pid()):requests;document.getElementById('content').innerHTML=`<div class="panel"><div class="note"><b>📚 ${role==='tutor'?'ALL STUDENT LEARNING REQUESTS':'MY LEARNING REQUESTS'}</b><br>${role==='tutor'?'Every Student request is listed here. A Tutor can only send a connection request; the Student has complete freedom to ACCEPT or REJECT it.':'Your complete Learning Request record stays here.'} Every request costs <b>100 GURU COINS</b>; coins are held with Admin until the Student confirms <b>LR SATISFIED</b> and Admin approves release.</div>${rows.length?rows.map(requestCard).join(''):'<div class="empty">No Learning Requests found.</div>'}</div>`}
function renderPost(){if(role!=='student'){document.getElementById('content').innerHTML='<div class="panel empty">Only Students can post a Learning Request.</div>';return}document.getElementById('content').innerHTML=`<div class="panel"><h2 style="margin:0">➕ Post Learning Request</h2><p class="muted">You need <b>100 GURU COINS</b> before the request can be sent. When posted, 100 coins are debited and placed on <b>ADMIN HOLD</b>. They are not paid to the Tutor yet.</p><div class="grid" style="margin:12px 0"><div class="stat"><small>AVAILABLE</small><strong class="blue">🪙 ${balance}</strong></div><div class="stat"><small>REQUEST COST</small><strong class="green">100</strong></div><div class="stat"><small>ADMIN HOLD</small><strong class="gold">ESCROW</strong></div></div>${balance<100?'<div class="note" style="background:#fff1f2;border-color:#fecaca;color:#991b1b">Insufficient coins. Add coins before posting.</div>':''}<div class="grid2" style="margin-top:12px"><div class="field"><label>Course</label><input id="fCourse" placeholder="HSC / JEE / College"></div><div class="field"><label>Stream</label><input id="fStream" placeholder="Science / Commerce / Arts"></div><div class="field"><label>Subject *</label><input id="fSubject" placeholder="Physics"></div><div class="field"><label>Topic / Chapter</label><input id="fTopic" placeholder="Electrostatics"></div><div class="field"><label>Learning Deadline *</label><input id="fDeadline" type="datetime-local"></div><div class="field"><label>Issue / Problem *</label><textarea id="fIssue" placeholder="Tell the Tutor what you need to understand."></textarea></div></div><button class="primary" style="margin-top:12px" onclick="postRequest()" ${balance<100?'disabled':''}>POST REQUEST — 100 🪙</button></div>`}
function renderConnections(){const incoming=connReqs.filter(c=>String(c.recipient_profile_id)===pid()&&c.status==='PENDING');const outgoing=connReqs.filter(c=>String(c.sender_profile_id)===pid());document.getElementById('content').innerHTML=`<div class="panel"><h2 style="margin:0 0 5px">🤝 Connection Requests</h2><p class="muted">${role==='student'?'A Tutor cannot enter your connection or chat until YOU accept. Accept or reject every request yourself.':'Your connection request remains pending until the Student decides.'}</p><h3 style="font-size:13px;margin-top:18px">${role==='student'?'REQUESTS WAITING FOR YOUR DECISION':'REQUESTS YOU SENT'}</h3>${(role==='student'?incoming:outgoing).length?(role==='student'?incoming:outgoing).map(connectionCard).join(''):'<div class="empty">No connection requests.</div>'}</div>`}
function connectionCard(c){const learning=c.learning_request_id?requests.find(r=>String(r.id)===String(c.learning_request_id)):null;const otherRole=role==='student'?'Tutor':'Student';const otherId=role==='student'?c.sender_profile_id:c.recipient_profile_id;let actions='';if(role==='student'&&c.status==='PENDING')actions=`<button class="primary success" onclick="respondConnection('${c.id}','ACCEPT')">✓ ACCEPT</button><button class="primary danger" onclick="respondConnection('${c.id}','REJECT')">✕ REJECT</button>`;if(c.status==='ACCEPTED'&&learning&&((role==='student'&&String(learning.student_id)===pid())||(role==='tutor'&&String(learning.tutor_id)===pid())))actions+=`<button class="primary" onclick="openChat('${learning.id}')">💬 OPEN CHAT</button>`;return `<article class="request requestBox"><div class="reqSender">${otherRole} • ${esc(otherId)}</div><div class="muted" style="margin-top:4px">${learning?'Learning Request: '+esc(learning.subject)+' · '+esc(learning.request_code||learning.id):'Profile connection request'}</div><div class="muted" style="margin-top:5px">Sent: ${fmt(c.created_at)} · Status: <b>${esc(c.status)}</b></div><div class="requestActions">${actions}</div></article>`}
function renderCoins(){const held=requests.filter(r=>((role==='student'&&String(r.student_id)===pid())||(role==='tutor'&&String(r.tutor_id)===pid()))&&Number(r.coins_held||0)>0).reduce((n,r)=>n+Number(r.coins_held||0),0);document.getElementById('content').innerHTML=`<div class="grid"><div class="stat"><small>AVAILABLE COINS</small><strong class="blue">🪙 ${balance.toLocaleString('en-IN')}</strong></div><div class="stat"><small>LEARNING COINS HELD</small><strong class="gold">🪙 ${held}</strong></div><div class="stat"><small>REQUEST PRICE</small><strong class="green">100 🪙</strong></div></div><div class="panel"><div class="note"><b>ADMIN HOLD RULE</b><br>100 coins are debited from the Student when a Learning Request is posted. The coins remain under Admin control. After Tutor completion, the Student gives <b>CONFIRMATION: LR SATISFIED</b>. Only after Admin approval are the held coins released to the Tutor.</div><h3 style="font-size:14px;margin-top:18px">Coin History</h3>${ledger.length?`<div style="overflow:auto"><table style="width:100%;border-collapse:collapse;font-size:11px"><tr><th style="text-align:left;padding:8px">Date</th><th style="text-align:left;padding:8px">Type</th><th style="text-align:left;padding:8px">Amount</th><th style="text-align:left;padding:8px">Reason</th></tr>${ledger.map(x=>`<tr><td style="padding:8px;border-top:1px solid #e2e8f0">${esc(fmt(x.created_at))}</td><td style="padding:8px;border-top:1px solid #e2e8f0">${esc(x.transaction_type||x.type||'')}</td><td style="padding:8px;border-top:1px solid #e2e8f0">${Number(x.amount||0)>0?'+':''}${esc(x.amount)}</td><td style="padding:8px;border-top:1px solid #e2e8f0">${esc(x.reason||'')}</td></tr>`).join('')}</table></div>`:'<div class="empty">No coin transactions.</div>'}</div>`}
function renderProfile(){document.getElementById('content').innerHTML=`<div class="panel"><h2 style="margin:0 0 10px">👤 My Profile</h2><div class="grid2"><div class="stat"><small>NAME</small><strong>${esc(me.name||'—')}</strong></div><div class="stat"><small>ROLE</small><strong>${role.toUpperCase()}</strong></div><div class="stat"><small>EMAIL</small><strong style="font-size:15px;word-break:break-all">${esc(me.email||'—')}</strong></div><div class="stat"><small>PHONE</small><strong style="font-size:15px">${esc(me.phone||'—')}</strong></div></div></div><div class="panel"><h3 style="margin:0">🔐 Privacy & Freedom</h3><p class="muted">Connection requests do not automatically expose a private chat. ${role==='student'?'You decide which Tutor connection requests to ACCEPT or REJECT.':'The Student decides whether to ACCEPT or REJECT your connection request.'}</p></div>`}
async function postRequest(){const subject=document.getElementById('fSubject')?.value.trim(),issue=document.getElementById('fIssue')?.value.trim(),deadline=document.getElementById('fDeadline')?.value;if(!subject||!issue||!deadline)return alert('Subject, Issue and Learning Deadline are required.');if(new Date(deadline)<=new Date())return alert('Learning Deadline must be in the future.');if(balance<100)return alert('You need at least 100 GURU COINS.');const r=await sb.rpc('gc_post_learning_request',{p_student_id:pid(),p_course:document.getElementById('fCourse').value.trim(),p_stream:document.getElementById('fStream').value.trim(),p_subject:subject,p_topic:document.getElementById('fTopic').value.trim(),p_problem:issue});if(r.error)return alert('Request could not be posted: '+r.error.message);const id=r.data?.id||r.data?.request_id||r.data?.requestId;if(id){const d=await sb.rpc('gc_set_learning_request_deadline',{p_request_id:id,p_deadline:new Date(deadline).toISOString()});if(d.error)console.warn(d.error)}alert('Learning Request posted. 100 coins debited and HELD WITH ADMIN.');await refresh();tab('requests')}
async function sendLearningConnect(id){const r=requests.find(x=>String(x.id)===String(id));if(!r)return;const x=await sb.rpc('gc_send_connection_request',{p_target_profile_id:String(r.student_id),p_target_role:'student',p_learning_request_id:String(id),p_message:`Tutor wants to connect regarding ${r.subject||'your Learning Request'}.`});if(x.error)return alert('Connection request could not be sent: '+x.error.message);alert('Connection request sent. The Student will decide ACCEPT or REJECT.');await refresh();tab('connections')}
async function respondConnection(id,decision){const x=await sb.rpc('gc_respond_connection_request',{p_request_id:String(id),p_decision:decision});if(x.error)return alert('Could not update connection: '+x.error.message);alert(decision==='ACCEPT'?'Connection accepted. You can now chat and schedule learning.':'Connection rejected. No chat was opened.');await refresh();tab('connections')}
async function completeRequest(id){const x=await sb.rpc('gc_tutor_complete_learning_request',{p_request_id:id});if(x.error)return alert(x.error.message);alert('Marked completed. The Student can now decide whether to submit LR SATISFIED.');await refresh();tab('requests')}
async function studentOutcome(id,outcome){if(outcome==='SATISFIED'&&!confirm('Confirm: LR SATISFIED? Admin will receive your confirmation for final coin release.'))return;const x=await sb.rpc('gc_student_learning_request_outcome',{p_request_id:id,p_outcome:outcome});if(x.error)return alert(x.error.message);alert(outcome==='SATISFIED'?'LR SATISFIED sent to Admin for approval.':'Your NOT SATISFIED response was sent.');await refresh();tab('requests')}
function getOther(r){return role==='student'?{id:r.tutor_id,name:r.tutor_name||'Tutor'}:{id:r.student_id,name:r.student_name||'Student'}}
async function openChat(id){const r=requests.find(x=>String(x.id)===String(id));if(!r||!r.tutor_id)return alert('Chat becomes available after the Student accepts the Tutor connection request.');if(!((role==='student'&&String(r.student_id)===pid())||(role==='tutor'&&String(r.tutor_id)===pid())))return alert('This chat is private to the connected Student and Tutor.');const o=getOther(r);activeChat={requestId:String(id),other:String(o.id),otherName:o.name||'User'};chatTitle.textContent='Chat with '+(o.name||'User');chatMeta.innerHTML=`<span>📚 ${esc(r.subject||'Learning Request')}</span><span>🔐 ${esc(r.request_code||r.id)}</span><span>🪙 ${Number(r.coins_held||0)} Held with Admin</span><span>⏰ ${r.learning_deadline?esc(fmt(r.learning_deadline)):'No deadline'}</span>`;chatOverlay.classList.add('show');await renderChat();clearInterval(poll);poll=setInterval(renderChat,2500);setTimeout(()=>chatInput.focus(),100)}
function closeChat(){chatOverlay.classList.remove('show');clearInterval(poll);poll=null;activeChat=null}
async function renderChat(){if(!activeChat)return;const q=await sb.from('gc_messages').select('*').or(`and(from_id.eq.${pid()},to_id.eq.${activeChat.other}),and(from_id.eq.${activeChat.other},to_id.eq.${pid()})`).order('created_at',{ascending:true}).limit(500);const rows=q.error?[]:(q.data||[]);messages.innerHTML=rows.length?rows.map(m=>`<div class="bubble ${String(m.from_id)===pid()?'mine':'theirs'}">${esc(m.body)}<small>${esc(m.from_name||'User')} · ${esc(fmt(m.created_at))}</small></div>`).join(''):'<div class="empty">No messages yet. Start the conversation.</div>';messages.scrollTop=messages.scrollHeight}
async function sendMessage(){if(!activeChat)return;const body=chatInput.value.trim();if(!body)return;const x=await sb.from('gc_messages').insert({id:'chat_'+crypto.randomUUID(),from_type:'user',from_id:pid(),from_name:me.name||'User',to_type:'user',to_id:activeChat.other,to_role:role==='student'?'tutor':'student',to_name:activeChat.otherName,subject:'GCCHAT|'+activeChat.requestId,body,created_at:new Date().toISOString(),read:false});if(x.error)return alert('Message could not be sent: '+x.error.message);chatInput.value='';renderChat()}
async function saveSchedule(){if(!activeChat)return;const v=scheduleAt.value;if(!v)return alert('Select date and time.');const x=await sb.rpc('gc_schedule_learning_session',{p_request_id:activeChat.requestId,p_scheduled_at:new Date(v).toISOString()});if(x.error)return alert('Schedule could not be saved: '+x.error.message);scheduleStatus.textContent='✓ Learning schedule saved for both Student and Tutor.';await refresh()}
async function logoutNow(){try{await sb.auth.signOut()}catch(_){}['active_user_name','active_user_phone','active_user_email','active_user_profile_id','active_user_id','active_user_role'].forEach(k=>localStorage.removeItem(k));location.href='index.html'}
boot();
</script></body></html>
