<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:#f5f8ff;color:#10234e}button,input,textarea,select{font:inherit}button{cursor:pointer}.top{background:linear-gradient(135deg,#081a3d,#155eef);color:#fff;padding:13px 18px;position:sticky;top:0;z-index:30;box-shadow:0 10px 28px #0b1b3c22}.topin{max-width:1320px;margin:auto;display:flex;align-items:center;gap:12px}.brand{font-size:22px;font-weight:1000;letter-spacing:.4px;flex:1}.badge{font-size:10px;font-weight:950;padding:8px 12px;border:1px solid #ffffff30;background:#ffffff15;border-radius:999px}.logout{border:0;background:#ffe4e6;color:#a3152a;border-radius:10px;padding:10px 14px;font-weight:950}.wrap{max-width:1320px;margin:18px auto;padding:0 14px}.welcome{background:linear-gradient(135deg,#fff,#eef6ff);border:1px solid #d9e4f3;border-radius:22px;padding:20px;box-shadow:0 8px 25px #183d7a0c}.welcome h1{margin:0;font-size:28px}.welcome p{margin:6px 0 0;color:#64748b;font-size:12px}.nav{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:14px 0}.nav button{border:1px solid #d8e2ef;background:#fff;color:#334155;border-radius:12px;padding:12px 8px;font-size:10px;font-weight:950}.nav button.active{background:#155eef;color:#fff;border-color:#155eef}.panel{background:#fff;border:1px solid #dbe5f1;border-radius:18px;padding:17px;box-shadow:0 7px 24px #183d7a0b;margin-bottom:12px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.stat{padding:15px;border-radius:15px;background:#f8fafc;border:1px solid #e2e8f0}.stat small{display:block;color:#64748b;font-size:9px;font-weight:950;text-transform:uppercase}.stat strong{display:block;margin-top:5px;font-size:24px;word-break:break-word}.blue{color:#155eef}.gold{color:#a16207}.green{color:#047857}.red{color:#b91c1c}.muted{font-size:11px;color:#64748b}.note{background:#eff6ff;border:1px solid #bfdbfe;color:#1e40af;border-radius:13px;padding:12px;font-size:11px;font-weight:700}.field label{display:block;font-size:9px;font-weight:950;color:#64748b;text-transform:uppercase;margin:0 0 5px}.field input,.field textarea,.field select{width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:10px;background:#fff;outline:none}.field textarea{min-height:100px;resize:vertical}.primary{border:0;background:#155eef;color:#fff;border-radius:10px;padding:11px 14px;font-weight:950;font-size:11px}.success{background:#059669}.danger{background:#dc2626}.warning{background:#b7791f}.secondary{background:#eef2f7;color:#243b63;border:1px solid #d5deea}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px}.request{border:1px solid #dce5f0;border-radius:16px;padding:15px;margin:10px 0;background:#fff}.request-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.request h3{margin:0 0 3px;font-size:16px}.pill{display:inline-flex;padding:5px 9px;border-radius:999px;background:#eef2ff;color:#3730a3;font-size:9px;font-weight:950;white-space:nowrap}.pill.open{background:#ecfdf5;color:#047857}.pill.pending{background:#fff7ed;color:#9a3412}.pill.hold{background:#fff7ed;color:#a16207}.meta{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:12px}.meta div{background:#f8fafc;border-radius:10px;padding:8px}.meta b{display:block;font-size:8px;color:#64748b;text-transform:uppercase}.meta span{display:block;margin-top:3px;font-size:11px;font-weight:800;word-break:break-word}.requestActions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.reqSender{font-size:12px;font-weight:900}.requestBox{background:#fffaf0;border:1px solid #fde68a}.king{background:linear-gradient(135deg,#fff7ed,#fff)}.profile-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.profile-field{padding:13px;border-radius:14px;border:1px solid #e2e8f0;background:linear-gradient(135deg,#fff,#f8fbff)}.profile-field b{display:block;font-size:8px;color:#64748b;text-transform:uppercase}.profile-field span{display:block;margin-top:5px;font-size:13px;font-weight:850;word-break:break-word}.ledger-wrap{overflow:auto}.ledger{width:100%;border-collapse:collapse;min-width:760px;font-size:10px}.ledger th,.ledger td{padding:9px;border-bottom:1px solid #e2e8f0;text-align:left}.ledger th{background:#f8fafc;color:#475569;text-transform:uppercase;font-size:8px}.positive{color:#047857;font-weight:950}.negative{color:#b91c1c;font-weight:950}.chatOverlay{position:fixed;inset:0;background:#020617bb;backdrop-filter:blur(7px);z-index:100;display:none;align-items:center;justify-content:center;padding:12px}.chatOverlay.show{display:flex}.chat{width:min(920px,100%);height:min(780px,94vh);background:#fff;border-radius:22px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 30px 100px #0008}.chatHead{background:linear-gradient(135deg,#0b1b3c,#155eef);color:#fff;padding:14px 15px;display:flex;gap:10px;align-items:center}.chatHead>div{flex:1}.chatHead h2{margin:0;font-size:17px}.chatHead p{margin:4px 0 0;font-size:10px;color:#dbeafe}.close{border:0;background:#ffffff20;color:#fff;width:38px;height:38px;border-radius:10px;font-size:20px}.chatMeta{display:flex;gap:10px;flex-wrap:wrap;padding:9px 13px;background:#f8fafc;border-bottom:1px solid #e2e8f0;font-size:9px;font-weight:900}.messages{flex:1;overflow:auto;background:#f1f5f9;padding:14px}.bubble{max-width:78%;padding:10px 12px;border-radius:15px;margin:7px 0;font-size:12px;line-height:1.4}.mine{margin-left:auto;background:#155eef;color:#fff;border-bottom-right-radius:5px}.theirs{background:#fff;border:1px solid #dbe5ef;color:#172554;border-bottom-left-radius:5px}.bubble small{display:block;font-size:8px;opacity:.7;margin-top:4px}.schedule{padding:10px 13px;border-top:1px solid #e2e8f0}.scheduleRow{display:grid;grid-template-columns:1fr auto;gap:8px}.scheduleRow input{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:10px}.composer{display:grid;grid-template-columns:1fr auto;gap:8px;padding:10px 13px;border-top:1px solid #e2e8f0}.composer input{width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:10px}.empty{text-align:center;padding:35px;color:#64748b;font-size:12px;font-weight:800}.hidden{display:none!important}.deadline{color:#9a3412;font-weight:950}.freedom{background:#ecfdf5;border:1px solid #a7f3d0;color:#065f46;border-radius:13px;padding:11px;font-size:11px;font-weight:800}.danger-note{background:#fff1f2;border:1px solid #fecaca;color:#991b1b;border-radius:13px;padding:11px;font-size:11px;font-weight:800}
@media(max-width:900px){.nav{grid-template-columns:repeat(3,1fr)}.grid,.grid2,.profile-grid{grid-template-columns:1fr 1fr}.meta{grid-template-columns:1fr 1fr}.topin{flex-wrap:wrap}.brand{min-width:170px}.badge{order:3;width:100%;text-align:center}}
@media(max-width:560px){.wrap{padding:0 8px;margin:10px auto}.welcome,.panel{padding:13px;border-radius:15px}.nav{grid-template-columns:repeat(2,1fr)}.grid,.grid2,.profile-grid,.meta{grid-template-columns:1fr}.top{padding:10px}.brand{font-size:18px}.logout{padding:8px 10px;font-size:10px}.request-head{flex-direction:column}.scheduleRow,.composer{grid-template-columns:1fr}.bubble{max-width:90%}}

<body>
<header class="top"><div class="topin"><div class="brand">GURU CONNECT</div><div id="roleBadge" class="badge">SECURE DASHBOARD</div><button class="logout" onclick="logoutNow()">↪ LOGOUT</button></div></header>
<main class="wrap">
<section class="welcome"><h1 id="welcome">My Kingdom</h1><p id="subtitle">Everything related to your GURU CONNECT account is here.</p></section>
<nav class="nav">
<button id="nHome" onclick="tab('home')">🏠 HOME</button>
<button id="nRequests" onclick="tab('requests')">📚 LEARNING REQUESTS</button>
<button id="nPost" onclick="tab('post')">➕ POST LEARNING</button>
<button id="nConnections" onclick="tab('connections')">🤝 CONNECTION REQUESTS</button>
<button id="nCoins" onclick="tab('coins')">🪙 COINS</button>
<button id="nProfile" onclick="tab('profile')">👤 MY PROFILE</button>
</nav>
<section id="content"></section>
</main>
<div id="chatOverlay" class="chatOverlay"><div class="chat"><div class="chatHead"><div><h2 id="chatTitle">Chat</h2><p>Private GURU CONNECT internal chat</p></div><button class="close" onclick="closeChat()">×</button></div><div id="chatMeta" class="chatMeta"></div><div id="messages" class="messages"></div><div class="schedule"><div class="muted" style="font-weight:950;margin-bottom:5px">📅 LEARNING SCHEDULING</div><div class="scheduleRow"><input id="scheduleAt" type="datetime-local"><button class="primary warning" onclick="saveSchedule()">SET SCHEDULE</button></div><div id="scheduleStatus" class="muted" style="margin-top:5px"></div></div><div class="composer"><input id="chatInput" maxlength="5000" placeholder="Write your message…" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMessage()}"><button class="primary" onclick="sendMessage()">SEND</button></div></div></div>
<script>
const SUPABASE_URL='https://hzqqswrnawrfgufbxgay.supabase.co';
const SUPABASE_KEY='sb_publishable_Oc5HvqDpisv76XrdsyFhiw_IpostID';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let me=null,role='',requests=[],connReqs=[],balance=0,ledger=[],activeChat=null,poll=null;
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=v=>{if(!v)return '—';const d=new Date(v);return isNaN(d)?String(v):d.toLocaleString('en-IN',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});};
const pid=()=>String(me?.id||'');
const shortId=(id,rr)=>{const prefix=rr==='student'?'ST':'TU';return prefix+'-'+String(id||'').replaceAll('-','').slice(0,6).toUpperCase();};
function value(...xs){for(const x of xs){if(x!==undefined&&x!==null&&String(x).trim()!=='')return x}return 'Not provided'}
async function boot(){
 const ss=await sb.auth.getSession();const u=ss.data?.session?.user;if(!u){location.href='index.html';return}
 const [st,tr]=await Promise.all([sb.from('student_profiles').select('*').eq('user_id',u.id).maybeSingle(),sb.from('tutor_profiles').select('*').eq('user_id',u.id).maybeSingle()]);
 if(st.data){me={...st.data,user_id:u.id};role='student'}else if(tr.data){me={...tr.data,user_id:u.id};role='tutor'}else{await sb.auth.signOut();location.href='index.html';return}
 localStorage.setItem('active_user_role',role);localStorage.setItem('active_user_profile_id',me.id);localStorage.setItem('active_user_id',u.id);localStorage.setItem('active_user_name',me.name||me.full_name||u.email||'User');localStorage.setItem('active_user_email',u.email||'');localStorage.setItem('active_user_phone',me.phone||me.mobile||me.mobile_number||'');
 document.getElementById('welcome').textContent=`Welcome to Your Kingdom, ${me.name||me.full_name||'User'}`;document.getElementById('roleBadge').textContent=role==='student'?'STUDENT • LOGGED IN':'TUTOR • LOGGED IN';document.getElementById('subtitle').textContent=role==='student'?'Your profile, Learning Requests, connections, private chat, schedule and coins — all in one place.':'All Student Learning Requests, your connection approvals, private chat, schedule and coins — all in one place.';
 document.getElementById('nPost').classList.toggle('hidden',role!=='student');await refresh();const h=location.hash.replace('#','');tab(['home','requests','post','connections','coins','profile'].includes(h)?h:'home');
}
async function refresh(){
 const q=await sb.from('gc_learning_requests_v2').select('*').order('created_at',{ascending:false}).limit(1000);requests=q.error?[]:(q.data||[]);
 const c=await sb.from('gc_connection_requests').select('*').or(`sender_profile_id.eq.${pid()},recipient_profile_id.eq.${pid()}`).order('created_at',{ascending:false}).limit(500);connReqs=c.error?[]:(c.data||[]);
 const w=await sb.from('gc_coin_wallets').select('balance').eq('profile_id',pid()).maybeSingle();balance=w.error?0:Number(w.data?.balance||0);
 const l=await sb.from('gc_coin_ledger').select('*').eq('profile_id',pid()).order('created_at',{ascending:false}).limit(500);ledger=l.error?[]:(l.data||[]);
}
function tab(t){document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));const id={home:'nHome',requests:'nRequests',post:'nPost',connections:'nConnections',coins:'nCoins',profile:'nProfile'}[t];document.getElementById(id)?.classList.add('active');if(t==='home')renderHome();if(t==='requests')renderRequests();if(t==='post')renderPost();if(t==='connections')renderConnections();if(t==='coins')renderCoins();if(t==='profile')renderProfile();history.replaceState(null,'','#'+t)}
function renderHome(){const own=requests.filter(r=>String(r.student_id)===pid());const pending=connReqs.filter(c=>String(c.recipient_profile_id)===pid()&&c.status==='PENDING').length;const held=requests.filter(r=>((role==='student'&&String(r.student_id)===pid())||(role==='tutor'&&String(r.tutor_id)===pid()))&&Number(r.coins_held||0)>0).reduce((n,r)=>n+Number(r.coins_held||0),0);document.getElementById('content').innerHTML=`<div class="grid"><div class="stat"><small>${role==='student'?'MY':'ALL'} LEARNING REQUESTS</small><strong class="blue">${role==='student'?own.length:requests.length}</strong></div><div class="stat"><small>CONNECTION REQUESTS</small><strong class="gold">${pending}</strong></div><div class="stat"><small>AVAILABLE COINS</small><strong class="green">🪙 ${balance.toLocaleString('en-IN')}</strong></div></div><div class="panel king"><h2 style="margin:0 0 6px">👑 Your GURU CONNECT Kingdom</h2><p class="muted">${role==='student'?'Post learning help, keep the complete permanent request record, decide which Tutor may connect with you, chat privately, schedule learning and manage your coins.':'See every Student Learning Request, send a connection request, wait for the Student to accept or reject it, chat privately, schedule learning and manage your coins.'}</p><div class="actions"><button class="primary" onclick="tab('requests')">📚 OPEN LEARNING BOARD</button>${role==='student'?'<button class="primary secondary" onclick="tab(\'post\')">➕ POST LEARNING</button>':''}<button class="primary secondary" onclick="tab('connections')">🤝 CONNECTIONS</button><button class="primary secondary" onclick="tab('coins')">🪙 COIN ACCOUNT</button></div></div>${role==='student'?`<div class="freedom">🔐 <b>Your choice:</b> Tutors may send you connection requests, but only <b>you</b> can ACCEPT or REJECT them. No private chat is opened before your acceptance.</div>`:`<div class="freedom">🔐 <b>Student choice is final:</b> your Connect request remains pending until the Student accepts or rejects it.</div>`}`}
function requestCard(r){const mineStudent=String(r.student_id)===pid();const mineTutor=String(r.tutor_id)===pid();const status=String(r.status||'OPEN');let a='';if(role==='tutor'&&status==='OPEN'&&!r.tutor_id)a=`<button class="primary" onclick="sendLearningConnect('${r.id}')">🤝 CONNECT WITH STUDENT</button>`;if(role==='tutor'&&mineTutor&&status==='TUTOR_ACCEPTED')a=`<button class="primary warning" onclick="openChat('${r.id}')">💬 CHAT WITH STUDENT</button><button class="primary success" onclick="completeRequest('${r.id}')">✓ WORK COMPLETED</button>`;if(role==='tutor'&&mineTutor&&['TUTOR_COMPLETED','PENDING_ADMIN_APPROVAL','PENDING_ADMIN_REVIEW'].includes(status))a=`<button class="primary" onclick="openChat('${r.id}')">💬 CHAT WITH STUDENT</button>`+(status==='TUTOR_COMPLETED'?'<span class="pill hold">WAITING FOR STUDENT CONFIRMATION</span>':'');if(role==='student'&&mineStudent&&status==='TUTOR_COMPLETED')a=`<button class="primary success" onclick="outcome('${r.id}','SATISFIED')">✓ CONFIRMATION: LR SATISFIED</button><button class="primary danger" onclick="outcome('${r.id}','NOT_SATISFIED')">✕ COMPLETED BUT NOT SATISFIED</button>`;if((role==='student'&&mineStudent&&r.tutor_id&&['TUTOR_ACCEPTED','TUTOR_COMPLETED','PENDING_ADMIN_APPROVAL','PENDING_ADMIN_REVIEW'].includes(status)))a+=`<button class="primary secondary" onclick="openChat('${r.id}')">💬 CHAT WITH TUTOR</button>`;return `<article class="request"><div class="request-head"><div><h3>${esc(r.subject||'Learning Request')}</h3><div class="muted"><b>${esc(r.request_code||('LR-'+String(r.id||'').replaceAll('-','').slice(0,10).toUpperCase()))}</b> · ${esc(r.course||'')} ${r.stream?'• '+esc(r.stream):''}</div></div><span class="pill ${status==='OPEN'?'open':''}">${esc(status.replaceAll('_',' '))}</span></div><div class="meta"><div><b>Student ID</b><span>${esc(r.student_short_id||shortId(r.student_id,'student'))}</span></div><div><b>Tutor ID</b><span>${esc(r.tutor_short_id||(r.tutor_id?shortId(r.tutor_id,'tutor'):'Not connected'))}</span></div><div><b>Course</b><span>${esc(r.course||'—')}</span></div><div><b>Stream</b><span>${esc(r.stream||'—')}</span></div><div><b>Subject</b><span>${esc(r.subject||'—')}</span></div><div><b>Topic</b><span>${esc(r.topic||'—')}</span></div><div><b>Learning Deadline</b><span class="deadline">${r.learning_deadline?fmt(r.learning_deadline):'Not set'}</span></div><div><b>Request Date / Time</b><span>${fmt(r.created_at)}</span></div><div><b>Coins Held — Admin</b><span class="gold">🪙 ${Number(r.coins_held||0)} HELD</span></div><div><b>Student Outcome</b><span>${esc(r.student_outcome||'Pending')}</span></div></div><div class="muted" style="margin-top:10px"><b>Issue / Problem:</b> ${esc(r.issue||r.problem||'—')}</div><div class="requestActions">${a}</div></article>`}
function renderRequests(){const rows=role==='student'?requests.filter(r=>String(r.student_id)===pid()):requests;document.getElementById('content').innerHTML=`<div class="panel"><div class="note"><b>📚 ${role==='tutor'?'ALL STUDENT LEARNING REQUESTS':'MY LEARNING REQUEST RECORD'}</b><br>${role==='tutor'?'Every Student Learning Request is visible here. Connect only sends a request; the Student decides ACCEPT or REJECT.':'Every request you post stays in your permanent account record.'} Every Learning Request costs <b>100 GURU COINS</b>; the coins are debited and held with Admin until the Tutor completes the work, the Student confirms the outcome and Admin approves release.</div>${rows.length?rows.map(requestCard).join(''):'<div class="empty">No Learning Requests found.</div>'}</div>`}
function renderPost(){if(role!=='student'){document.getElementById('content').innerHTML='<div class="panel empty">Only Students can post Learning Requests.</div>';return}document.getElementById('content').innerHTML=`<div class="panel"><h2 style="margin:0">➕ Post Learning Request</h2><p class="muted">Before posting, the system requires <b>100 GURU COINS</b>. On successful posting, 100 coins are debited from your available balance and remain <b>HELD WITH ADMIN</b>. A unique Learning Request ID is generated and the record cannot be deleted by Student or Tutor.</p><div class="grid" style="margin-top:12px"><div class="stat"><small>YOUR AVAILABLE COINS</small><strong class="blue">🪙 ${balance.toLocaleString('en-IN')}</strong></div><div class="stat"><small>REQUEST COST</small><strong class="green">100 🪙</strong></div><div class="stat"><small>ADMIN HOLD</small><strong class="gold">ESCROW</strong></div></div>${balance<100?'<div class="danger-note" style="margin-top:12px">Insufficient coins. Admin must add coins to your account before you can post.</div>':''}<div class="grid2" style="margin-top:12px"><div class="field"><label>Course</label><input id="fCourse" placeholder="HSC / JEE / College"></div><div class="field"><label>Stream</label><input id="fStream" placeholder="Science / Commerce / Arts"></div><div class="field"><label>Subject *</label><input id="fSubject" placeholder="Physics" required></div><div class="field"><label>Topic / Chapter</label><input id="fTopic" placeholder="Electrostatics"></div><div class="field"><label>Learning Deadline *</label><input id="fDeadline" type="datetime-local" required></div><div class="field"><label>Issue / Problem *</label><textarea id="fIssue" placeholder="Tell the Tutor exactly what you need to understand." required></textarea></div></div><button class="primary" style="margin-top:12px" onclick="postRequest()" ${balance<100?'disabled':''}>POST LEARNING REQUEST — 100 🪙</button></div>`}
function renderConnections(){const incoming=connReqs.filter(c=>String(c.recipient_profile_id)===pid()&&c.status==='PENDING');const all=connReqs.filter(c=>String(c.sender_profile_id)===pid()||String(c.recipient_profile_id)===pid());document.getElementById('content').innerHTML=`<div class="panel"><h2 style="margin:0 0 5px">🤝 Connection Requests</h2><div class="freedom">${role==='student'?'A Tutor may request a connection, but you have complete freedom to ACCEPT or REJECT. The Tutor cannot start your private chat before acceptance.':'When you send a request, the Student has complete freedom to ACCEPT or REJECT it. Your private chat starts only after acceptance.'}</div>${role==='student'?`<h3 style="font-size:13px;margin-top:18px">REQUESTS WAITING FOR YOUR DECISION</h3>${incoming.length?incoming.map(connectionCard).join(''):'<div class="empty">No pending requests.</div>'}`:''}<h3 style="font-size:13px;margin-top:18px">CONNECTION HISTORY</h3>${all.length?all.map(connectionCard).join(''):'<div class="empty">No connection records yet.</div>'}</div>`}
function connectionCard(c){const learning=c.learning_request_id?requests.find(r=>String(r.id)===String(c.learning_request_id)):null;const isRecipient=String(c.recipient_profile_id)===pid();const otherRole=role==='student'?'Tutor':'Student';const otherId=role==='student'?c.sender_profile_id:c.recipient_profile_id;let actions='';if(isRecipient&&c.status==='PENDING')actions=`<button class="primary success" onclick="respondConnection('${c.id}','ACCEPT')">✓ ACCEPT</button><button class="primary danger" onclick="respondConnection('${c.id}','REJECT')">✕ REJECT</button>`;if(c.status==='ACCEPTED'&&learning&&((role==='student'&&String(learning.student_id)===pid())||(role==='tutor'&&String(learning.tutor_id)===pid())))actions+=`<button class="primary" onclick="openChat('${learning.id}')">💬 OPEN CHAT</button>`;return `<article class="request requestBox"><div class="reqSender">${otherRole} • ${esc(role==='student'?(c.sender_name||shortId(otherId,'tutor')):(c.recipient_name||shortId(otherId,'student')))}</div><div class="muted" style="margin-top:4px">${learning?'Learning Request: '+esc(learning.subject||'')+' · '+esc(learning.request_code||''): 'Profile connection request'}</div><div class="muted" style="margin-top:5px">Sent: ${fmt(c.created_at)} · Status: <b>${esc(c.status)}</b></div><div class="requestActions">${actions}</div></article>`}
function renderCoins(){const held=requests.filter(r=>((role==='student'&&String(r.student_id)===pid())||(role==='tutor'&&String(r.tutor_id)===pid()))&&Number(r.coins_held||0)>0).reduce((n,r)=>n+Number(r.coins_held||0),0);document.getElementById('content').innerHTML=`<div class="grid"><div class="stat"><small>AVAILABLE COINS</small><strong class="blue">🪙 ${balance.toLocaleString('en-IN')}</strong></div><div class="stat"><small>LEARNING COINS HELD WITH ADMIN</small><strong class="gold">🪙 ${held}</strong></div><div class="stat"><small>PRICES</small><strong class="green">100 / 200 🪙</strong></div></div><div class="panel"><div class="note"><b>COIN CONTROL</b><br>Learning Request = <b>100 🪙</b>. Tutor Profile Listing = <b>100 🪙 / month</b>. Verified Tick = <b>200 🪙</b>. Student-to-Tutor direct transfer is never allowed. Admin controls release of Learning Request coins.</div><h3 style="font-size:14px;margin-top:18px">🧾 My Coin Transaction History</h3><p class="muted">This is read-only for Students and Tutors. Admin can add/minus coins and edit the official ledger from the Staff Dashboard.</p><div class="ledger-wrap">${ledger.length?`<table class="ledger"><thead><tr><th>Date / Time</th><th>Transaction</th><th>Credited</th><th>Debited</th><th>Reason</th><th>Learning Request ID</th></tr></thead><tbody>${ledger.map(x=>{const a=Number(x.amount||0);const credit=a>0?a:0,debit=a<0?Math.abs(a):0;return `<tr><td>${esc(fmt(x.created_at))}</td><td>${esc(x.transaction_type||x.type||'COIN TRANSACTION')}</td><td class="positive">${credit?'+ '+credit+' 🪙':'—'}</td><td class="negative">${debit?'- '+debit+' 🪙':'—'}</td><td>${esc(x.reason||'—')}</td><td>${esc(x.learning_request_id||x.request_id||'—')}</td></tr>`}).join('')}</tbody></table>`:'<div class="empty">No coin transactions yet.</div>'}</div></div>`}
function renderProfile(){const f=(label,vals)=>`<div class="profile-field"><b>${esc(label)}</b><span>${esc(value(...vals))}</span></div>`;const id=me.id;const r=role;document.getElementById('content').innerHTML=`<div class="panel"><div style="display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap"><div><h2 style="margin:0">👤 ${esc(me.name||me.full_name||'My Profile')}</h2><p class="muted">Your account profile is shown here. Your short GURU CONNECT ID is ${esc(shortId(id,r))}.</p></div><div class="stat" style="min-width:170px"><small>GURU COINS</small><strong class="gold">🪙 ${balance.toLocaleString('en-IN')}</strong></div></div><div class="profile-grid" style="margin-top:14px">${f('NAME',[me.name,me.full_name])}${f('GURU CONNECT ID',[me.short_id,me.public_id,shortId(id,r)])}${f('HELPLINE SERVICE PLAN',[me.helpline_plan,me.helplineServicePlan,me.plan])}${f('COLLEGE',[me.college,me.college_name,me.teachingCollege])}${f('COURSE',[me.course,me.program])}${f('DIVISION',[me.division,me.div])}${f('ROLL NO',[me.roll_no,me.rollNo,me.roll_number])}${f('PHONE NUMBER',[me.phone,me.mobile,me.mobile_number])}${f('EMAIL',[me.email])}${f('AVAILABILITY',[me.availability,me.available_time])}${f('MODE',[me.mode,me.preferred_mode,me.teaching_mode])}${f('LOCATION',[me.location,me.city])}${f('ADDRESS',[me.address,me.full_address])}${f('LOOKING FOR SUBJECT',[me.looking_for_subject,me.subject,me.subjects])}</div></div><div class="panel"><h3 style="margin:0 0 6px">🪙 Coin Transaction History</h3><p class="muted">Read-only account history. Only Admin can add/minus coins or make official corrections.</p><div class="ledger-wrap">${ledger.length?`<table class="ledger"><thead><tr><th>Date / Time</th><th>Type</th><th>Credited</th><th>Debited</th><th>Reason</th><th>Learning Request ID</th></tr></thead><tbody>${ledger.map(x=>{const a=Number(x.amount||0);return `<tr><td>${esc(fmt(x.created_at))}</td><td>${esc(x.transaction_type||x.type||'')}</td><td class="positive">${a>0?'+ '+a+' 🪙':'—'}</td><td class="negative">${a<0?Math.abs(a)+' 🪙':'—'}</td><td>${esc(x.reason||'—')}</td><td>${esc(x.learning_request_id||x.request_id||'—')}</td></tr>`}).join('')}</tbody></table>`:'<div class="empty">No transactions yet.</div>'}</div></div>`}
async function postRequest(){if(role!=='student')return;if(balance<100)return alert('Insufficient GURU COINS. You need 100 coins before posting.');const subject=document.getElementById('fSubject')?.value.trim(),issue=document.getElementById('fIssue')?.value.trim(),deadline=document.getElementById('fDeadline')?.value;if(!subject||!issue||!deadline)return alert('Subject, Issue / Problem and Learning Deadline are required.');if(new Date(deadline)<=new Date())return alert('Learning Deadline must be in the future.');const x=await sb.rpc('gc_post_learning_request',{p_student_id:pid(),p_course:document.getElementById('fCourse').value.trim(),p_stream:document.getElementById('fStream').value.trim(),p_subject:subject,p_topic:document.getElementById('fTopic').value.trim(),p_problem:issue});if(x.error)return alert('Learning Request could not be posted: '+x.error.message);const id=x.data?.id||x.data?.request_id||x.data?.requestId;if(id){const d=await sb.rpc('gc_set_learning_request_deadline',{p_request_id:id,p_deadline:new Date(deadline).toISOString()});if(d.error)return alert('Request was created but deadline could not be saved. Please contact Staff.');}alert('Learning Request posted. 100 coins debited and HELD WITH ADMIN.');await refresh();tab('requests')}
async function sendLearningConnect(id){const r=requests.find(x=>String(x.id)===String(id));if(!r||role!=='tutor')return;const x=await sb.rpc('gc_send_connection_request',{p_target_profile_id:String(r.student_id),p_target_role:'student',p_learning_request_id:String(id),p_message:`Tutor wants to connect regarding ${r.subject||'your Learning Request'}.`});if(x.error)return alert('Connection request could not be sent: '+x.error.message);alert('Connection request sent. The Student will decide ACCEPT or REJECT.');await refresh();tab('connections')}
async function respondConnection(id,decision){const x=await sb.rpc('gc_respond_connection_request',{p_request_id:String(id),p_decision:decision});if(x.error)return alert('Could not update connection: '+x.error.message);alert(decision==='ACCEPT'?'Connection accepted. Private chat is now available.':'Connection rejected. No private chat was opened.');await refresh();tab('connections')}
async function completeRequest(id){const x=await sb.rpc('gc_tutor_complete_learning_request',{p_request_id:String(id)});if(x.error)return alert('Could not mark completion: '+x.error.message);alert('Work marked completed. Student must now confirm LR SATISFIED or COMPLETED BUT NOT SATISFIED.');await refresh();tab('requests')}
async function outcome(id,outcomeValue){const x=await sb.rpc('gc_student_learning_request_outcome',{p_request_id:String(id),p_outcome:outcomeValue});if(x.error)return alert('Could not submit outcome: '+x.error.message);alert('Your confirmation has been sent to Admin for review.');await refresh();tab('requests')}
function getOther(r){return role==='student'?{id:r.tutor_id,name:r.tutor_name||'Tutor'}:{id:r.student_id,name:r.student_name||'Student'}}
async function openChat(id){const r=requests.find(x=>String(x.id)===String(id));if(!r||!r.tutor_id)return alert('Chat is available only after the Student accepts the Tutor connection request.');if(!((role==='student'&&String(r.student_id)===pid())||(role==='tutor'&&String(r.tutor_id)===pid())))return alert('This chat is private to the connected Student and Tutor.');const o=getOther(r);activeChat={requestId:String(id),other:String(o.id),otherName:o.name||'User'};document.getElementById('chatTitle').textContent='Chat with '+(o.name||'User');document.getElementById('chatMeta').innerHTML=`<span>📚 ${esc(r.subject||'Learning Request')}</span><span>🔐 ${esc(r.request_code||shortId(r.id,'student'))}</span><span>🪙 ${Number(r.coins_held||0)} Held with Admin</span><span>⏰ ${r.learning_deadline?esc(fmt(r.learning_deadline)):'No deadline'}</span>`;document.getElementById('scheduleAt').value=r.learning_scheduled_at?new Date(r.learning_scheduled_at).toISOString().slice(0,16):'';document.getElementById('scheduleStatus').textContent=r.learning_scheduled_at?'Scheduled: '+fmt(r.learning_scheduled_at):'No learning session scheduled yet.';document.getElementById('chatOverlay').classList.add('show');await renderChat();clearInterval(poll);poll=setInterval(renderChat,2500);setTimeout(()=>document.getElementById('chatInput').focus(),100)}
async function renderChat(){if(!activeChat)return;const q=await sb.from('gc_messages').select('*').eq('subject','GCCHAT|'+activeChat.requestId).order('created_at',{ascending:true}).limit(500);const rows=q.error?[]:(q.data||[]);document.getElementById('messages').innerHTML=rows.length?rows.map(m=>`<div class="bubble ${String(m.from_id)===pid()?'mine':'theirs'}">${esc(m.body)}<small>${esc(m.from_name||'User')} · ${fmt(m.created_at)}</small></div>`).join(''):'<div class="empty">No messages yet. Start the conversation.</div>';const box=document.getElementById('messages');box.scrollTop=box.scrollHeight}
async function sendMessage(){if(!activeChat)return;const body=document.getElementById('chatInput').value.trim();if(!body)return;const x=await sb.from('gc_messages').insert({id:'chat_'+crypto.randomUUID(),from_type:'user',from_id:pid(),from_name:me.name||me.full_name||'User',to_type:'user',to_id:activeChat.other,to_role:role==='student'?'tutor':'student',to_name:activeChat.otherName,subject:'GCCHAT|'+activeChat.requestId,body,created_at:new Date().toISOString(),read:false});if(x.error)return alert('Message could not be sent: '+x.error.message);document.getElementById('chatInput').value='';await renderChat()}
async function saveSchedule(){if(!activeChat)return;const v=document.getElementById('scheduleAt').value;if(!v)return alert('Select a date and time.');const x=await sb.rpc('gc_schedule_learning_session',{p_request_id:activeChat.requestId,p_scheduled_at:new Date(v).toISOString()});if(x.error)return alert('Schedule could not be saved: '+x.error.message);document.getElementById('scheduleStatus').textContent='✓ Learning schedule saved for both Student and Tutor.';await refresh()}
function closeChat(){document.getElementById('chatOverlay').classList.remove('show');clearInterval(poll);poll=null;activeChat=null}
async function logoutNow(){try{await sb.auth.signOut({scope:'local'})}catch(e){try{await sb.auth.signOut()}catch(_){} }['active_user_name','active_user_phone','active_user_email','active_user_profile_id','active_user_id','active_user_role'].forEach(k=>localStorage.removeItem(k));location.replace('index.html?logged_out=1')}
window.addEventListener('beforeunload',()=>clearInterval(poll));
boot();
</script>
</body></html>
