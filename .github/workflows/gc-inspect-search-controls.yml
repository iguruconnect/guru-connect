name: Inspect homepage search controls
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/gc-inspect-search-controls.yml"
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print search bar and public menu scripts
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path("index.html").read_text(encoding="utf-8")
          lines=s.splitlines()
          keys=("gc-mobile-hero-search","search","gc-public-menu-v13","gc-header-brand-buy-now-only-2026","gc-restore-dropdown-menu-2026")
          for key in keys:
              hits=[i for i,x in enumerate(lines) if key.lower() in x.lower()]
              print(f"\\n===== {key}: {hits[:20]} =====")
              for i in hits[:8]:
                  print("\\n".join(f"{j+1}: {lines[j]}" for j in range(max(0,i-7),min(len(lines),i+13))))
          print("\\n===== INPUT / BUTTON MARKUP WITH SEARCH LABELS =====")
          for i,x in enumerate(lines):
              if ("<input" in x.lower() or "<button" in x.lower() or "<form" in x.lower()) and any(k in x.lower() for k in ("search","find","buy now")):
                  print(f"{i+1}: {x[:1200]}")
          print("\\n===== HEADER / SEARCH SCRIPT TAIL =====")
          for i,x in enumerate(lines):
              if "gc-public-menu-v13" in x:
                  print("\\n".join(f"{j+1}: {lines[j]}" for j in range(i,min(len(lines),i+100))))
                  break
          PY
