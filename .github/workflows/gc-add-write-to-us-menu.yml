name: Add Write to Us link to mobile visitor menu
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/gc-add-write-to-us-menu.yml"
permissions:
  contents: write
jobs:
  add-write-to-us:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Add visitor link inside mobile hamburger menu
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")
          menu=re.search(r'(<nav\b(?=[^>]*id=["\']publicNavbarLinks["\'])[^>]*>)([\s\S]*?)(</nav>)',s,re.I)
          if not menu:
              raise SystemExit("STOP: mobile visitor menu #publicNavbarLinks not found.")
          body=menu.group(2)
          if 'href="/write-to-us/"' not in body:
              anchor='<a class="block px-5 py-3 text-[11px] sm:text-sm font-bold text-blue-700 hover:bg-blue-600 hover:text-white transition" href="/write-to-us/" onclick="closeNavMenu()">✉️ WRITE TO US</a>'
              guide=re.search(r'<a\b(?=[^>]*href=["\']/guidelines/["\'])[^>]*>.*?</a>',body,re.I|re.S)
              if guide:
                  body=body[:guide.end()]+'\n'+anchor+body[guide.end():]
              else:
                  body=body+'\n'+anchor
              s=s[:menu.start(2)]+body+s[menu.end(2):]
              p.write_text(s,encoding="utf-8")
              print("Inserted WRITE TO US in the mobile hamburger menu.")
          else:
              print("WRITE TO US is already present in the mobile hamburger menu.")
          PY
      - name: Commit menu link
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No menu change was needed."
          else
            git commit -m "Add Write to Us to mobile hamburger menu"
            git pull --rebase origin main
            git push origin main
          fi
