name: Integrate Buy Now into public website navigation
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/gc-buy-now-navigation.yml"
permissions:
  contents: write
jobs:
  integrate-buy-now:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Add Buy Now as a real menu item
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path("index.html")
          s = p.read_text(encoding="utf-8")
          marker = "GC_BUY_NOW_PUBLIC_MENU_V7_20261111"
          if marker not in s:
              script = """
          <style id="gc-buy-now-public-menu-v7-style">
          a[data-gc-buy-now-menu] { display:inline-flex!important;align-items:center!important;justify-content:center!important;background:#ff8500!important;color:#fff!important;-webkit-text-fill-color:#fff!important;padding:9px 15px!important;margin:4px 8px!important;border-radius:10px!important;font-weight:950!important;text-decoration:none!important;opacity:1!important;visibility:visible!important;position:relative!important;z-index:99999!important;white-space:nowrap!important;box-shadow:0 3px 10px #0002!important; }
          </style>
          <script id="gc-buy-now-public-menu-v7">
          /* GC_BUY_NOW_PUBLIC_MENU_V7_20261111 */
          (() => {
            const install = () => {
              const selectors = 'header nav, nav, .navbar-nav, .nav-links, .nav-menu, .menu-items, .navigation, .navbar, [role="navigation"], header .menu, header';
              const roots = Array.from(document.querySelectorAll(selectors));
              let inserted = false;
              for (const root of roots) {
                if (root.querySelector('a[data-gc-buy-now-menu]')) { inserted = true; continue; }
                const links = Array.from(root.querySelectorAll('a'));
                const contact = links.find(a => /contact/i.test((a.textContent || '') + ' ' + (a.getAttribute('href') || '')));
                const menuLike = links.length >= 2 || contact || root.matches('nav,[role="navigation"],.navbar-nav,.nav-links,.nav-menu,.menu-items');
                if (!menuLike) continue;
                const link = document.createElement('a');
                link.href = '/buy-now/';
                link.textContent = 'BUY NOW';
                link.setAttribute('data-gc-buy-now-menu', 'true');
                if (contact) contact.insertAdjacentElement('afterend', link);
                else root.appendChild(link);
                inserted = true;
              }
              if (!inserted) {
                const contact = Array.from(document.querySelectorAll('a')).find(a => /contact/i.test((a.textContent || '') + ' ' + (a.getAttribute('href') || '')));
                if (contact) {
                  const link = document.createElement('a');
                  link.href = '/buy-now/'; link.textContent = 'BUY NOW';
                  link.setAttribute('data-gc-buy-now-menu', 'true');
                  contact.insertAdjacentElement('afterend', link);
                }
              }
            };
            const start = () => {
              install();
              new MutationObserver(install).observe(document.documentElement, {childList:true, subtree:true});
            };
            if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start, {once:true});
            else start();
          })();
          </script>
          """
              if not re.search(r"</body\\s*>", s, re.I):
                  raise SystemExit("STOP: closing body tag not found; no changes made.")
              s = re.sub(r"</body\\s*>", lambda m: script + "\\n" + m.group(0), s, count=1, flags=re.I)
              p.write_text(s, encoding="utf-8")
          PY
      - name: Commit and push homepage menu integration
        run: |
          if git diff --quiet -- index.html; then
            echo "No homepage change required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Place Buy Now directly in public navigation menu"
          git pull --rebase origin main
          git push origin main
