name: Integrate Buy Now into public website navigation
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/gc-buy-now-navigation.yml"
permissions:
  contents: write
jobs:
  integrate-buy-now:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Add Buy Now menu link without rewriting the homepage
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path("index.html")
          s = p.read_text(encoding="utf-8")
          marker = "GC_BUY_NOW_PUBLIC_NAV_V5_20261111"
          if marker not in s:
              script = """
          <style id="gc-buy-now-nav-visibility-v5-20261111">
          a[data-gc-buy-now-nav], a[data-gc-buy-now-nav]:visited, a[data-gc-buy-now-nav]:hover { display:inline-flex!important;align-items:center!important;justify-content:center!important;background:#f97316!important;color:#fff!important;-webkit-text-fill-color:#fff!important;padding:10px 16px!important;margin:4px 8px!important;border-radius:9px!important;font-weight:900!important;text-decoration:none!important;opacity:1!important;visibility:visible!important; }
          </style>
          <script id="gc-buy-now-public-nav-v5-20261111">
          /* GC_BUY_NOW_PUBLIC_NAV_V5_20261111 */
          (() => {
            const addLink = () => {
              if (document.querySelector('a[data-gc-buy-now-nav]')) return;
              const anchors = Array.from(document.querySelectorAll('header a, nav a, .navbar a, .navigation a'));
              const contact = anchors.find(a => {
                const label = (a.textContent || '').trim().toLowerCase();
                const href = (a.getAttribute('href') || '').toLowerCase();
                return label.includes('contact') || href.includes('contactus') || href.includes('/contact');
              });
              const link = document.createElement('a');
              link.href = '/buy-now/';
              link.textContent = 'BUY NOW';
              link.setAttribute('data-gc-buy-now-nav', 'true');
              link.style.cssText = 'display:inline-flex!important;align-items:center!important;justify-content:center;margin:4px 8px!important;padding:10px 16px!important;border-radius:9px!important;background:#f97316!important;color:#fff!important;-webkit-text-fill-color:#fff!important;font-weight:900!important;text-decoration:none!important;white-space:nowrap!important;visibility:visible!important;opacity:1!important;';
              if (contact && contact.parentElement) contact.insertAdjacentElement('afterend', link);
              else { const nav = document.querySelector('header nav, nav, .navbar, .navigation, header'); if (nav) nav.appendChild(link); }
            };
            const start = () => { addLink(); new MutationObserver(addLink).observe(document.documentElement,{childList:true,subtree:true}); };
            if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded',start,{once:true}); else start();
          })();
          </script>
          """
              if not re.search(r"</body\s*>", s, re.I):
                  raise SystemExit("STOP: closing body tag not found; no changes made.")
              s = re.sub(r"</body\s*>", lambda m: script + "\n" + m.group(0), s, count=1, flags=re.I)
              p.write_text(s, encoding="utf-8")
          PY
      - name: Commit and push homepage navigation integration
        run: |
          if git diff --quiet -- index.html; then
            echo "No homepage change required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Integrate Buy Now into public website menu"
          git pull --rebase origin main
          git push origin main
