name: Integrate Buy Now into public website navigation
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/gc-buy-now-navigation.yml"
permissions:
  contents: write
jobs:
  integrate-buy-now:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Add Buy Now menu link without rewriting the homepage
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path("index.html")
          s = p.read_text(encoding="utf-8")
          marker = "GC_BUY_NOW_PUBLIC_NAV_20261111"
          if marker not in s:
              script = """
          <script id="gc-buy-now-public-nav-20261111">
          /* GC_BUY_NOW_PUBLIC_NAV_20261111 */
          (() => {
            const addLink = () => {
              const anchors = Array.from(document.querySelectorAll('a[href]'));
              const contacts = anchors.filter(a => /contact\s*us/i.test((a.textContent || '').trim()) || /\/contactus\/?(?:[?#]|$)/i.test(a.getAttribute('href') || ''));
              contacts.forEach(contact => {
                const scope = contact.closest('nav, header, .menu, .navbar, .navigation') || contact.parentElement?.parentElement;
                if (!scope || scope.querySelector('[data-gc-buy-now-nav]')) return;
                const link = document.createElement('a');
                link.href = '/buy-now/';
                link.textContent = 'BUY NOW';
                link.setAttribute('data-gc-buy-now-nav', 'true');
                link.style.cssText = 'display:inline-flex;align-items:center;justify-content:center;margin:4px 8px;padding:9px 15px;border-radius:9px;background:#f97316;color:#fff!important;font-weight:900;text-decoration:none;white-space:nowrap;';
                const item = contact.closest('li');
                if (item && item.parentElement) {
                  const clone = item.cloneNode(false);
                  clone.appendChild(link);
                  item.parentElement.insertBefore(clone, item.nextSibling);
                } else {
                  contact.insertAdjacentElement('afterend', link);
                }
              });
            };
            if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', addLink, {once:true});
            else addLink();
            const observer = new MutationObserver(addLink);
            observer.observe(document.documentElement, {childList:true,subtree:true});
          })();
          </script>
          """
              if not re.search(r"</body\s*>", s, re.I):
                  raise SystemExit("STOP: closing body tag not found; no changes made.")
              s = re.sub(r"</body\s*>", lambda m: script + "\n" + m.group(0), s, count=1, flags=re.I)
              p.write_text(s, encoding="utf-8")
          PY
      - name: Commit and push homepage navigation integration
        run: |
          if git diff --quiet -- index.html; then
            echo "No homepage change required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Integrate Buy Now into public website menu"
          git push origin main
