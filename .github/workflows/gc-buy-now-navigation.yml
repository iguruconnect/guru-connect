name: Update public website dropdown menu
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/gc-buy-now-navigation.yml"
permissions:
  contents: write
jobs:
  update-dropdown:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Replace the two links inside the actual public dropdown
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path("index.html")
          s = p.read_text(encoding="utf-8")
          # Remove only the earlier injected generic menu helpers.
          for style_id, script_id in [
              ("gc-buy-now-public-menu-v11-style", "gc-buy-now-public-menu-v11"),
              ("gc-public-menu-v12-style", "gc-public-menu-v12"),
              ("gc-public-menu-v13-style", "gc-public-menu-v13"),
          ]:
              s = re.sub(r'<style id="' + re.escape(style_id) + r'".*?</style>\\s*', '', s, flags=re.I|re.S)
              s = re.sub(r'<script id="' + re.escape(script_id) + r'".*?</script>\\s*', '', s, flags=re.I|re.S)

          registration = '<a class="block px-5 py-3 text-[11px] sm:text-sm font-bold text-emerald-700 hover:bg-emerald-600 hover:text-white transition" href="/registration/" onclick="closeNavMenu()">REGISTRATION</a>'
          buy_now = '<a class="block px-5 py-3 text-[11px] sm:text-sm font-bold text-white bg-orange-500 hover:bg-orange-600 transition" href="/buy-now/" onclick="closeNavMenu()">BUY NOW</a>'

          patterns = [
              (r"""<a\b(?=[^>]*href="#tutors")[^>]*>\s*EXPLORE\s+TUTORS\s*</a>""", registration),
              (r"""<a\b(?=[^>]*href="#studentsDirectory")[^>]*>\s*STUDENTS\s+DIRECTORY\s*</a>""", buy_now),
          ]
          for pattern, replacement in patterns:
              s, count = re.subn(pattern, replacement, s, count=1, flags=re.I|re.S)
              if count != 1:
                  raise SystemExit("STOP: expected dropdown item was not found exactly once; no homepage changes committed.")

          p.write_text(s, encoding="utf-8")
          print("Updated the existing #publicNavbarLinks dropdown: Registration and Buy Now.")
          PY
      - name: Commit dropdown menu update
        run: |
          if git diff --quiet -- index.html; then
            echo "No dropdown change required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Replace directory entries in dropdown with Registration and Buy Now"
          git pull --rebase origin main
          git push origin main
