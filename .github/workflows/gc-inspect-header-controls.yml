name: Inspect website header controls
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/gc-inspect-header-controls.yml"
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print header markup
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path("index.html").read_text(encoding="utf-8")
          for m in re.finditer(r'<header\b[\s\S]*?</header>',s,re.I):
            b=m.group(0)
            print("HEADER OFFSET",m.start(),"LENGTH",len(b))
            print(b[:22000])
          PY