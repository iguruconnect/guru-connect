name: Remove mobile orange hero patch

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/gc-mobile-orange-hero.yml"

permissions:
  contents: write

jobs:
  remove-mobile-patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Remove orange mobile patch and keep mobile hero image hidden
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path("index.html")
          s = p.read_text(encoding="utf-8")

          # Remove every injected orange-banner implementation.
          s = re.sub(r'<script id="gc-persistent-mobile-orange-hero-script">[\\s\\S]*?</script>', '', s, flags=re.I)
          s = re.sub(r'<style id="gc-persistent-mobile-orange-hero">[\\s\\S]*?</style>', '', s, flags=re.I)
          s = re.sub(r'<style id="gc-static-mobile-orange-hero">[\\s\\S]*?</style>', '', s, flags=re.I)
          s = re.sub(r'<div id="gc-mobile-orange-thought"[^>]*>[\\s\\S]*?</div>', '', s, flags=re.I)

          # On phones, remove the complete hero area rather than showing either image or orange patch.
          style = """<style id="gc-mobile-hero-hidden">
          @media screen and (max-width:640px) {
            #publicWebsiteContent > section.gc-approved-hero#home {
              display:none !important;
            }
          }
          </style>"""
          s = re.sub(r'<style id="gc-mobile-hero-hidden">[\\s\\S]*?</style>', '', s, flags=re.I)
          if not re.search(r'</head\\s*>', s, re.I):
              raise SystemExit("STOP: index.html has no closing head tag.")
          s = re.sub(r'</head\\s*>', lambda m: style + '\\n' + m.group(0), s, count=1, flags=re.I)

          p.write_text(s, encoding="utf-8")
          print("Removed orange thought patch; mobile hero area hidden; desktop hero unchanged.")
          PY
      - name: Commit and push homepage fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Remove orange thought patch from mobile homepage"
          git push origin main
