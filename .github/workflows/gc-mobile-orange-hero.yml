name: Remove mobile orange hero patch

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/gc-mobile-orange-hero.yml"

permissions:
  contents: write

jobs:
  remove-mobile-patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Remove orange patch and prevent first-load flash
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path("index.html")
          s = p.read_text(encoding="utf-8")

          # Remove all previous injected orange-banner markup and styles.
          s = re.sub(r'<script id="gc-persistent-mobile-orange-hero-script">[\\s\\S]*?</script>', '', s, flags=re.I)
          s = re.sub(r'<style id="gc-persistent-mobile-orange-hero">[\\s\\S]*?</style>', '', s, flags=re.I)
          s = re.sub(r'<style id="gc-static-mobile-orange-hero">[\\s\\S]*?</style>', '', s, flags=re.I)
          s = re.sub(r'<div id="gc-mobile-orange-thought"[^>]*>[\\s\\S]*?</div>', '', s, flags=re.I)
          s = re.sub(r'<style id="gc-mobile-hero-hidden">[\\s\\S]*?</style>', '', s, flags=re.I)

          # Put the mobile rule at the VERY START of the document so it applies
          # before the hero can paint. Desktop layout remains untouched.
          style = """<style id="gc-mobile-hero-hidden">
          @media screen and (max-width:640px) {
            #publicWebsiteContent > section.gc-approved-hero#home,
            #publicWebsiteContent .gc-mobile-hero-copy,
            #publicWebsiteContent .gc-mobile-hero-brand {
              display:none !important;
              visibility:hidden !important;
              opacity:0 !important;
          }
          }
          </style>"""
          s = style + "\\n" + s
          p.write_text(s, encoding="utf-8")
          print("Mobile hero hidden from first paint; orange patch removed; desktop unchanged.")
          PY
      - name: Commit and push homepage fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Prevent mobile hero patch flash on page load"
          git push origin main
