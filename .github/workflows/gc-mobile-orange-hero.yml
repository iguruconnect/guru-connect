name: Keep mobile orange hero permanently visible

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/gc-mobile-orange-hero.yml"

permissions:
  contents: write

jobs:
  patch-mobile-hero:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Install static mobile orange hero in homepage markup
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path("index.html")
          s = p.read_text(encoding="utf-8")

          # Remove the previous JavaScript-dependent banner and its CSS.
          s = re.sub(r'<script id="gc-persistent-mobile-orange-hero-script">[\\s\\S]*?</script>', '', s, flags=re.I)
          s = re.sub(r'<style id="gc-persistent-mobile-orange-hero">[\\s\\S]*?</style>', '', s, flags=re.I)

          banner = '''<div id="gc-mobile-orange-thought" role="region" aria-label="A thought for learners">Dream big. Learn with purpose. Grow with confidence.</div>'''
          # Place real HTML directly inside the existing hero section; no runtime insertion.
          pattern = r'(<section\\b(?=[^>]*\\bid="home")(?=[^>]*\\bgc-approved-hero)[^>]*>)'
          s, n = re.subn(pattern, lambda m: m.group(1) + '\\n  ' + banner, s, count=1, flags=re.I)
          if n != 1:
              raise SystemExit("STOP: Could not locate the existing homepage hero section exactly once.")

          style = r"""<style id="gc-static-mobile-orange-hero">
          #publicWebsiteContent > section.gc-approved-hero#home > #gc-mobile-orange-thought { display:none !important; }
          @media screen and (max-width:640px) {
            #publicWebsiteContent > section.gc-approved-hero#home {
              display:block !important; width:100% !important; height:auto !important;
              min-height:245px !important; max-height:none !important; overflow:visible !important;
              padding:0 !important; margin:0 !important; line-height:normal !important;
              background:linear-gradient(135deg,#f47700 0%,#ff8b1f 52%,#e85d04 100%) !important;
            }
            #publicWebsiteContent > section.gc-approved-hero#home > .gc-approved-hero-image,
            #publicWebsiteContent > section.gc-approved-hero#home > .gc-mobile-hero-copy {
              display:none !important; visibility:hidden !important;
            }
            #publicWebsiteContent > section.gc-approved-hero#home > #gc-mobile-orange-thought {
              display:flex !important; visibility:visible !important; opacity:1 !important;
              position:relative !important; box-sizing:border-box !important;
              width:100% !important; min-height:245px !important; height:auto !important;
              padding:34px 24px !important; margin:0 !important;
              align-items:center !important; justify-content:center !important;
              text-align:center !important; color:#fff !important;
              background:linear-gradient(135deg,#f47700 0%,#ff8b1f 52%,#e85d04 100%) !important;
              font-family:Roboto,Arial,sans-serif !important;
              font-size:clamp(25px,7vw,34px) !important; line-height:1.25 !important;
              font-weight:900 !important; letter-spacing:-.6px !important;
              border:0 !important; border-radius:0 !important;
              box-shadow:inset 0 1px 0 #ffffff35 !important;
            }
          }
          @media screen and (min-width:641px) {
            #publicWebsiteContent > section.gc-approved-hero#home > .gc-approved-hero-image { display:block !important; }
            #publicWebsiteContent > section.gc-approved-hero#home > #gc-mobile-orange-thought { display:none !important; }
          }
          </style>"""
          if '</head>' not in s.lower():
              raise SystemExit("STOP: index.html has no closing head tag.")
          s = re.sub(r'</head\\s*>', lambda m: style + '\\n' + m.group(0), s, count=1, flags=re.I)
          p.write_text(s, encoding="utf-8")
          print("Static orange banner inserted directly in homepage HTML. No brand name; desktop hero preserved.")
          PY
      - name: Commit and push homepage fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Use static mobile orange hero banner"
          git push origin main
