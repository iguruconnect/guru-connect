name: Keep mobile orange hero permanently visible

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/gc-mobile-orange-hero.yml"

permissions:
  contents: write

jobs:
  patch-mobile-hero:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Install persistent mobile orange hero without changing desktop
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path("index.html")
          s = p.read_text(encoding="utf-8")

          style = r"""<style id="gc-persistent-mobile-orange-hero">
          #gc-mobile-orange-thought { display:none; }
          @media (max-width:640px) {
            #publicWebsiteContent > section.gc-approved-hero#home {
              display:block !important; height:auto !important; min-height:0 !important;
              max-height:none !important; overflow:visible !important; background:transparent !important;
            }
            #publicWebsiteContent > section.gc-approved-hero#home > .gc-approved-hero-image {
              display:none !important;
            }
            #gc-mobile-orange-thought {
              display:flex !important; box-sizing:border-box; width:100%; min-height:245px;
              padding:34px 24px; margin:0; align-items:center; justify-content:center;
              text-align:center; color:#fff; border-radius:0;
              background:linear-gradient(135deg,#f47700 0%,#ff8b1f 52%,#e85d04 100%);
              font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
              font-size:clamp(25px,7vw,34px); line-height:1.25; font-weight:850;
              letter-spacing:-.6px; text-wrap:balance; box-shadow:inset 0 1px 0 #ffffff35;
            }
          }
          </style>"""

          script = r"""<script id="gc-persistent-mobile-orange-hero-script">
          (function(){
            function install(){
              if(!window.matchMedia || !window.matchMedia('(max-width:640px)').matches) return;
              var home=document.querySelector('#publicWebsiteContent > section.gc-approved-hero#home') || document.getElementById('home');
              if(!home) return;
              var banner=document.getElementById('gc-mobile-orange-thought');
              if(!banner){
                banner=document.createElement('div');
                banner.id='gc-mobile-orange-thought';
                banner.setAttribute('role','region');
                banner.setAttribute('aria-label','A thought for learners');
                banner.textContent='Dream big. Learn with purpose. Grow with confidence.';
              }
              var image=home.querySelector('.gc-approved-hero-image');
              if(image){ image.style.setProperty('display','none','important'); if(image.parentNode===home) home.insertBefore(banner,image); else home.insertBefore(banner,home.firstChild); }
              else if(banner.parentNode!==home){ home.insertBefore(banner,home.firstChild); }
            }
            if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',install,{once:true});
            else install();
            var observer=new MutationObserver(install);
            observer.observe(document.documentElement,{childList:true,subtree:true});
            window.addEventListener('resize',install,{passive:true});
          })();
          </script>"""

          s = re.sub(r'<style id="gc-persistent-mobile-orange-hero">[\s\S]*?</style>', '', s, flags=re.I)
          s = re.sub(r'<script id="gc-persistent-mobile-orange-hero-script">[\s\S]*?</script>', '', s, flags=re.I)
          if not re.search(r'</head\s*>', s, re.I):
              raise SystemExit("STOP: index.html has no closing head tag.")
          s = re.sub(r'</head\s*>', style + '\\n</head>', s, count=1, flags=re.I)
          if not re.search(r'</body\s*>', s, re.I):
              raise SystemExit("STOP: index.html has no closing body tag.")
          s = re.sub(r'</body\s*>', script + '\\n</body>', s, count=1, flags=re.I)
          p.write_text(s, encoding="utf-8")
          print("Persistent orange mobile-only hero installed; no brand name included.")
          PY
      - name: Commit and push homepage fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Keep orange thought banner visible on mobile"
          git push origin main
