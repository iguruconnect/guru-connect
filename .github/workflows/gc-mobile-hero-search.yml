name: Add mobile search bar to orange homepage hero

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/gc-mobile-hero-search.yml"

permissions:
  contents: write

jobs:
  add-mobile-hero-search:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Insert mobile hero search and connect it to tutor search
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          # Homepage: add one mobile-only search bar inside the approved hero.
          p = Path("index.html")
          s = p.read_text(encoding="utf-8")
          marker = 'id="gc-mobile-hero-search"'
          if marker not in s:
              hero = None
              for m in re.finditer(r'<section\b[^>]*>', s, re.I):
                  tag = m.group(0)
                  if not re.search(r'\bid=["\']home["\']', tag, re.I):
                      continue
                  if not re.search(r'\bclass=["\'][^"\']*gc-approved-hero', tag, re.I):
                      continue
                  depth = 0
                  end = None
                  for t in re.finditer(r'</?section\b[^>]*>', s[m.start():], re.I):
                      token = t.group(0)
                      if token.startswith('</'):
                          depth -= 1
                          if depth == 0:
                              end = m.start() + t.start()
                              break
                      else:
                          depth += 1
                  if end is not None:
                      hero = (m.start(), end)
                      break
              if not hero:
                  raise SystemExit("STOP: approved homepage hero section not found; no homepage edit made.")

              markup = """
          <div id="gc-mobile-hero-search">
            <div class="gc-mobile-search-title">Find the right tutor</div>
            <form action="/explore-tutors/" method="get" role="search">
              <input type="search" name="q" maxlength="80" aria-label="Search tutor or subject" placeholder="Search tutor or subject..." required>
              <button type="submit">SEARCH</button>
            </form>
          </div>
          """
              s = s[:hero[1]] + markup + s[hero[1]:]

          style = """
          <style id="gc-mobile-hero-search-style">
          #gc-mobile-hero-search{display:none}
          @media(max-width:640px){
            #publicWebsiteContent > section.gc-approved-hero#home{position:relative!important}
            #gc-mobile-hero-search{display:block!important;position:absolute;z-index:30;left:5%;right:5%;bottom:6%;max-width:520px;margin:0 auto;padding:12px 13px 13px;background:rgba(255,255,255,.97);border:1px solid rgba(255,255,255,.9);border-radius:17px;box-shadow:0 8px 24px rgba(80,35,0,.22)}
            #gc-mobile-hero-search .gc-mobile-search-title{font:800 14px/1.3 Arial,sans-serif;color:#71320b;margin:0 0 8px;text-align:left}
            #gc-mobile-hero-search form{display:flex;align-items:center;gap:8px;margin:0}
            #gc-mobile-hero-search input{display:block;min-width:0;flex:1;height:43px;padding:0 12px;border:1px solid #d7dce3;border-radius:10px;background:#fff;color:#172033;font:600 14px Arial,sans-serif;outline:none}
            #gc-mobile-hero-search input:focus{border-color:#16843c;box-shadow:0 0 0 3px rgba(22,132,60,.12)}
            #gc-mobile-hero-search button{flex:0 0 auto;height:43px;padding:0 16px;border:0;border-radius:10px;background:#13843b;color:#fff;font:900 13px Arial,sans-serif;letter-spacing:.3px;cursor:pointer}
          }
          </style>
          """
          s = re.sub(r'<style id="gc-mobile-hero-search-style">[\s\S]*?</style>\s*', '', s, flags=re.I)
          if not re.search(r'</head\s*>', s, re.I):
              raise SystemExit("STOP: homepage head closing tag not found.")
          s = re.sub(r'</head\s*>', lambda m: style + "\n" + m.group(0), s, count=1, flags=re.I)
          p.write_text(s, encoding="utf-8")

          # Tutor search page: prefill the existing first subject field from ?q=.
          qpath = Path("explore-tutors/index.html")
          q = qpath.read_text(encoding="utf-8")
          qmarker = 'id="gc-hero-search-prefill"'
          if qmarker not in q:
              script = """
          <script id="gc-hero-search-prefill">
          (function(){
            try{
              var term=new URLSearchParams(window.location.search).get('q');
              if(!term)return;
              term=term.trim().slice(0,80);
              if(!term)return;
              var first=document.querySelector('.subject-input');
              var count=document.getElementById('subjectCount');
              if(first)first.value=term;
              if(count)count.value='1';
              var status=document.getElementById('searchStatus');
              if(status)status.textContent='Search term added: '+term+'. Complete your class, course and contact details, then select FIND REQUIRED TUTORS.';
            }catch(e){}
          })();
          </script>
          """
              if not re.search(r'</body\s*>', q, re.I):
                  raise SystemExit("STOP: tutor search page body closing tag not found.")
              q = re.sub(r'</body\s*>', lambda m: script + "\n" + m.group(0), q, count=1, flags=re.I)
              qpath.write_text(q, encoding="utf-8")

          print("Mobile orange-hero search bar inserted; search term is prefilled in the existing tutor search form.")
          PY

      - name: Commit and push homepage and search-page changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html explore-tutors/index.html
          if git diff --cached --quiet; then
            echo "No changes required."
            exit 0
          fi
          git commit -m "Add mobile hero tutor search bar"
          git push origin main
