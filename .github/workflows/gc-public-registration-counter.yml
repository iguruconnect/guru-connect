name: Add live all-time registration counter and simplify orange hero

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/gc-public-registration-counter.yml"

permissions:
  contents: write

jobs:
  update-homepage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Add a live profile counter without replacing homepage
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path("index.html")
          s = p.read_text(encoding="utf-8")

          # Hide hero copy layers but retain the approved hero artwork and existing search UI.
          css = """
          <style id="gc-clean-orange-hero-and-live-counts">
          #publicWebsiteContent > section.gc-approved-hero#home {
            position:relative !important;
          }
          #publicWebsiteContent > section.gc-approved-hero#home > :not(.gc-approved-hero-image):not(#gc-mobile-hero-search) {
            display:none !important;
            visibility:hidden !important;
            opacity:0 !important;
          }
          #publicWebsiteContent > section.gc-approved-hero#home .gc-mobile-hero-copy,
          #publicWebsiteContent > section.gc-approved-hero#home .gc-mobile-hero-brand,
          #publicWebsiteContent > section.gc-approved-hero#home h1,
          #publicWebsiteContent > section.gc-approved-hero#home h2,
          #publicWebsiteContent > section.gc-approved-hero#home h3,
          #publicWebsiteContent > section.gc-approved-hero#home p {
            display:none !important;
            visibility:hidden !important;
            opacity:0 !important;
          }
          #gc-registration-live-counts {
            box-sizing:border-box; width:min(1120px,calc(100% - 32px));
            margin:22px auto 28px; padding:22px;
            border:1px solid #e5eaf0; border-radius:22px;
            background:linear-gradient(120deg,#fff7ed 0%,#fff 34%,#eff6ff 68%,#f0fdf4 100%);
            box-shadow:0 12px 32px rgba(28,45,70,.11);
            color:#172033; font-family:inherit; position:relative; overflow:hidden;
          }
          #gc-registration-live-counts:before {
            content:"";position:absolute;inset:0 0 auto;height:6px;
            background:linear-gradient(90deg,#f97316 0 25%,#ef4444 25% 50%,#22c55e 50% 75%,#3b82f6 75% 100%);
          }
          #gc-registration-live-counts .gc-count-head {
            display:flex; align-items:center; justify-content:space-between;
            gap:12px; flex-wrap:wrap; margin-bottom:16px;
          }
          #gc-registration-live-counts h2 {
            margin:0; font-size:clamp(18px,2.2vw,24px); font-weight:800;
          }
          #gc-registration-live-counts .gc-live-pill {
            display:inline-flex; align-items:center; gap:7px;
            color:#dc2626; font-size:12px; font-weight:800; letter-spacing:.06em;
          }
          #gc-registration-live-counts .gc-live-dot {
            width:8px;height:8px;border-radius:50%;background:#16a34a;
            box-shadow:0 0 0 4px rgba(22,163,74,.12);
          }
          #gc-registration-live-counts .gc-count-grid {
            display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;
          }
          #gc-registration-live-counts .gc-count-card {
            min-width:0;padding:19px 12px;border-radius:17px;
            background:#fff;border:1px solid #edf0f4;text-align:center;
            box-shadow:0 5px 15px rgba(15,23,42,.055);position:relative;overflow:hidden;
          }
          #gc-registration-live-counts .gc-count-card:nth-child(1){border-top:4px solid #22c55e;background:linear-gradient(180deg,#f0fdf4,#fff 62%)}
          #gc-registration-live-counts .gc-count-card:nth-child(2){border-top:4px solid #f97316;background:linear-gradient(180deg,#fff7ed,#fff 62%)}
          #gc-registration-live-counts .gc-count-card:nth-child(3){border-top:4px solid #3b82f6;background:linear-gradient(180deg,#eff6ff,#fff 62%)}
          #gc-registration-live-counts .gc-count-number {
            display:block;font-size:clamp(25px,4vw,38px);line-height:1.1;
            font-weight:900;color:#172033;font-variant-numeric:tabular-nums;
          }
          #gc-registration-live-counts .gc-count-label {
            display:block;margin-top:7px;font-size:12px;font-weight:800;
            letter-spacing:.045em;color:#667085;
          }
          #gc-registration-live-counts .gc-count-foot {
            margin:13px 0 0;text-align:center;color:#7a8494;font-size:11px;
          }
          @media(max-width:560px){
            #gc-registration-live-counts{width:calc(100% - 22px);padding:15px;margin:16px auto 22px}
            #gc-registration-live-counts .gc-count-grid{gap:8px}
            #gc-registration-live-counts .gc-count-card{padding:14px 5px}
            #gc-registration-live-counts .gc-count-label{font-size:10px}
          }
          </style>
          """
          s = re.sub(r'<style id="gc-clean-orange-hero-and-live-counts">[\s\S]*?</style>\s*', '', s, flags=re.I)
          if not re.search(r'</head\s*>', s, re.I):
              raise SystemExit("STOP: </head> not found; no homepage changes made.")
          s = re.sub(r'</head\s*>', lambda m: css + "\n" + m.group(0), s, count=1, flags=re.I)

          widget = """
          <section id="gc-registration-live-counts" aria-label="GURU CONNECT all-time registrations">
            <div class="gc-count-head">
              <h2>Growing Together, Every Day</h2>
              <span style="color:#dc2626;font-size:12px;font-weight:800;letter-spacing:.06em">ALL-TIME REGISTERED PROFILES</span>
            </div>
            <div class="gc-count-grid">
              <div class="gc-count-card"><span class="gc-count-number" id="gc-student-count">—</span><span class="gc-count-label">STUDENTS REGISTERED</span></div>
              <div class="gc-count-card"><span class="gc-count-number" id="gc-tutor-count">—</span><span class="gc-count-label">TUTORS REGISTERED</span></div>
              <div class="gc-count-card"><span class="gc-count-number" id="gc-total-count">—</span><span class="gc-count-label">TOTAL MEMBERS</span></div>
            </div>
            <p class="gc-count-foot">All-time registered profiles · Updated automatically from GURU CONNECT records</p>
          </section>
          """
          if 'id="gc-registration-live-counts"' not in s:
              hero = None
              for m in re.finditer(r'<section\b[^>]*>', s, re.I):
                  tag = m.group(0)
                  if not re.search(r'\bid=["\']home["\']', tag, re.I):
                      continue
                  if not re.search(r'\bclass=["\'][^"\']*gc-approved-hero', tag, re.I):
                      continue
                  depth = 0
                  end = None
                  for t in re.finditer(r'</?section\b[^>]*>', s[m.start():], re.I):
                      if t.group(0).startswith('</'):
                          depth -= 1
                          if depth == 0:
                              end = m.start() + t.end()
                              break
                      else:
                          depth += 1
                  if end is not None:
                      hero = end
                      break
              if hero is None:
                  raise SystemExit("STOP: approved hero section not found; refusing to guess where to insert the counter.")
              s = s[:hero] + "\n" + widget.strip() + "\n" + s[hero:]

          script = """
          <script id="gc-registration-live-counts-script">
          (function(){
            if(window.__gcRegistrationCounterStarted)return;
            window.__gcRegistrationCounterStarted=true;
            var URL='https://hzqqswrnawrfgufbxgay.supabase.co';
            var KEY='sb_publishable_Oc5HvqDpisv76XrdsyFhiw_IpostIDu';
            var client=null, timer=null, channel=null;
            function number(id,n){
              var el=document.getElementById(id); if(!el)return;
              var target=Math.max(0,Number(n)||0), start=Number(el.dataset.value||0);
              el.dataset.value=String(target);
              var began=performance.now(), duration=650;
              function frame(now){
                var t=Math.min(1,(now-began)/duration), eased=1-Math.pow(1-t,3);
                el.textContent=Math.round(start+(target-start)*eased).toLocaleString('en-IN');
                if(t<1)requestAnimationFrame(frame);
              }
              requestAnimationFrame(frame);
            }
            async function refresh(){
              if(!client)return;
              try{
                var result=await client.rpc('gc_public_registration_counts');
                if(result.error)throw result.error;
                var row=Array.isArray(result.data)?result.data[0]:result.data;
                if(!row)throw new Error('Secure registration-count function returned no data');
                var students=Number(row.student_count), tutors=Number(row.tutor_count);
                var total=Number(row.total_members);
                if(!Number.isFinite(students)||!Number.isFinite(tutors)||!Number.isFinite(total))
                  throw new Error('Secure registration-count function returned invalid figures');
                number('gc-student-count',students);
                number('gc-tutor-count',tutors);
                number('gc-total-count',total);
              }catch(e){
                console.warn('GURU CONNECT public registration counts are not currently readable:',e&&e.message||e);
                ['gc-student-count','gc-tutor-count','gc-total-count'].forEach(function(id){
                  var el=document.getElementById(id);if(el&&el.dataset.value===undefined)el.textContent='—';
                });
              }
            }
            function start(){
              if(!window.supabase||!window.supabase.createClient)return;
              try{
                client=window.gcSupabase||window.supabase.createClient(URL,KEY,{auth:{persistSession:false,autoRefreshToken:false}});
                refresh();
                timer=window.setInterval(refresh,30000);
                try{
                  channel=client.channel('gc-public-profile-counts')
                    .on('postgres_changes',{event:'*',schema:'public',table:'profiles'},refresh)
                    .subscribe();
                }catch(_){}
              }catch(e){console.warn('Registration counter setup failed:',e);}
            }
            if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',start,{once:true});else start();
          })();
          </script>
          """
          # Ensure the Supabase JS client is loaded before the counter script.
          if "cdn.jsdelivr.net/npm/@supabase/supabase-js@2" not in s:
              s = re.sub(r'<script id="gc-registration-live-counts-script">', '<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>\\n<script id="gc-registration-live-counts-script">', s, count=1, flags=re.I)
          s = re.sub(r'<script id="gc-registration-live-counts-script">[\s\S]*?</script>\s*', '', s, flags=re.I)
          if not re.search(r'</body\s*>', s, re.I):
              raise SystemExit("STOP: </body> not found; refusing to save an incomplete homepage.")
          s = re.sub(r'</body\s*>', lambda m: script + "\n" + m.group(0), s, count=1, flags=re.I)
          p.write_text(s, encoding="utf-8")
          print("Inserted the live all-time student/tutor registration counter and removed hero text overlays only.")
          PY

      - name: Commit focused homepage change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No homepage change required."
            exit 0
          fi
          git commit -m "Add live all-time student and tutor registration counters"
          git push origin main
