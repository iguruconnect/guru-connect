name: Set desktop-only GURU CONNECT hero image
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/gc-desktop-hero.yml"
permissions:
  contents: write
jobs:
  desktop-hero:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Use the desktop hero asset directly without changing mobile styling
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path("index.html")
          s = p.read_text(encoding="utf-8")
          # Remove obsolete late-swap scripts so the old hero is never loaded first.
          for script_id in (
              "gc-desktop-hero-only-v3-20261111",
              "gc-desktop-hero-only-v4-20261111",
              "gc-desktop-hero-only-v5-20261111",
          ):
              pattern = r'<script[^>]*id="' + re.escape(script_id) + r'".*?</script>'
              s = re.sub(pattern, '', s, count=1, flags=re.I | re.S)
          # Change only the source of the existing hero img. Its mobile CSS/layout stays intact.
          match = re.search(r'<img\\b[^>]*class="gc-approved-hero-image"[^>]*>', s, re.I)
          if not match:
              raise SystemExit("STOP: approved hero image element not found; no change made.")
          tag = match.group(0)
          tag, src_count = re.subn(
              r'\\bsrc="[^"]*"',
              'src="/assets/gc-desktop-hero.png?rev=20261111c"',
              tag,
              count=1,
              flags=re.I
          )
          if src_count != 1:
              raise SystemExit("STOP: hero image src not found; no change made.")
          tag = re.sub(r'\\bloading="[^"]*"', 'loading="lazy"', tag, count=1, flags=re.I)
          s = s[:match.start()] + tag + s[match.end():]
          p.write_text(s, encoding="utf-8")
          PY
      - name: Commit direct desktop hero source
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Load desktop hero asset directly"
          git pull --rebase origin main
          git push origin main
