name: Set desktop-only GURU CONNECT hero image
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/gc-desktop-hero.yml"
permissions:
  contents: write
jobs:
  desktop-hero:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply desktop-only hero image
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path("index.html")
          s = p.read_text(encoding="utf-8")
          marker = "GC_DESKTOP_HERO_IMAGE_ONLY_V4_20261111"
          if marker not in s:
              script = """
          <script id="gc-desktop-hero-only-v4-20261111">
          /* GC_DESKTOP_HERO_IMAGE_ONLY_V4_20261111: preserve the mobile hero and wait for its late-loaded markup */
          (() => {
            const desktop = window.matchMedia('(min-width: 641px)');
            const imageUrl = '/assets/gc-desktop-hero.png';
            let originalSrc = null;
            let imageReady = false;
            const replacement = new Image();
            replacement.onload = () => { imageReady = true; apply(); };
            replacement.onerror = () => console.warn('GURU CONNECT desktop hero image could not be loaded:', imageUrl);
            replacement.src = imageUrl;
            const apply = () => {
              const img = document.querySelector('#publicWebsiteContent section.gc-approved-hero#home img.gc-approved-hero-image');
              if (!img) return false;
              if (originalSrc === null) originalSrc = img.getAttribute('src') || '';
              if (desktop.matches) {
                if (imageReady && img.getAttribute('src') !== imageUrl) img.src = imageUrl;
              } else if (originalSrc && img.getAttribute('src') !== originalSrc) {
                img.src = originalSrc;
              }
              return true;
            };
            let attempts = 0;
            const waitForHero = () => {
              if (apply()) return;
              if (++attempts < 120) window.setTimeout(waitForHero, 250);
            };
            if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', waitForHero, {once:true});
            else waitForHero();
            if (desktop.addEventListener) desktop.addEventListener('change', apply);
            else desktop.addListener(apply);
          })();
          </script>
          """
              if not re.search(r"</body\s*>", s, re.I):
                  raise SystemExit("STOP: closing body tag not found; no change made.")
              s = re.sub(r"</body\s*>", lambda m: script + "\n" + m.group(0), s, count=1, flags=re.I)
              p.write_text(s, encoding="utf-8")
          PY
      - name: Commit desktop hero integration
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Use uploaded hero image on desktop only"
          git push origin main
