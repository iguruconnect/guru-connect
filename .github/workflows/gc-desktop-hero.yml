name: Set desktop-only GURU CONNECT hero image
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/gc-desktop-hero.yml"
permissions:
  contents: write
jobs:
  desktop-hero:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply desktop-only hero image
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path("index.html")
          s = p.read_text(encoding="utf-8")
          marker = "GC_DESKTOP_HERO_IMAGE_ONLY_20261111"
          if marker not in s:
              script = """
          <script id="gc-desktop-hero-only-20261111">
          /* GC_DESKTOP_HERO_IMAGE_ONLY_20261111: preserve the mobile hero */
          (() => {
            const desktop = window.matchMedia('(min-width: 641px)');
            const imageUrl = '/assets/gc-desktop-hero.png';
            const apply = () => {
              const img = document.querySelector('#publicWebsiteContent > section.gc-approved-hero#home > img.gc-approved-hero-image');
              if (!img) return;
              if (desktop.matches) {
                if (img.dataset.gcDesktopHeroOriginal === undefined) img.dataset.gcDesktopHeroOriginal = img.getAttribute('src') || '';
                img.src = imageUrl;
              } else if (img.dataset.gcDesktopHeroOriginal !== undefined) {
                img.src = img.dataset.gcDesktopHeroOriginal;
              }
            };
            if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', apply, {once:true});
            else apply();
            if (desktop.addEventListener) desktop.addEventListener('change', apply);
            else desktop.addListener(apply);
          })();
          </script>
          """
              if not re.search(r"</body\s*>", s, re.I):
                  raise SystemExit("STOP: closing body tag not found; no change made.")
              s = re.sub(r"</body\\s*>", script + "\\n</body>", s, count=1, flags=re.I)
              p.write_text(s, encoding="utf-8")
          PY
      - name: Commit desktop hero integration
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Use uploaded hero image on desktop only"
          git push origin main
