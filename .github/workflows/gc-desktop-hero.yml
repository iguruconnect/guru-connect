name: Set desktop-only GURU CONNECT hero image
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/gc-desktop-hero.yml"
permissions:
  contents: write
jobs:
  desktop-hero:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Consolidate desktop-only hero integration
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path("index.html")
          s = p.read_text(encoding="utf-8")
          marker = "GC_DESKTOP_HERO_IMAGE_ONLY_V5_20261111"
          # Remove the two previous competing desktop hero scripts; retain all other homepage code.
          for script_id in ("gc-desktop-hero-only-v3-20261111", "gc-desktop-hero-only-v4-20261111"):
              pattern = r'<script[^>]*id="' + re.escape(script_id) + r'".*?</script>'
              s = re.sub(pattern, '', s, count=1, flags=re.I | re.S)
          if marker not in s:
              script = """
          <script id="gc-desktop-hero-only-v5-20261111">
          /* GC_DESKTOP_HERO_IMAGE_ONLY_V5_20261111: one desktop-only image switch; mobile stays untouched */
          (() => {
            const desktop = window.matchMedia('(min-width: 641px)');
            const imageUrl = '/assets/gc-desktop-hero.png?rev=20261111b';
            const selector = '#publicWebsiteContent > section.gc-approved-hero#home > img.gc-approved-hero-image';
            const apply = () => {
              const img = document.querySelector(selector);
              if (!img) return;
              if (img.dataset.gcDesktopHeroOriginal === undefined) {
                img.dataset.gcDesktopHeroOriginal = img.getAttribute('src') || '';
              }
              const next = desktop.matches ? imageUrl : img.dataset.gcDesktopHeroOriginal;
              if (next && img.getAttribute('src') !== next) img.setAttribute('src', next);
            };
            apply();
            if (document.readyState === 'loading') {
              document.addEventListener('DOMContentLoaded', apply, {once:true});
            }
            if (desktop.addEventListener) desktop.addEventListener('change', apply);
            else desktop.addListener(apply);
            window.addEventListener('resize', apply, {passive:true});
          })();
          </script>
          """
              if "</body>" not in s:
                  raise SystemExit("STOP: closing body tag not found; no change made.")
              s = s.replace("</body>", script + "</body>", 1)
          s = s.replace("\\n</body>", "</body>", 1)
          p.write_text(s, encoding="utf-8")
          PY
      - name: Commit consolidated hero integration
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Consolidate desktop hero image switch"
          git pull --rebase origin main
          git push origin main
