name: Simplify homepage header to brand and Buy Now
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/gc-simplify-header.yml"
permissions:
  contents: write
jobs:
  simplify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Keep only brand and Buy Now in the website header
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("index.html")
          s = p.read_text(encoding="utf-8")
          marker = "gc-header-brand-buy-now-only-2026"
          if marker not in s:
              css = """
          <style id="gc-header-brand-buy-now-only-2026">
          /* Keep the homepage header clear: GURU CONNECT branding + Buy Now only. */
          header.gc-beautiful-header .gc-header-inner{
            display:flex!important;align-items:center!important;
            justify-content:space-between!important;gap:12px!important;
          }
          header.gc-beautiful-header .gc-beautiful-lockup{
            display:flex!important;flex:1 1 auto!important;min-width:0!important;
          }
          header.gc-beautiful-header .gc-beautiful-nav{
            display:flex!important;flex:0 0 auto!important;
            align-items:center!important;justify-content:flex-end!important;
            gap:0!important;min-width:0!important;
          }
          header.gc-beautiful-header .gc-beautiful-nav a{
            display:none!important;
          }
          header.gc-beautiful-header .gc-beautiful-nav a[href*="buy-now"]{
            display:inline-flex!important;align-items:center!important;
            justify-content:center!important;white-space:nowrap!important;
            background:#ff8500!important;color:#fff!important;
            padding:11px 18px!important;border:0!important;
            border-radius:999px!important;font-weight:900!important;
            text-decoration:none!important;box-shadow:0 5px 14px #ff850044!important;
          }
          header.gc-beautiful-header #navLoginBtn,
          header.gc-beautiful-header #navStaffBtn,
          header.gc-beautiful-header #currentUserBadge,
          header.gc-beautiful-header #publicMenuWrapper,
          header.gc-beautiful-header .gc-menu-button,
          header.gc-beautiful-header .gc-account-dashboard,
          header.gc-beautiful-header .gc-account-logout{
            display:none!important;
          }
          @media(max-width:760px){
            header.gc-beautiful-header .gc-header-inner{
              flex-wrap:nowrap!important;padding-left:12px!important;padding-right:12px!important;
            }
            header.gc-beautiful-header .gc-beautiful-nav{
              display:flex!important;visibility:visible!important;
            }
            header.gc-beautiful-header .gc-beautiful-nav a[href*="buy-now"]{
              padding:9px 13px!important;font-size:12px!important;
            }
          }
          </style>
          """
              head_end = s.lower().find("</head>")
              if head_end < 0:
                  raise SystemExit("Cannot find </head>; no changes made.")
              s = s[:head_end] + css + "\\n" + s[head_end:]
          p.write_text(s, encoding="utf-8")
          print("Updated index.html: header shows only brand and Buy Now; page links and auth features remain intact.")
          PY
      - name: Commit header-only change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes needed."
          else
            git commit -m "Simplify homepage header to brand and Buy Now only"
            git push
          fi
