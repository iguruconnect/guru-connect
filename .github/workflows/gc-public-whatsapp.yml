name: Install GURU CONNECT public WhatsApp button

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/gc-public-whatsapp.yml"

permissions:
  contents: write

jobs:
  install-public-whatsapp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Safely add the public WhatsApp button to the homepage
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, sys

          p = Path("index.html")
          s = p.read_text(encoding="utf-8")
          marker = "GC_PUBLIC_WHATSAPP_BUTTON_17112312470"
          if marker in s:
              print("Public WhatsApp button is already installed; no change needed.")
              sys.exit(0)
          if not re.search(r"</body\\s*>", s, re.I):
              raise SystemExit("STOP: index.html has no closing body tag; refusing to modify it.")
          script = r"""
          <!-- GC_PUBLIC_WHATSAPP_BUTTON_17112312470 -->
          <style id="gc-public-whatsapp-style">
          #gc-public-whatsapp-btn{position:fixed!important;right:20px!important;bottom:20px!important;z-index:2147483000!important;width:60px!important;height:60px!important;border-radius:50%!important;background:#25D366!important;color:#fff!important;display:flex!important;align-items:center!important;justify-content:center!important;box-shadow:0 5px 18px #0004!important;text-decoration:none!important;border:3px solid #fff!important}
          #gc-public-whatsapp-btn svg{width:34px;height:34px;display:block}
          @media(max-width:600px){#gc-public-whatsapp-btn{right:14px!important;bottom:14px!important;width:56px!important;height:56px!important}}
          </style>
          <a id="gc-public-whatsapp-btn" href="https://wa.me/17112312470" target="_blank" rel="noopener noreferrer" aria-label="Chat with GURU CONNECT on WhatsApp" title="Chat with GURU CONNECT on WhatsApp">
            <svg viewBox="0 0 32 32" aria-hidden="true"><path fill="currentColor" d="M16.02 3C8.86 3 3.04 8.78 3.04 15.9c0 2.27.6 4.49 1.75 6.45L3 29l6.85-1.79a13.1 13.1 0 0 0 6.16 1.53h.01c7.16 0 12.98-5.78 12.98-12.9 0-3.45-1.35-6.69-3.8-9.12A12.9 12.9 0 0 0 16.02 3zm0 23.54h-.01c-1.91 0-3.79-.51-5.42-1.47l-.39-.23-4.06 1.06 1.08-3.94-.25-.4a10.7 10.7 0 0 1-1.65-5.66c0-5.91 4.83-10.72 10.71-10.72 2.85 0 5.53 1.11 7.55 3.13a10.62 10.62 0 0 1 3.13 7.58c0 5.91-4.82 10.65-10.69 10.65zm5.88-8.02c-.32-.16-1.9-.94-2.2-1.05-.3-.11-.51-.16-.73.16-.22.32-.84 1.05-1.03 1.27-.19.22-.38.24-.7.08-.32-.16-1.36-.5-2.59-1.59-.96-.85-1.6-1.9-1.79-2.22-.19-.32-.02-.49.14-.65.14-.14.32-.38.48-.57.16-.19.21-.32.32-.54.11-.22.05-.41-.03-.57-.08-.16-.73-1.75-1-2.4-.26-.63-.53-.55-.73-.56h-.62c-.22 0-.57.08-.87.41-.3.32-1.14 1.11-1.14 2.7s1.17 3.13 1.33 3.35c.16.22 2.3 3.51 5.58 4.92.78.34 1.39.54 1.87.69.79.25 1.51.21 2.08.13.63-.09 1.9-.78 2.17-1.54.27-.76.27-1.41.19-1.54-.08-.13-.29-.21-.62-.38z"/></svg>
          </a>
          <script id="gc-public-whatsapp-cleanup">
          (function(){
            if(window.__gcPublicWhatsAppInstalled)return;
            window.__gcPublicWhatsAppInstalled=true;
            function cleanOld(){
              document.querySelectorAll('a[href*="wa.me"],a[href*="api.whatsapp.com"],a[href*="whatsapp.com"]').forEach(function(a){
                if(a.id==="gc-public-whatsapp-btn")return;
                var n=a, fixed=null;
                for(var i=0;n&&i<5;i++,n=n.parentElement){
                  if(n.id==="gc-public-whatsapp-btn")return;
                  var cs=window.getComputedStyle(n);
                  if(cs.position==="fixed"){fixed=n;break;}
                }
                if(!fixed)return;
                var r=fixed.getBoundingClientRect();
                if(r.right>window.innerWidth-180 && r.bottom>window.innerHeight-180){
                  fixed.remove();
                }
              });
            }
            cleanOld();
            var observer=new MutationObserver(function(){cleanOld()});
            observer.observe(document.documentElement,{childList:true,subtree:true});
            setTimeout(cleanOld,500);setTimeout(cleanOld,1500);setTimeout(cleanOld,3500);
          })();
          </script>
          """
          s = re.sub(r"</body\\s*>", script + "\\n</body>", s, count=1, flags=re.I)
          p.write_text(s, encoding="utf-8")
          print("Inserted public WhatsApp button and old bottom-right WhatsApp cleanup.")
          PY
      - name: Commit homepage update
        run: |
          if git diff --quiet -- index.html; then
            echo "No homepage change required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix public floating WhatsApp button"
          git push origin main
