name: Replace public WhatsApp button with GURU CONNECT chatbot

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/gc-public-whatsapp.yml"

permissions:
  contents: write

jobs:
  install-guru-connect-chatbot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Remove public WhatsApp button and install GURU CONNECT chatbot
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path("index.html")
          s = p.read_text(encoding="utf-8")
          marker = "<!-- GC_PUBLIC_WHATSAPP_BUTTON_17112312470 -->"
          if marker in s:
              a = s.index(marker)
              b = re.search(r"</script>\s*</body\s*>", s[a:], re.I)
              if b:
                  s = s[:a] + s[a + b.start() + len("</script>"):]
          s = re.sub(r'<style id="gc-public-whatsapp-style">[\s\S]*?</style>\s*<a id="gc-public-whatsapp-btn"[\s\S]*?</a>', "", s, flags=re.I)
          embed = "<script src='https://cdn.jotfor.ms/agent/embedjs/01a1a716b670700081f380b07d03cd740514/embed.js'></script>"
          s = re.sub(r"\s*<script src=['\"]https://cdn\.jotfor\.ms/agent/embedjs/01a1a716b670700081f380b07d03cd740514/embed\.js['\"]>\s*</script>", "", s, flags=re.I)
          if not re.search(r"</body\s*>", s, re.I):
              raise SystemExit("STOP: index.html has no closing body tag; refusing to modify it.")
          s = re.sub(r"</body\s*>", embed + "\n</body>", s, count=1, flags=re.I)
          p.write_text(s, encoding="utf-8")
          print("Homepage WhatsApp floating button removed; Jotform chatbot installed.")
          PY
      - name: Commit homepage update
        run: |
          if git diff --quiet -- index.html; then
            echo "No homepage change required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Replace floating WhatsApp with Jotform chatbot"
          git push origin main
