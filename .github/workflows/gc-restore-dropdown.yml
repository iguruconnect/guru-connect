name: Restore homepage dropdown menu
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/gc-restore-dropdown.yml"
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore dropdown control and menu
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("index.html")
          s = p.read_text(encoding="utf-8")
          marker = "gc-restore-dropdown-menu-2026"
          if marker not in s:
              css = """
          <style id="gc-restore-dropdown-menu-2026">
          /* Restore the homepage dropdown without bringing back the full header navigation. */
          header.gc-beautiful-header #publicMenuWrapper{
            display:flex!important;visibility:visible!important;opacity:1!important;
            align-items:center!important;position:relative!important;
          }
          header.gc-beautiful-header .gc-menu-button{
            display:inline-flex!important;visibility:visible!important;opacity:1!important;
            align-items:center!important;justify-content:center!important;
          }
          header.gc-beautiful-header #publicMenuWrapper .gc-public-menu,
          header.gc-beautiful-header #publicMenuWrapper .gc-dropdown,
          header.gc-beautiful-header #publicMenuWrapper [role="menu"]{
            z-index:99999!important;
          }
          </style>
          """
              i = s.lower().find("</head>")
              if i < 0:
                  raise SystemExit("Cannot find </head>; no changes made.")
              s = s[:i] + css + "\\n" + s[i:]
          p.write_text(s, encoding="utf-8")
          print("Restored dropdown menu control; other header navigation remains hidden.")
          PY
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes needed."
          else
            git commit -m "Restore homepage dropdown menu"
            git push
          fi
