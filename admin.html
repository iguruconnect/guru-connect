<div class="panel"><h2 style="margin-top:0">Create User</h2><div class="grid"><div class="field"><label>Role</label><select id="newRole"><option value="student">Student</option><option value="tutor">Tutor</option></select></div><div class="field"><label>Name</label><input id="newName"></div><div class="field"><label>Email</label><input id="newEmail" type="email"></div><div class="field"><label>Phone</label><input id="newPhone"></div><div class="field"><label>Password</label><input id="newPass" type="password" minlength="8"></div></div><div class="actions"><button id="create" class="btn green">CREATE ACCOUNT</button></div><div id="createStatus" class="status"></div></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const U='https://hzqqswrnawrfgufbxgay.supabase.co',K='sb_publishable_Oc5HvqDpisv76XrdsyFhiw_IpostIDu',FN=U+'/functions/v1/admin-user-actions',sb=supabase.createClient(U,K,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}}),$=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(action,payload={}){const s=await sb.auth.getSession(),t=s.data?.session?.access_token;if(!t)throw new Error('Admin session missing. Please login again.');const r=await fetch(FN,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+t},body:JSON.stringify({action,...payload})});const d=await r.json();if(!r.ok)throw new Error(d.error||'Server error');return d}
async function boot(){const s=await sb.auth.getSession(),u=s.data?.session?.user;if(!u||String(u.email||'').toLowerCase()!=='guruconnect.in@gmail.com'){location.href='login.html?role=staff';return}$('gate').style.display='none';$('app').style.display='block'}boot();$('logout').onclick=async()=>{await sb.auth.signOut({scope:'local'});location.href='login.html?role=staff'};

$('search').onclick=async()=>{const b=$('search');b.disabled=true;b.textContent='SEARCHING…';$('searchStatus').textContent='';$('results').innerHTML='';try{const d=await api('find_users',{term:$('term').value});let users=d.users||[];const rf=$('roleFilter').value;if(rf)users=users.filter(u=>u.role===rf);$('searchStatus').textContent=users.length?users.length+' account(s) found.':'No Student/Tutor account found.';window.users=users;$('results').innerHTML=users.map((u,i)=>`<div class="user"><div class="userhead"><div><b>${esc(u.name||'User')}</b><span class="badge">${esc((u.role||'').toUpperCase())}</span><div class="muted">Email: ${esc(u.email||'—')}<br>Phone: ${esc(u.phone||'—')}<br>Email verified: ${u.email_confirmed?'YES':'NO'}<br>Status: ${esc(u.registration_status||'—')}<br>User ID: ${esc(u.user_id)}</div></div><div class="actions"><button class="btn primary" onclick="toggleEdit(${i})">EDIT</button><button class="btn gc-receipt-btn" onclick="generateAdminReceipt(${i})">🧾 GENERATE RECEIPT</button><button class="btn light" onclick="resetUser(${i})">RESET PASSWORD</button><button class="btn red" onclick="deleteUser(${i})">DELETE</button></div></div><div class="edit" id="edit${i}"><div class="grid"><div class="field"><label>Name</label><input id="n${i}" value="${esc(u.name||'')}"></div><div class="field"><label>Email</label><input id="e${i}" value="${esc(u.email||'')}"></div><div class="field"><label>Phone</label><input id="p${i}" value="${esc(u.phone||'')}"></div><div class="field"><label>Stream</label><input id="s${i}" value="${esc(u.profile?.stream||'')}"></div><div class="field"><label>Subject</label><input id="sub${i}" value="${esc(u.profile?.subject||'')}"></div><div class="field"><label>Course / Qualification</label><input id="c${i}" value="${esc(u.role==='student'?(u.profile?.course||''):(u.profile?.qualification||''))}"></div><div class="field"><label>Location</label><input id="l${i}" value="${esc(u.profile?.location||'')}"></div><div class="field"><label>Status</label><select id="st${i}"><option ${u.registration_status==='registered'?'selected':''}>registered</option><option ${u.registration_status==='pending_email'?'selected':''}>pending_email</option><option ${u.registration_status==='suspended'?'selected':''}>suspended</option></select></div></div><div class="actions"><button class="btn green" onclick="saveEdit(${i})">SAVE PROFILE</button></div><div id="es${i}" class="status"></div></div></div>`).join('')}catch(e){$('searchStatus').textContent='Search failed: '+e.message}finally{b.disabled=false;b.textContent='SEARCH USERS'}};
function adminReceiptValue(u){
  const p=u&&u.profile||{};
  const pay=u&&u.payment||p.payment||{};
  return {
    name:u?.name||p.name||p.full_name||'Member',
    email:u?.email||p.email||'—',
    phone:u?.phone||p.phone||'—',
    role:String(u?.role||p.role||'member').toLowerCase(),
    status:u?.registration_status||p.registration_status||'registered',
    paidStatus:u?.paid_status||p.paid_status||pay.status||pay.paid_status||'PENDING',
    utr:u?.utr||u?.transaction_id||u?.transaction_ref||p.utr||p.transaction_id||p.transaction_ref||pay.utr||pay.transaction_id||pay.transaction_ref||'—',
    amount:u?.amount??u?.payment_amount??p.amount??p.payment_amount??pay.amount??pay.payment_amount??'',
    plan:u?.plan||u?.payment_plan||p.plan||p.payment_plan||pay.plan||pay.payment_plan||'',
    date:u?.created_at||p.created_at||pay.created_at||new Date().toISOString(),
    userId:u?.user_id||p.user_id||p.id||'—'
  };
}
function adminReceiptPlan(r){
  if(r.plan) return r.plan;
  if(r.role==='tutor') return 'Tutor Registration — 1 Month';
  if(r.role==='student') return 'Student Registration';
  return 'GURU CONNECT Registration';
}
function adminReceiptAmount(r){
  const n=Number(r.amount);
  if(Number.isFinite(n)&&n>0) return '₹'+n.toLocaleString('en-IN');
  if(r.role==='tutor') return '₹200';
  return 'As recorded';
}
function adminReceiptWindowHtml(r,receiptNo){
  const safe=v=>esc(v);
  const logoUrl=new URL('guru-connect-registration-receipt-logo.png',location.href).href;
  const date=new Date(r.date); const dateText=isNaN(date.getTime())?safe(r.date):date.toLocaleString('en-IN',{dateStyle:'medium',timeStyle:'short'});

  return `<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${safe(receiptNo)} — GURU CONNECT</title><style>*{box-sizing:border-box}body{margin:0;background:#f1f5f9;color:#0f172a;font-family:Inter,Arial,sans-serif}.sheet{width:min(820px,94vw);margin:30px auto;background:#fff;border:1px solid #dbe3ef;border-radius:22px;padding:34px;box-shadow:0 18px 55px rgba(15,23,42,.12)}.head{display:flex;align-items:center;gap:18px;border-bottom:3px solid #123b8f;padding-bottom:18px}.head img{width:105px;height:105px;object-fit:contain}.brand{font-size:30px;font-weight:950;color:#123b8f}.slogan{margin-top:5px;color:#475569;font-size:13px;font-weight:700}.title{text-align:center;margin:25px 0 18px;font-size:24px;font-weight:950;color:#0f5132}.role{display:inline-block;padding:5px 10px;border-radius:999px;background:#eff6ff;color:#155eef;font-size:11px;font-weight:950}.table{width:100%;border-collapse:collapse}.table td{padding:13px 12px;border-bottom:1px solid #e5e7eb;vertical-align:top}.table td:first-child{width:36%;font-weight:850;color:#475569}.note{margin-top:20px;padding:13px 15px;background:#f8fafc;border:1px solid #e2e8f0;border-radius:12px;font-size:12px;line-height:1.55;color:#475569}.actions{display:flex;justify-content:center;gap:10px;margin-top:24px;flex-wrap:wrap}.actions button{border:0;border-radius:10px;padding:12px 18px;font-weight:900;cursor:pointer}.print{background:#155eef;color:#fff}.close{background:#e5e7eb;color:#111827}@media print{body{background:#fff}.sheet{width:100%;margin:0;padding:20px;border:0;box-shadow:none}.actions{display:none!important}}@media(max-width:600px){.sheet{padding:18px;margin:10px auto}.head img{width:78px;height:78px}.brand{font-size:22px}.title{font-size:19px}.table td{font-size:12px;padding:10px 7px}}</style></head><body><main class="sheet"><header class="head"><img src="${logoUrl}" alt="GURU CONNECT"><div><div class="brand">GURU CONNECT</div><div class="slogan">Connecting Mind - Creating Future...</div><div style="margin-top:10px"><span class="role">${safe(role)} MEMBER</span></div></div></header><div class="title">MEMBER REGISTRATION RECEIPT</div><table class="table"><tr><td>Receipt Number</td><td>${safe(receiptNo)}</td></tr><tr><td>Member Name</td><td>${safe(r.name)}</td></tr><tr><td>Member Type</td><td>${safe(role)}</td></tr><tr><td>Email</td><td>${safe(r.email)}</td></tr><tr><td>Phone</td><td>${safe(r.phone)}</td></tr><tr><td>Registration Plan</td><td>${safe(adminReceiptPlan(r))}</td></tr><tr><td>Registration Amount</td><td><strong>${safe(adminReceiptAmount(r))}</strong></td></tr><tr><td>UTR / Transaction Reference</td><td>${safe(r.utr)}</td></tr><tr><td>Payment Status</td><td><strong>${safe(r.paidStatus)}</strong></td></tr><tr><td>Registration Status</td><td>${safe(r.status)}</td></tr><tr><td>Registration Date</td><td>${safe(dateText)}</td></tr><tr><td>Member / User ID</td><td style="word-break:break-all">${safe(r.userId)}</td></tr></table><div class="note"><strong>Important:</strong> This receipt records the registration/payment information available in the GURU CONNECT admin system. It does not by itself confirm approval, verification, or activation unless the payment/registration status shown above states otherwise.</div><div class="actions"><button class="print" onclick="window.print()">🖨️ PRINT / SAVE AS PDF</button><button class="close" onclick="window.close()">✕ CLOSE</button></div></main></body></html>`;
}
window.generateAdminReceipt=function(i){
  const u=window.users?.[i]; if(!u) return alert('Member record not found. Please search again.');
  const r=adminReceiptValue(u);
  const receiptNo='GC-'+String(Date.now()).slice(-10)+'-'+(r.role==='tutor'?'TU':r.role==='student'?'ST':'MB');
  const w=window.open('','_blank','width=900,height=850,noopener,noreferrer');
  if(!w){alert('Receipt window was blocked by the browser. Please allow pop-ups for GURU CONNECT Admin.');return;}
  w.document.open();w.document.write(adminReceiptWindowHtml(r,receiptNo));w.document.close();
};
window.toggleEdit=i=>document.getElementById('edit'+i).classList.toggle('open');window.saveEdit=async i=>{const u=window.users[i],s=$('es'+i);s.textContent='Saving…';try{await api('edit_user',{user_id:u.user_id,role:u.role,name:$('n'+i).value,email:$('e'+i).value,phone:$('p'+i).value,stream:$('s'+i).value,subject:$('sub'+i).value,[u.role==='student'?'course':'qualification']:$('c'+i).value,location:$('l'+i).value});await api('set_status',{user_id:u.user_id,status:$('st'+i).value});s.textContent='✓ Profile and status updated.'}catch(e){s.textContent='Save failed: '+e.message}};window.resetUser=async i=>{const u=window.users[i],p=prompt('Enter a new password (minimum 8 characters):');if(p===null)return;if(p.length<8)return alert('Password must be at least 8 characters.');try{await api('reset_password',{user_id:u.user_id,password:p});alert('✓ Password updated.')}catch(e){alert('Reset failed: '+e.message)}};window.deleteUser=async i=>{const u=window.users[i];if(!confirm('Delete this Auth account? This may cascade/delete linked data depending on your database constraints. Continue?'))return;try{await api('delete_user',{user_id:u.user_id});alert('Account deleted.');$('search').click()}catch(e){alert('Delete failed: '+e.message)}};
