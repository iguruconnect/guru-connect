<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GURU CONNECT — Staff Admin</title><style>*{box-sizing:border-box}body{margin:0;background:#f8fbff;font-family:Inter,Arial;color:#0f172a}.head{background:linear-gradient(135deg,#0b2b66,#155eef 60%,#0891b2);color:#fff;padding:22px}.headin{width:min(1200px,94vw);margin:auto;display:flex;justify-content:space-between;align-items:center;gap:15px}.head h1{margin:0;font-size:clamp(22px,3vw,34px)}.head p{margin:5px 0 0;color:#dbeafe;font-size:12px}.wrap{width:min(1200px,94vw);margin:22px auto 60px}.panel{background:#fff;border:1px solid #dbe3ef;border-radius:22px;padding:20px;box-shadow:0 15px 45px #0f172a10;margin-bottom:18px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field label{display:block;font-size:10px;font-weight:950;color:#475569;text-transform:uppercase;margin:0 0 6px}.field input,.field select,.field textarea{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:11px;font:700 13px Inter;outline:0}.btn{border:0;border-radius:11px;padding:12px 15px;font-weight:950;cursor:pointer}.primary{background:#155eef;color:#fff}.green{background:#059669;color:#fff}.red{background:#dc2626;color:#fff}.light{background:#f1f5f9;color:#334155}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}.status{margin-top:10px;font-size:12px;font-weight:800;color:#64748b;white-space:pre-wrap}.user{border:1px solid #e2e8f0;border-radius:16px;padding:14px;margin-top:10px;background:#fbfdff}.userhead{display:flex;justify-content:space-between;gap:12px}.badge{display:inline-block;padding:4px 7px;border-radius:8px;background:#eff6ff;color:#155eef;font-size:9px;font-weight:950;margin-left:6px}.muted{color:#64748b;font-size:11px;line-height:1.6}.edit{display:none;margin-top:12px;padding-top:12px;border-top:1px solid #e2e8f0}.edit.open{display:block}.logout{background:#fff;color:#0f172a;border:1px solid #dbe3ef}.danger{color:#991b1b}.notice{padding:12px 14px;border-radius:12px;background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;font-size:12px;font-weight:800;margin-bottom:16px}@media(max-width:700px){.grid{grid-template-columns:1fr}.userhead{flex-direction:column}.actions .btn{width:100%}}
</style></head><body><header class="head"><div class="headin"><div><h1>GURU CONNECT • ADMIN CONTROL CENTER</h1><p>Secure Staff/Admin workspace for Student & Tutor account management.</p></div><button id="logout" class="btn logout">LOG OUT</button></div></header><main class="wrap"><div id="gate" class="panel">Checking Staff/Admin session…</div><section id="app" style="display:none"><div class="notice">Admin actions below use a secure Supabase Edge Function. Do not put the Supabase service-role key into this HTML.</div><div class="panel"><h2 style="margin-top:0">Find Student / Tutor</h2><div class="grid"><div class="field"><label>Search name, email or phone</label><input id="term" placeholder="e.g. student@email.com"></div><div class="field"><label>Role filter</label><select id="roleFilter"><option value="">All Students & Tutors</option><option value="student">Student</option><option value="tutor">Tutor</option></select></div></div><div class="actions"><button id="search" class="btn primary">SEARCH USERS</button></div><div id="searchStatus" class="status"></div><div id="results"></div></div>
<div class="panel"><h2 style="margin-top:0">Create User</h2><div class="grid"><div class="field"><label>Role</label><select id="newRole"><option value="student">Student</option><option value="tutor">Tutor</option></select></div><div class="field"><label>Name</label><input id="newName"></div><div class="field"><label>Email</label><input id="newEmail" type="email"></div><div class="field"><label>Phone</label><input id="newPhone"></div><div class="field"><label>Password</label><input id="newPass" type="password" minlength="8"></div></div><div class="actions"><button id="create" class="btn green">CREATE ACCOUNT</button></div><div id="createStatus" class="status"></div></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const U='https://hzqqswrnawrfgufbxgay.supabase.co',K='sb_publishable_Oc5HvqDpisv76XrdsyFhiw_IpostIDu',FN=U+'/functions/v1/admin-user-actions',sb=supabase.createClient(U,K,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}}),$=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function rpc(name,args={}){const r=await sb.rpc(name,args);if(r.error)throw r.error;return r.data}
async function boot(){const s=await sb.auth.getSession(),u=s.data?.session?.user;if(!u||String(u.email||'').toLowerCase()!=='guruconnect.in@gmail.com'){location.href='login.html?role=staff';return}$('gate').style.display='none';$('app').style.display='block'}boot();
$('logout').onclick=async()=>{await sb.auth.signOut({scope:'local'});location.href='login.html?role=staff'};

async function edgeCreate(payload){const s=await sb.auth.getSession(),t=s.data?.session?.access_token;if(!t)throw new Error('Admin session missing. Please login again.');const r=await fetch(FN,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+t},body:JSON.stringify({action:'create_user',...payload})});const d=await r.json();if(!r.ok)throw new Error(d.error||'Server error');return d}
$('create').onclick=async()=>{const b=$('create');b.disabled=true;b.textContent='CREATING…';try{
  const email=$('newEmail').value.trim().toLowerCase(),pass=$('newPass').value;
  if(!email||pass.length<8)throw new Error('Enter a valid email and a password of at least 8 characters.');
  await edgeCreate({role:$('newRole').value,name:$('newName').value,email,phone:$('newPhone').value,password:pass});
  $('createStatus').textContent='✓ Account created successfully.';
  ['newName','newEmail','newPhone','newPass'].forEach(id=>$(id).value='')
}catch(e){$('createStatus').textContent='Creation failed: '+e.message}finally{b.disabled=false;b.textContent='CREATE ACCOUNT'}};

function renderUsers(users){
 $('results').innerHTML=users.map((u,i)=>{const p=u.profile||{}, tutor=u.role==='tutor';
 const verified=tutor&&p.verified===true, paid=tutor&&String(p.paid_status||'').toUpperCase()==='PAID';
 return `<div class="user"><div class="userhead"><div><b>${esc(u.name||'User')}</b><span class="badge">${esc((u.role||'').toUpperCase())}</span>
 ${tutor&&verified?'<span class="badge" style="background:#dcfce7;color:#166534">✓ VERIFIED</span>':''}${tutor&&paid?'<span class="badge" style="background:#dcfce7;color:#166534">✓ PAID</span>':''}
 <div class="muted">Email: ${esc(u.email||'—')}<br>Phone: ${esc(u.phone||'—')}<br>Email verified: ${u.email_confirmed?'YES':'NO'}<br>Status: ${esc(u.registration_status||'—')}<br>User ID: ${esc(u.user_id)}${tutor?'<br>Tutor verified: '+(verified?'YES':'NO')+'<br>Payment: '+esc(p.paid_status||'PENDING'):''}</div></div>
 <div class="actions"><button class="btn primary" onclick="toggleEdit(${i})">EDIT</button><button class="btn light" onclick="resetUser(${i})">RESET PASSWORD</button>
 ${tutor?`<button class="btn ${verified?'light':'green'}" onclick="setVerified(${i},${!verified})">${verified?'REMOVE VERIFIED TICK':'GRANT VERIFIED TICK'}</button><button class="btn ${paid?'light':'green'}" onclick="setPaid(${i},${!paid})">${paid?'MARK PAYMENT UNPAID':'MARK PAYMENT PAID'}</button>`:''}
 <button class="btn red" onclick="deleteUser(${i})">DELETE</button></div></div>
 <div class="edit" id="edit${i}"><div class="grid">
 <div class="field"><label>Name</label><input id="n${i}" value="${esc(u.name||'')}"></div>
 <div class="field"><label>Email</label><input id="e${i}" type="email" value="${esc(u.email||'')}"></div>
 <div class="field"><label>Phone</label><input id="p${i}" value="${esc(u.phone||'')}"></div>
 <div class="field"><label>Stream</label><input id="s${i}" value="${esc(p.stream||'')}"></div>
 <div class="field"><label>Subject</label><input id="sub${i}" value="${esc(p.subject||'')}"></div>
 <div class="field"><label>Course / Qualification</label><input id="c${i}" value="${esc(tutor?(p.qualification||''):(p.course||''))}"></div>
 <div class="field"><label>Location</label><input id="l${i}" value="${esc(p.location||'')}"></div>
 <div class="field"><label>Status</label><select id="st${i}"><option value="registered" ${u.registration_status==='registered'?'selected':''}>registered</option><option value="pending_email" ${u.registration_status==='pending_email'?'selected':''}>pending_email</option><option value="suspended" ${u.registration_status==='suspended'?'selected':''}>suspended</option></select></div>
 </div><div class="actions"><button class="btn green" onclick="saveEdit(${i})">SAVE PROFILE</button></div><div id="es${i}" class="status"></div></div></div>`}).join('')
}
$('search').onclick=async()=>{const b=$('search');b.disabled=true;b.textContent='SEARCHING…';$('searchStatus').textContent='';$('results').innerHTML='';try{
 let users=await rpc('gc_admin_find_users',{p_term:$('term').value});users=Array.isArray(users)?users:[];const rf=$('roleFilter').value;if(rf)users=users.filter(u=>u.role===rf);
 $('searchStatus').textContent=users.length?users.length+' account(s) found.':'No Student/Tutor account found.';window.users=users;renderUsers(users)
}catch(e){$('searchStatus').textContent='Search failed: '+e.message}finally{b.disabled=false;b.textContent='SEARCH USERS'}};

window.toggleEdit=i=>document.getElementById('edit'+i).classList.toggle('open');
window.saveEdit=async i=>{const u=window.users[i],s=$('es'+i);s.textContent='Saving…';try{
 await rpc('gc_admin_edit_user',{p_user_id:u.user_id,p_data:{name:$('n'+i).value,email:$('e'+i).value,phone:$('p'+i).value,stream:$('s'+i).value,subject:$('sub'+i).value,course:$('c'+i).value,qualification:$('c'+i).value,location:$('l'+i).value}});
 if(u.role==='tutor')await rpc('gc_admin_set_status',{p_user_id:u.user_id,p_status:$('st'+i).value});
 s.textContent='✓ Profile, contact details and status updated.';await $('search').click()
}catch(e){s.textContent='Save failed: '+e.message}};

window.setVerified=async(i,v)=>{const u=window.users[i];try{const p=u.profile||{};const paid=String(p.paid_status||'').toUpperCase()==='PAID';await rpc('gc_admin_set_tutor_flags',{p_user_id:u.user_id,p_verified:v,p_paid:paid});await $('search').click()}catch(e){alert('Verified tick update failed: '+e.message)}};
window.setPaid=async(i,v)=>{const u=window.users[i];try{const p=u.profile||{};const verified=p.verified===true;await rpc('gc_admin_set_tutor_flags',{p_user_id:u.user_id,p_verified:verified,p_paid:v});await $('search').click()}catch(e){alert('Payment status update failed: '+e.message)}};
window.resetUser=async i=>{const u=window.users[i],p=prompt('Enter a new password (minimum 8 characters):');if(p===null)return;if(p.length<8)return alert('Password must be at least 8 characters.');try{await rpc('gc_admin_reset_password',{p_user_id:u.user_id,p_password:p});alert('✓ Password updated.')}catch(e){alert('Reset failed: '+e.message)}};
window.deleteUser=async i=>{const u=window.users[i];if(!confirm('Delete this Student/Tutor Auth account and its linked profile? This action cannot be undone.'))return;try{await rpc('gc_admin_delete_user',{p_user_id:u.user_id});alert('Account deleted successfully.');$('search').click()}catch(e){alert('Delete failed: '+e.message)}};
</script></body></html>
