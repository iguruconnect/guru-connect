<style id="gc-admin-mobile-interaction-fix">

  /* Mobile WhatsApp buttons need a large, direct touch target. */

      min-height:44px !important;

<script id="gc-admin-mobile-interaction-fix-js">
(function(){
  'use strict';

  function isMobileDevice(){
    return window.matchMedia && window.matchMedia('(max-width: 600px)').matches;
  }

  function mobileWhatsAppUrl(phone, message){
    return 'https://wa.me/' + phone + '?text=' + encodeURIComponent(message);
  }

  function normalisePhone(value){
    let digits=String(value==null?'':value).replace(/\D/g,'');
    if(!digits) return '';
    if(digits.indexOf('00')===0) digits=digits.slice(2);
    if(digits.length===11 && digits.charAt(0)==='0') digits=digits.slice(1);
    if(digits.length===10) digits='91'+digits;
    return digits;
  }

  /*
   * Replace only the navigation interaction layer. The original switchSection()
   * remains responsible for loading LRR / Coin History data.
   */
  function installMobileTabs(){
    if(typeof window.switchSection!=='function' || window.switchSection.__gcMobileFixed) return;
    const originalSwitch=window.switchSection;

    function safeSwitch(name){
      if(!name) return;
      /* The original function returns early when the same section is already
         selected. On mobile we still force the section visible. */
      try{ originalSwitch(name); }catch(e){ console.warn('Admin tab switch:',e); }
      document.querySelectorAll('.section').forEach(function(section){
        section.classList.toggle('open', section.id === 'sec-'+name);
      });
      document.querySelectorAll('.controlbar .topbtn').forEach(function(button){
        button.classList.toggle('active', button.dataset.sec === name);
      });
      window.activeSection=name;
    }
    safeSwitch.__gcMobileFixed=true;
    window.switchSection=safeSwitch;

    const bar=document.querySelector('.controlbar');
    if(!bar || bar.__gcMobileFixed) return;
    bar.__gcMobileFixed=true;

    /* Capture the touch/pointer activation before any legacy handler can lose
       the event. preventDefault avoids a second delayed mobile click. */
    bar.addEventListener('pointerup',function(event){
      const button=event.target.closest && event.target.closest('.topbtn');
      if(!button || !bar.contains(button)) return;
      if(event.pointerType==='mouse') return;
      event.preventDefault();
      event.stopPropagation();
      safeSwitch(button.dataset.sec);
      if(isMobileDevice()){
        try{button.scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'});}catch(_){ }
      }
    },true);

    /* iOS/Safari fallback where pointer events are unavailable or inconsistent. */
    bar.addEventListener('touchend',function(event){
      const touchTarget=event.target.closest && event.target.closest('.topbtn');
      if(!touchTarget || !bar.contains(touchTarget)) return;
      event.preventDefault();
      event.stopPropagation();
      safeSwitch(touchTarget.dataset.sec);
      try{touchTarget.scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'});}catch(_){ }
    },{capture:true,passive:false});

    /* Make every tab an explicit non-submit control. */
    bar.querySelectorAll('.topbtn').forEach(function(button){
      button.setAttribute('type','button');
    });
  }

  function installWhatsApp(){
    /* User-card WhatsApp button: direct navigation on phones invokes the native
       WhatsApp app when available; desktop keeps the existing new-tab behavior. */
    window.adminWhatsAppUser=function(i){
      const list=(typeof users!=='undefined' && Array.isArray(users))?users:[];
      const u=list[i]||{};
      const phone=normalisePhone(u.phone);
      if(!phone){alert('This user has no registered phone/WhatsApp number.');return;}
      const name=String(u.name||u.full_name||u.role||'GURU CONNECT member');
      const msg='Hello '+name+', I am contacting you from GURU CONNECT Admin regarding your account.';
      const url=mobileWhatsAppUrl(phone,msg);
      if(isMobileDevice()){
        /* location.href is intentionally used on mobile: it is a user-gesture
           navigation and is much more reliable than window.open() in iOS/Android. */
        window.location.href=url;
      }else{
        const w=window.open(url,'_blank','noopener,noreferrer');
        if(!w) window.location.href=url;
      }
    };

    /* Learning Requirement Request WhatsApp buttons also run after an async
       Supabase lookup. Do not open about:blank on mobile; navigate directly
       after the contact number has been resolved. */
    if(typeof window.whatsappCaseChat==='function'){
      const originalCaseChat=window.whatsappCaseChat;
      window.whatsappCaseChat=async function(lrrId,who){
 const popup=window.open('about:blank','_blank');
 try{
  let phone='',name='';
  // The secure RPC may be present in some deployments, but older RPC versions
  // can reference columns that do not exist in gc_learning_requests_v2. Never
  // let that optional RPC failure block the WhatsApp fallback.
  try{
   const q=await sb.rpc('gc_get_whatsapp_contact',{p_request_id:String(lrrId),p_target_role:who});
   if(!q.error&&q.data){phone=normalizeWhatsAppNumber(q.data.phone);name=String(q.data.name||'');}
  }catch(_){}
  if(!phone){const fallback=await lookupAdminLrrWhatsAppContact(lrrId,who);phone=normalizeWhatsAppNumber(fallback.phone);name=name||fallback.name||'';}
  if(!phone)throw new Error('No phone number is saved in the '+who+' profile. Please update the registered mobile/WhatsApp number in the profile/admin user editor.');
  name=name||(who==='tutor'?'Tutor':'Student');
  const text=`Hello ${name}, I am contacting you from GURU CONNECT Admin regarding your Learning Requirement Request.`;
  const url='https://wa.me/'+phone+'?text='+encodeURIComponent(text);
  if(popup&&!popup.closed)popup.location.href=url;else window.location.href=url;
 }catch(e){if(popup&&!popup.closed)popup.close();alert('WhatsApp chat could not be opened: '+(e.message||e));}
};

async function loadLearning(){
  if(lrrLoading)return;lrrLoading=true;$('learningStatus').textContent=lrrLoaded?'Refreshing LRR…':'Loading LRR…';
  try{
    const q=await sb.from('gc_learning_requests_v2').select('*').order('created_at',{ascending:false}).limit(200);
    if(q.error)throw q.error;
    const rows=q.data||[];window.__adminLrrRows=rows;
    $('lrrCount').textContent=rows.length+' REQUESTS';$('learningStatus').textContent=rows.length+' Learning Requirement Request(s).';
    const h=$('learningResults');
    h.innerHTML=rows.length?rows.map(r=>{
      const id=r.id||r.request_id||r.request_code,st=r.status||'OPEN';
      const student=r.student_id||r.student_user_id||r.student_profile_id||'',tutor=r.tutor_id||r.tutor_user_id||r.tutor_profile_id||'';
      const outcome=r.student_outcome||r.outcome||'Pending';
      const tutorCompleted=['TUTOR_COMPLETED','PENDING_ADMIN_APPROVAL','PENDING_ADMIN_REVIEW','COMPLETED','APPROVED'].includes(String(st).toUpperCase());
      const studentFeedback=r.student_feedback||r.student_remark||r.student_remarks||r.feedback||r.remark||'';
      const tutorFeedback=r.tutor_feedback||r.tutor_remark||r.tutor_remarks||r.completion_note||r.tutor_completion_note||'';
      const adminNote=r.admin_decision_note||r.admin_note||'';
      const canDecide=['PENDING_ADMIN_APPROVAL','PENDING_ADMIN_REVIEW'].includes(String(st).toUpperCase());
      const contactUnlocked=!!student&&!!tutor&&['ACCEPTED','TUTOR_ACCEPTED','TUTOR_COMPLETED','PENDING_ADMIN_APPROVAL','PENDING_ADMIN_REVIEW','COMPLETED','APPROVED','COMPLETED_SATISFIED','COMPLETED_NOT_SATISFIED'].includes(String(st).toUpperCase());
      const satisfied=['SATISFIED','SATISFIED_BY_STUDENT','COMPLETED_SATISFIED'].includes(String(outcome).toUpperCase());
      return `<article class="user"><div class="userHead"><div class="identity"><b>${esc(r.request_code||id||'Learning Request')}</b><span class="badge">${esc(st)}</span><div class="muted">Created: ${esc(r.created_at||'—')}</div></div><span class="pill">LRR CASE</span></div>
      <div class="lrrMeta"><div class="metaBox"><b>Student</b>${esc(student||'Not linked')}</div><div class="metaBox"><b>Tutor</b>${esc(tutor||'Not assigned')}</div><div class="metaBox"><b>Course / Stream</b>${esc((r.course||'—')+' / '+(r.stream||'—'))}</div><div class="metaBox"><b>Subject / Topic</b>${esc((r.subject||'—')+' / '+(r.chapter||r.topic||'—'))}</div><div class="metaBox" style="grid-column:1/-1"><b>Requirement / Issue</b>${esc(r.problem||r.issue||r.learning_requirement||r.description||'—')}</div></div>
      <div class="lrrEvidence"><div class="lrrEvidenceTitle">🔎 Evidence & Service Outcome — Admin Review</div><div class="evidenceGrid">
        <div class="evidenceBox"><b>Student outcome</b><span class="${satisfied?'evidenceGood':String(outcome).toUpperCase()==='NOT_SATISFIED'?'evidenceBad':'evidenceWarn'}">${esc(outcome)}</span></div>
        <div class="evidenceBox"><b>Tutor service status</b><span class="${tutorCompleted?'evidenceGood':'evidenceWarn'}">${tutorCompleted?'✓ Tutor marked/completed the service':'Pending tutor completion'}</span></div>
        <div class="evidenceBox"><b>Student feedback / remark</b>${esc(studentFeedback||'No written student feedback recorded.')}</div>
        <div class="evidenceBox"><b>Tutor feedback / completion note</b>${esc(tutorFeedback||'No separate tutor feedback recorded. Status is used as the completion evidence.')}</div>
        <div class="evidenceBox"><b>Coins held with Admin</b><strong>🪙 ${Number(r.coins_held||0)}</strong></div>
        <div class="evidenceBox"><b>Learning deadline</b>${esc(r.learning_deadline||'Not set')}</div>
        <div class="evidenceBox" style="grid-column:1/-1"><b>Admin decision / note</b>${esc(adminNote||'No Admin decision recorded yet.')}</div>
      </div>${canDecide?`<div class="lrrDecision">${satisfied?'✅ Student has confirmed SATISFIED. This is the strongest evidence for releasing the Tutor reward.':'⚠️ Final coin decision is pending. Chat with both parties before releasing/denying if the evidence is incomplete.'}</div>`:''}</div>
      <div class="lrrActions"><button type="button" class="btn green" onclick="lrrAction('${esc(id)}','approve')">✓ APPROVE TO TUTOR</button><button type="button" class="btn red" onclick="lrrAction('${esc(id)}','reject')">✕ REJECT</button><button type="button" class="btn orange" onclick="lrrAction('${esc(id)}','return')">↩ RETURN TO STUDENT</button><button type="button" class="btn teal" onclick="lrrCoins('${esc(id)}','${esc(student)}','${esc(tutor)}','tutor')">🪙 TUTOR COINS</button><button type="button" class="btn light" onclick="lrrCoins('${esc(id)}','${esc(student)}','${esc(tutor)}','student')">🪙 STUDENT COINS</button>${contactUnlocked?`<button type="button" class="btn caseChat" onclick="whatsappCaseChat('${esc(id)}','student')">💬 WHATSAPP STUDENT</button><button type="button" class="btn caseChat" onclick="whatsappCaseChat('${esc(id)}','tutor')">💬 WHATSAPP TUTOR</button>`:''}${canDecide?`<button type="button" class="btn green decisionBtn" onclick="lrrDecision('${esc(id)}','APPROVE')">💰 RELEASE TUTOR COINS</button><button type="button" class="btn red decisionBtn" onclick="lrrDecision('${esc(id)}','DENY')">↩ DENY / RETURN COINS</button>`:''}</div></article>`
    }).join(''):'<div class="empty">No Learning Requirement Requests found.</div>';
    lrrLoaded=true
  }catch(e){lrrLoaded=false;$('learningStatus').textContent='LRR load failed: '+(e.message||e);$('learningResults').innerHTML='<div class="empty">Unable to load Learning Requirement Requests.</div>'}
  finally{lrrLoading=false}
}
$('resetFind').onclick=async()=>{
  const q=$('resetSearch').value.trim();$('resetResult').innerHTML='Searching…';
  try{
    let rows=[];
    const r=await sb.rpc('gc_admin_find_users',{p_term:q});
    if(!r.error) rows=normalizeRpcUsers(r.data);
    if(!rows.length){
      const [pr,st,tr]=await Promise.all([
        sb.from('profiles').select('*'),
        sb.from('student_profiles').select('*'),
        sb.from('tutor_profiles').select('*')
      ]);
      if(pr.error)throw pr.error;if(st.error)throw st.error;if(tr.error)throw tr.error;
      const pm=new Map((pr.data||[]).map(x=>[String(x.id),x]));
      const build=(row,role)=>{
        const pid=row.user_id||row.auth_user_id||row.profile_id||'';
        const p=pm.get(String(pid))||{};
        return Object.assign({},p,row,{user_id:String(pid||p.id||''),role,email:row.email||p.email||'',phone:row.phone||p.phone||'',name:row.name||row.full_name||p.full_name||p.name||''});
      };
      rows=[...(st.data||[]).map(x=>build(x,'student')),...(tr.data||[]).map(x=>build(x,'tutor'))]
        .filter(u=>[u.name,u.email,u.phone,u.user_id].some(v=>String(v||'').toLowerCase().includes(q.toLowerCase())));
    }
    $('resetResult').innerHTML=rows.length?rows.map((u,i)=>`<div class="user"><b>${esc(u.name||'User')}</b><span class="badge">${esc(String(u.role||'').toUpperCase())}</span><div class="muted">${esc(u.email||'—')} · ${esc(u.phone||'—')}<br>ID: ${esc(u.user_id)}</div><div class="actions"><button class="btn primary" onclick="resetByFound('${esc(u.user_id)}')">RESET PASSWORD</button><button class="btn green" onclick="editFoundUser('${esc(u.user_id)}')">✏️ EDIT USER</button><button class="btn red" onclick="deleteFoundUser('${esc(u.user_id)}','${esc(u.role||'')}')">DELETE USER</button></div></div>`).join(''):'<div class="empty">No account found.</div>';
  }catch(e){$('resetResult').innerHTML='<div class="empty">Search failed: '+esc(e.message||e)+'</div>'}
};
window.editFoundUser=async id=>{
  await loadLiveUsers();
  const idx=users.findIndex(u=>String(u.user_id)===String(id));
  if(idx<0){alert('User was found, but the complete profile record could not be loaded for editing.');return;}
  switchSection('directories');
  renderUsers();
  setTimeout(()=>{const cardIndex=filteredUsers().findIndex(u=>String(u.user_id)===String(id));if(cardIndex>=0)toggleEdit(cardIndex)},50);
};
window.deleteFoundUser=async(id,role)=>{
  if(!confirm('Permanently delete this '+String(role||'USER').toUpperCase()+' account? This cannot be undone.'))return;
  try{
    const r=await deleteUserViaAdminFunction(id,role);
    if(!r?.deleted && r?.ok!==true)throw new Error(r?.error||'Delete was not confirmed by the server.');
    alert('✓ Account deleted.');
    $('resetResult').innerHTML='';$('resetSearch').value='';await loadLiveUsers();
  }catch(e){alert('Delete failed: '+(e.message||e))}
};

window.resetByFound=async id=>{
  const p=prompt('Enter new password (minimum 8 characters):');if(p===null)return;if(p.length<8)return alert('Minimum 8 characters.');
  try{await api('reset_password',{user_id:id,password:p});alert('✓ Password updated.')}catch(e){alert('Reset failed: '+e.message)}
};

$('create').onclick=async()=>{
  const b=$('create');b.disabled=true;b.textContent='CREATING…';
  try{
    await api('create_user',{role:$('newRole').value,name:$('newName').value,email:$('newEmail').value,phone:$('newPhone').value,password:$('newPass').value});
    $('createStatus').textContent='✓ Account created successfully. Refreshing directory…';await loadLiveUsers();
  }catch(e){$('createStatus').textContent='Creation failed: '+e.message}
  finally{b.disabled=false;b.textContent='CREATE ACCOUNT'}
};

$('adSave').onclick=async()=>{
  const b=$('adSave');b.disabled=true;b.textContent='SAVING…';$('adStatus').textContent='Uploading advertisement…';
  try{
    const title=$('adTitle').value.trim(),advertiser=$('adAdvertiser').value.trim(),placement=$('adPlacement').value;
    const file=$('adFile').files[0],click=$('adUrl').value.trim(),wa=$('adWhatsapp').value.trim(),priority=Number($('adPriority').value||0);
    if(!title)throw new Error('Advertisement title is required.');
    if(!file)throw new Error('Please select an advertisement flyer.');
    if(file.size>5*1024*1024)throw new Error('Flyer must be 5 MB or smaller.');
    if(!/^image\/(jpeg|png|webp)$/i.test(file.type))throw new Error('Only JPG, PNG or WEBP flyers are supported.');
    const session=(await sb.auth.getSession()).data?.session;if(!session?.user?.id)throw new Error('Admin session missing. Please login again.');
    const safe=file.name.toLowerCase().replace(/[^a-z0-9._-]+/g,'-');
    const path=`admin/${Date.now()}-${safe}`;
    const up=await sb.storage.from('gc-advertisements').upload(path,file,{upsert:false,contentType:file.type});
    if(up.error)throw up.error;
    const pub=sb.storage.from('gc-advertisements').getPublicUrl(path);
    const image_url=pub.data.publicUrl;
    const ins=await sb.from('gc_advertisements').insert({title,advertiser_name:advertiser,placement,image_url,storage_path:path,click_url:click||null,whatsapp_url:wa||null,start_at:$('adStart').value?new Date($('adStart').value).toISOString():new Date().toISOString(),end_at:$('adEnd').value?new Date($('adEnd').value).toISOString():null,active:true,priority:Number.isFinite(priority)?priority:0,created_by:session.user.id}).select().single();
    if(ins.error)throw ins.error;
    $('adStatus').textContent='✓ Advertisement saved to Supabase and published to the selected placement.';
    $('adTitle').value='';$('adAdvertiser').value='';$('adUrl').value='';$('adWhatsapp').value='';$('adFile').value='';$('adPriority').value='0';
  }catch(e){$('adStatus').textContent='Advertisement save failed: '+(e.message||e)}
  finally{b.disabled=false;b.textContent='SAVE ADVERTISEMENT'}
};

staffCheck().then(async ok=>{if(ok){await loadLiveUsers();activeSection='edit';switchSection('edit');findForEdit()}});
</script>
<script id="gc-final-tutor-whatsapp-fix-js">
(function(){
  'use strict';
  function gcNormalizeWA(v){
    let d=String(v||'').replace(/\D/g,'');
    if(!d)return '';
    if(d.startsWith('00'))d=d.slice(2);
    if(d.length===11&&d.startsWith('0'))d=d.slice(1);
    if(d.length===10)d='91'+d;
    return d;
  }
  function gcPickContact(row){
    if(!row||typeof row!=='object')return {phone:'',name:''};
    const keys=Object.keys(row);
    const preferred=['phone','mobile','mobile_number','whatsapp','whatsapp_number','whatsapp_phone','contact_number','contact_no','phone_number'];
    let phone='';
    for(const k of preferred){if(row[k]!=null&&String(row[k]).trim()){phone=String(row[k]);break;}}
    if(!phone){const k=keys.find(x=>/(phone|mobile|whatsapp|contact)/i.test(x)&&row[x]!=null&&String(row[x]).trim());if(k)phone=String(row[k]);}
    return {phone:gcNormalizeWA(phone),name:String(row.name||row.full_name||row.display_name||'')};
  }
  async function gcTutorContact(lrrId){
    // gc_learning_requests_v2 in this project has tutor_id; do not query
    // tutor_user_id/student_user_id or any other assumed LRR columns.
    const rq=await sb.from('gc_learning_requests_v2').select('id,tutor_id').eq('id',String(lrrId)).maybeSingle();
    if(rq.error)throw rq.error;
    const id=String(rq.data?.tutor_id||'').trim();
    if(!id)throw new Error('The tutor account could not be identified for this request.');
    const attempts=[
      ()=>sb.from('tutor_profiles').select('*').eq('id',id).maybeSingle(),
      ()=>sb.from('tutor_profiles').select('*').eq('user_id',id).maybeSingle(),
      ()=>sb.from('profiles').select('*').eq('id',id).maybeSingle(),
      ()=>sb.from('profiles').select('*').eq('user_id',id).maybeSingle()
    ];
    let name='';
    for(const run of attempts){
      try{const x=await run();if(!x.error&&x.data){const c=gcPickContact(x.data);name=name||c.name;if(c.phone)return {phone:c.phone,name};}}catch(_){}
    }
    return {phone:'',name:name||'Tutor'};
  }
  window.gcOpenTutorWhatsApp=async function(lrrId){
    try{
      // Deliberately bypass gc_get_whatsapp_contact for Tutor. The currently
      // deployed RPC may reference a legacy tutor_user_id column and cause
      // PostgreSQL 42703. The directory data can be resolved directly.
      const c=await gcTutorContact(lrrId);
      if(!c.phone)throw new Error('No WhatsApp number is saved for this tutor. Please update the tutor mobile/WhatsApp number in the Tutor profile.');
      const msg='Hello '+(c.name||'Tutor')+', I am contacting you from GURU CONNECT Admin regarding your Learning Requirement Request.';
      const url='https://wa.me/'+c.phone+'?text='+encodeURIComponent(msg);
      const mobile=window.matchMedia&&window.matchMedia('(max-width: 700px)').matches;
      if(mobile)window.location.href=url;
      else{const w=window.open(url,'_blank','noopener,noreferrer');if(!w)window.location.href=url;}
    }catch(e){alert('WhatsApp Tutor could not be opened: '+(e.message||e));}
  };
  function install(){
    document.querySelectorAll('.lrrActions .caseChat').forEach(btn=>{
      const oc=btn.getAttribute('onclick')||'';
      if(!/whatsappCaseChat\([^,]+,\s*[\'"]tutor[\'"]\)/.test(oc))return;
      const m=oc.match(/whatsappCaseChat\(([\'"])(.*?)\1,\s*([\'"])tutor\3\)/);
      if(!m)return;
      btn.setAttribute('onclick','gcOpenTutorWhatsApp('+JSON.stringify(m[2])+')');
      btn.type='button';
    });
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',install);else install();
  setTimeout(install,500);setTimeout(install,1500);setTimeout(install,3000);
})();
</script>
