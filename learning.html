 function rebuildSelects(){const ss=document.getElementById('gcV17LRRStream'), su=document.getElementById('gcV17LRRSubject');if(!ss||!su)return;const streams=[...new Set(all.map(r=>String(r.stream||'').trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b));const subs=[...new Set(all.map(r=>String(r.subject||'').trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b));ss.innerHTML='<option value="ALL">All Streams</option>'+streams.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('');su.innerHTML='<option value="ALL">All Subjects</option>'+subs.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('');ss.value=stream;su.value=subject;}
 function filtered(){return all.filter(r=>tabMatch(r)&&(stream==='ALL'||String(r.stream||'')===stream)&&(subject==='ALL'||String(r.subject||'')===subject))}
 function render(){const g=document.getElementById('gcV17LRRGrid'),live=document.getElementById('gcV17LRRLive'),count=document.getElementById('gcV17LRRCount');if(!g)return;const rows=filtered();if(live)live.textContent='● LIVE • '+all.filter(r=>!isDeleted(r)).length+' REQUESTS';if(count)count.textContent=rows.length+' shown';g.innerHTML=rows.length?rows.map(card).join(''):'<div class="gc-v17-lrr-empty">🔎 No Learning Requirement matches these filters.<br><span style="font-size:10px;font-weight:700">Try another Stream, Subject or LRR status.</span></div>';bindMoreButtons();}
 function card(r){const student=r.student_name||r.student_full_name||r.full_name||r.name||'GURU CONNECT Student';const closed=isClosed(r), approved=isApproved(r);const status=closed?'LRR CLOSED':approved?'LRR ADMIN APPROVED':'LRR OPEN';const cls=closed?'closed':approved?'approved':'';const issue=r.issue||r.problem||'Student has not added a detailed issue.';return `<article class="gc-v17-lrr-card"><div class="gc-v17-lrr-top"><span class="gc-v17-lrr-role">⚡ LRR • LIVE</span><span class="gc-v17-lrr-status ${cls}">${status}</span></div><div class="gc-v17-lrr-identity"><div class="gc-v17-lrr-avatar">👩🏻‍🎓</div><div class="gc-v17-lrr-copy"><h3 class="gc-v17-lrr-name">${esc(student)}</h3><div class="gc-v17-lrr-sub">📚 ${esc(r.subject||'Subject not specified')}</div></div></div><div class="gc-v17-lrr-info"><div class="gc-v17-lrr-info-box"><span class="gc-v17-lrr-ico">📖</span><div><b>COURSE</b><span>${esc(r.course||'—')}</span></div></div><div class="gc-v17-lrr-info-box"><span class="gc-v17-lrr-ico">🌐</span><div><b>STREAM</b><span>${esc(r.stream||'—')}</span></div></div><div class="gc-v17-lrr-info-box"><span class="gc-v17-lrr-ico">🎯</span><div><b>TOPIC</b><span>${esc(r.topic||'—')}</span></div></div><div class="gc-v17-lrr-info-box"><span class="gc-v17-lrr-ico">⏳</span><div><b>DEADLINE</b><span>${esc(fmt(r.learning_deadline||r.deadline))}</span></div></div><div class="gc-v17-lrr-info-box"><span class="gc-v17-lrr-ico">🪙</span><div><b>REWARD</b><span>${Number(r.coins_held||100)} GURU COINS</span></div></div><div class="gc-v17-lrr-info-box"><span class="gc-v17-lrr-ico">🕒</span><div><b>POSTED</b><span>${esc(fmt(r.created_at))}</span></div></div></div><div class="gc-v17-lrr-need"><b>📝 LEARNING REQUIREMENT</b><span>${esc(issue)}</span></div><div class="gc-v17-lrr-actions"><button class="gc-v17-lrr-btn more" type="button" data-lrr-more="${esc(String(r.id||''))}">VIEW DETAILS</button><button class="gc-v17-lrr-btn connect" type="button" onclick="gcV17LRRConnect()">🤝 CONNECT</button></div></article>`}
 window.gcV17LRRConnect=function(){location.href='login-tutor.html?return=index.html#liveLRRSection'};
 window.gcV17LRRDetails=function(id){const r=all.find(x=>String(x.id||'')===String(id));if(!r)return;let m=document.getElementById('gcLRRDetailModal');if(!m){m=document.createElement('div');m.id='gcLRRDetailModal';m.style.cssText='position:fixed;inset:0;z-index:999999;display:flex;align-items:center;justify-content:center;padding:18px;background:rgba(15,23,42,.58)';m.innerHTML='<div id=gcLRRDetailBox style="width:min(560px,94vw);max-height:88vh;overflow:auto;background:#fff;border-radius:18px;padding:22px;box-shadow:0 25px 80px rgba(0,0,0,.3)"></div>';document.body.appendChild(m);m.addEventListener('click',e=>{if(e.target===m)m.remove()})}const status=isClosed(r)?'LRR CLOSED':isApproved(r)?'LRR ADMIN APPROVED':'LRR OPEN';document.getElementById('gcLRRDetailBox').innerHTML='<div style="display:flex;justify-content:space-between;gap:12px;align-items:center"><h2 style="margin:0;color:#13246b">'+esc(r.subject||'Learning Requirement')+'</h2><button type="button" onclick="document.getElementById(\'gcLRRDetailModal\').remove()" style="border:0;background:#eef2ff;border-radius:10px;padding:8px 11px;font-weight:900;cursor:pointer">✕</button></div><p style="font-weight:800;color:#475569">'+esc(r.student_name||r.student_full_name||r.full_name||r.name||'GURU CONNECT Student')+'</p><div style="display:grid;gap:9px"><div><b>Course:</b> '+esc(r.course||'—')+'</div><div><b>Stream:</b> '+esc(r.stream||'—')+'</div><div><b>Topic:</b> '+esc(r.topic||'—')+'</div><div><b>Deadline:</b> '+esc(fmt(r.learning_deadline||r.deadline))+'</div><div><b>Status:</b> '+esc(status)+'</div><div style="padding:12px;background:#f8fafc;border-radius:12px"><b>Learning Requirement</b><br>'+esc(r.issue||r.problem||'No additional details.')+'</div></div>'};function bindMoreButtons(){document.querySelectorAll('[data-lrr-more]').forEach(b=>{if(b.dataset.bound)return;b.dataset.bound='1';b.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();window.gcV17LRRDetails(b.getAttribute('data-lrr-more'))})})}

 async function load(){
   const g=document.getElementById('gcV17LRRGrid');
   const live=document.getElementById('gcV17LRRLive');
   if(!g)return;
   try{
     let rows=[];
     let lastError='';
     // Primary: direct REST RPC, using the same public RPC used by the working homepage.
     for(const name of ['gc_list_learning_requests_public_v4','gc_list_learning_requests_public_v5']){
       try{
         const resp=await fetch(URL+'/rest/v1/rpc/'+encodeURIComponent(name),{
           method:'POST',
           headers:{'apikey':KEY,'Authorization':'Bearer '+KEY,'Content-Type':'application/json','Accept':'application/json'},
           body:'{}',
           cache:'no-store'
         });
         const raw=await resp.text();
         if(!resp.ok){lastError=raw||('HTTP '+resp.status);continue;}
         let data;
         try{data=JSON.parse(raw)}catch(_){data=raw}
         // v4 normally returns [{...},{...}], v5 returns a JSON string containing an array.
         rows=normalizeRows(data);
         if(rows.length)break;
       }catch(e){lastError=e?.message||String(e)}
     }
     // Final fallback: the same Supabase JS RPC call used by the working index.html.
     if(!rows.length){
       try{
         const s=publicClient();
         const q=await s.rpc('gc_list_learning_requests_public_v4');
         if(!q.error) rows=normalizeRows(q.data);
         else lastError=q.error.message||String(q.error);
       }catch(e){lastError=e?.message||String(e)}
     }
     rows=rows.filter(r=>r&&typeof r==='object'&&!isDeleted(r));
     rows.sort((a,b)=>new Date(b.created_at||0)-new Date(a.created_at||0));
     all=rows;
     if(live)live.textContent='● LIVE • '+all.length+' REQUESTS';
     rebuildSelects();
     render();
     if(!rows.length && lastError){
       g.innerHTML='<div class="gc-error">⚠️ Live LRR feed could not be read.<small>'+esc(lastError)+'</small></div>';
     }
   }catch(e){
     console.error('GURU CONNECT LRR',e);
     if(live)live.textContent='● LIVE';
     g.innerHTML='<div class="gc-error">⚠️ Live LRR could not be loaded.<small>'+esc(e?.message||String(e))+'</small></div>';
   }
 }
 function normalizeRows(payload){

       if(item==null)continue;
       if(typeof item==='string'){try{out.push(...normalizeRows(JSON.parse(item)))}catch(_){}}
       else if(Array.isArray(item))out.push(...normalizeRows(item));
       else if(typeof item==='object'){
         const vals=Object.values(item);
         if(Object.keys(item).length===1 && typeof vals[0]==='string'){
           try{out.push(...normalizeRows(vals[0]));continue}catch(_){}
         }
         if(item.id||item.request_code||item.student_id)out.push(item);
         else if(Array.isArray(item.rows))out.push(...normalizeRows(item.rows));
       }
     }
     return out;
   }
   if(typeof payload==='object'){
     if(Array.isArray(payload.rows))return normalizeRows(payload.rows);
     if(payload.id||payload.request_code||payload.student_id)return [payload];
     const keys=Object.keys(payload);
     if(keys.length===1){
       const v=payload[keys[0]];
       if(typeof v==='string'||Array.isArray(v)||typeof v==='object')return normalizeRows(v);
     }
   }
   return [];
 }
