<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GURU CONNECT - Staff/Admin Login</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:Arial,sans-serif;background:#f1f5f9;margin:0;display:flex;min-height:100vh;align-items:center;justify-content:center}.card{background:#fff;width:min(440px,92vw);padding:30px;border-radius:22px;box-shadow:0 15px 45px #0002}h1{color:#123b8f;margin:0 0 8px}.muted{color:#64748b;font-size:13px;line-height:1.5}label{display:block;font-size:12px;font-weight:800;margin:16px 0 6px}input{width:100%;box-sizing:border-box;padding:13px;border:1px solid #cbd5e1;border-radius:12px;font-size:15px}button{width:100%;padding:13px;border:0;border-radius:12px;background:#123b8f;color:#fff;font-weight:800;margin-top:14px;cursor:pointer}.reset{background:#059669}.back{background:#e2e8f0;color:#0f172a}.status{margin-top:14px;padding:11px;border-radius:10px;background:#f8fafc;font-size:13px}.err{color:#b91c1c}.ok{color:#047857}</style></head><body><main class="card"><h1>GURU CONNECT</h1><p class="muted"><b>Staff / Admin Login</b><br>Normal Staff Login uses <b>Email + Password</b>.<br>The OTP is used only when setting or resetting the password.</p><label>Email</label><input id="email" type="email" value="guruconnect.in@gmail.com" autocomplete="email"><label>Password</label><input id="password" type="password" autocomplete="current-password" placeholder="Admin password"><button id="login">LOGIN SECURELY</button><button id="reset" class="reset">🔑 SET / RESET ADMIN PASSWORD — SEND OTP</button><div id="status" class="status"></div><button class="back" onclick="location.href='index.html'">BACK TO GURU CONNECT</button></main><script>const URL='https://hzqqswrnawrfgufbxgay.supabase.co',KEY='sb_publishable_Oc5HvqDpisv76XrdsyFhiw_IpostIDu',ADMIN='guruconnect.in@gmail.com',UID='1df7606a-3a96-4116-b022-804b37a3c3dd';const s=window.supabase.createClient(URL,KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});const $=id=>document.getElementById(id);function status(t,c=''){ $('status').className='status '+c;$('status').textContent=t}if(new URLSearchParams(location.search).get('reset')==='success')status('✓ Password reset completed. Please log in with your new password.','ok');$('reset').onclick=()=>location.href='forgot-password.html?email='+encodeURIComponent(ADMIN);$('login').onclick=async()=>{const email=$('email').value.trim().toLowerCase(),password=$('password').value;if(email!==ADMIN)return status('Please use '+ADMIN,'err');if(!password)return status('Enter the Admin password.','err');$('login').disabled=true;status('Signing in…');try{const r=await s.auth.signInWithPassword({email,password});if(r.error)throw r.error;const u=r.data?.user;if(!u||String(u.id)!==UID)throw new Error('This account is not the authorized GURU CONNECT Admin account.');localStorage.setItem('is_staff_logged','true');localStorage.setItem('gc_staff_supabase_auth','true');localStorage.setItem('active_user_role','staff');localStorage.setItem('active_user_id',u.id);localStorage.setItem('active_user_email',u.email||ADMIN);location.href='index.html#staff-admin'}catch(e){status('Admin Login failed: '+(e.message||e),'err')}finally{$('login').disabled=false}};</script><style id="gc-branded-popup-style">
#gc-popup-overlay{position:fixed;inset:0;background:rgba(7,18,38,.62);backdrop-filter:blur(5px);display:none;align-items:center;justify-content:center;z-index:2147483647;padding:18px;font-family:inherit}

<script id="gc-branded-popup-script">(()=>{if(window.__gcBrandedPopupInstalled)return;window.__gcBrandedPopupInstalled=true;const overlay=document.getElementById('gc-popup-overlay');if(!overlay)return;const title=overlay.querySelector('#gc-popup-title'),msg=overlay.querySelector('#gc-popup-message'),icon=overlay.querySelector('#gc-popup-icon'),ok=overlay.querySelector('#gc-popup-ok');let queue=[],busy=false;function render(){if(!queue.length){overlay.classList.remove('gc-open');busy=false;return}busy=true;const item=queue[0];title.textContent=item.title;msg.textContent=item.message;icon.className=item.kind==='error'?'gc-error':item.kind==='warn'?'gc-warn':'';icon.textContent=item.kind==='error'?'!':item.kind==='warn'?'⚠':'✓';ok.textContent=item.button||'CONTINUE';overlay.classList.add('gc-open');ok.focus()}function close(){queue.shift();render()}ok.addEventListener('click',close);overlay.addEventListener('click',e=>{if(e.target===overlay)close()});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&overlay.classList.contains('gc-open')){e.preventDefault();close()}});const nativeAlert=window.alert.bind(window);window.alert=function(value){const message=String(value??'');const low=message.toLowerCase();const kind=/fail|error|unable|not saved|not updated|denied|invalid|expired/.test(low)?'error':/warning|please|cannot|missing/.test(low)?'warn':'success';queue.push({title:kind==='error'?'Action Unsuccessful':kind==='warn'?'Please Note':'Action Completed',message,kind});if(!busy)render()};window.gcShowPopup=(message,options={})=>{queue.push({title:options.title||'GURU CONNECT',message:String(message??''),kind:options.kind||'success',button:options.button});if(!busy)render()};})();</script></body></html>
