<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Verify Password Reset — GURU CONNECT</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial,Helvetica,sans-serif;background:linear-gradient(135deg,#0f1f4f,#2563eb 55%,#06b6d4);display:flex;align-items:center;justify-content:center;padding:20px}.card{width:min(470px,100%);background:#fff;border-radius:26px;padding:30px;box-shadow:0 25px 70px rgba(0,0,0,.25);text-align:center}.icon{width:62px;height:62px;margin:0 auto;border-radius:18px;background:#2563eb;color:#fff;display:flex;align-items:center;justify-content:center;font-size:28px}h1{font-size:25px;margin:16px 0 8px}.sub{color:#64748b;font-size:13px;font-weight:700;line-height:1.5;margin-bottom:22px}button{width:100%;border:0;border-radius:13px;padding:14px;background:#2563eb;color:#fff;font-weight:950;cursor:pointer;margin-top:8px}.back{background:#f1f5f9;color:#334155}.msg{margin-top:14px;padding:12px;border-radius:12px;font-size:12px;font-weight:800;background:#fff1f2;color:#be123c}.msg.ok{background:#ecfdf5;color:#047857}
</style>
</head>
<body>
<div class="card">
  <div class="icon">🔐</div>
  <h1>Verify Password Reset</h1>
  <div class="sub">For your security, the reset link is verified only when you press the button below. This prevents email security scanners from consuming the one-time reset link.</div>
  <button id="verify" type="button">VERIFY &amp; RESET PASSWORD</button>
  <button class="back" type="button" onclick="location.href='index.html'">BACK TO WEBSITE</button>
  <div id="msg" class="msg" style="display:none"></div>
</div>
<script>
'use strict';
const SUPABASE_URL='https://hzqqswrnawrfgufbxgay.supabase.co';
const SUPABASE_KEY='sb_publishable_Oc5HvqDpisv76XrdsyFhiw_IpostIDu';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});
const btn=document.getElementById('verify'),msg=document.getElementById('msg');
const params=new URL(location.href).searchParams;
const tokenHash=params.get('token_hash')||'';
const type=(params.get('type')||'recovery').toLowerCase();
const next=params.get('next')||'https://www.guruconnnect.in/reset-password.html';
function show(t,ok){msg.textContent=t;msg.className='msg'+(ok?' ok':'');msg.style.display='block';}
function safeNext(){
  try{const u=new URL(next,location.origin);if(u.origin==='https://www.guruconnnect.in')return u.href;}catch(_){ }
  return 'https://www.guruconnnect.in/reset-password.html';
}
btn.onclick=async()=>{
  if(!tokenHash){show('This reset email is missing its verification token. Please request a new password reset email.',false);return;}
  btn.disabled=true;btn.textContent='VERIFYING…';
  try{
    const r=await sb.auth.verifyOtp({token_hash:tokenHash,type:type==='recovery'?'recovery':type});
    if(r.error)throw r.error;
    const session=r.data?.session;
    if(!session?.user || session.user.is_anonymous===true)throw new Error('The recovery session could not be established. Please request a new reset email.');
    show('Verified. Opening secure password update page…',true);
    setTimeout(()=>location.replace(safeNext()),250);
  }catch(e){
    console.error('Password reset verification failed',e);
    const m=String(e?.message||e||'');
    if(/expired|invalid|otp/i.test(m))show('This reset link has expired or has already been used. Please request a fresh reset link.',false);
    else show('Verification failed: '+m,false);
    btn.disabled=false;btn.textContent='VERIFY & RESET PASSWORD';
  }
};
</script>
</body>
</html>
