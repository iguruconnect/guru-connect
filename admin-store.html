<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Buy Now Store Management</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#13213a;font:14px Roboto,Arial,sans-serif}.wrap{max-width:1100px;margin:20px auto;padding:0 12px}.panel{background:white;border:1px solid #dbe4f0;border-radius:12px;padding:15px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}input,select,textarea{width:100%;padding:9px;border:1px solid #cbd5e1;border-radius:8px;font:inherit}button{border:0;border-radius:8px;padding:9px 12px;font-weight:800;cursor:pointer;background:#1457b8;color:white}.soft{background:#e6efff;color:#174a91}.danger{background:#fee2e2;color:#991b1b}.item{border-top:1px solid #e2e8f0;padding:12px 0}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.muted{color:#64748b;font-size:12px}.status{font-size:11px;background:#fef3c7;padding:4px 8px;border-radius:20px}.hidden{display:none!important}label{font-weight:700;display:block;margin-bottom:4px}</style></head><body><main class="wrap"><a href="/admin.html">← Back to Admin Dashboard</a><h1>🛒 BUY NOW — STORE MANAGEMENT</h1><p class="muted">Manage member catalogue items, prices and payment submissions.</p><div id="gate" class="panel">Checking Admin session…</div><section id="app" class="hidden"><div class="panel"><h2 id="formTitle">Add Catalogue Item</h2><form id="form"><input id="pid" type="hidden"><div class="grid"><div><label>Service name</label><input id="title" required></div><div><label>Category</label><select id="category"><option value="membership">Membership</option><option value="verification">Verification</option><option value="helpline">Helpline</option><option value="service">Other Service</option></select></div><div><label>Available to</label><select id="scope"><option value="all">All members</option><option value="tutor">Tutors</option><option value="student">Students</option></select></div><div><label>Price (INR)</label><input id="price" type="number" min="0" step=".01" required></div><div><label>Validity / term</label><input id="validity" placeholder="e.g. 1 month"></div><div><label>Display order</label><input id="sort" type="number" value="100"></div></div><p><label>Description</label><textarea id="desc" rows="2"></textarea></p><label><input id="active" type="checkbox" checked style="width:auto"> Active / visible to members</label><p><button>SAVE ITEM</button> <button type="button" id="clear" class="soft">CLEAR</button></p><p id="formMsg" class="muted"></p></form></div><div class="panel"><div class="row"><h2>Catalogue</h2><button id="refreshProducts" class="soft">REFRESH</button></div><div id="products"></div></div><div class="panel"><div class="row"><h2>Member Orders & UPI References</h2><button id="refreshOrders" class="soft">REFRESH ORDERS</button></div><div id="orders"></div></div></section></main><script>
const sb=supabase.createClient('https://hzqqswrnawrfgufbxgay.supabase.co','sb_publishable_Oc5HvqDpisv76XrdsyFhiw_IpostIDu',{auth:{persistSession:true,autoRefreshToken:true}}),$=x=>document.getElementById(x),money=n=>'₹'+Number(n).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});async function loadProducts(){const {data,error}=await sb.from('gc_store_products').select('*').order('sort_order');if(error){$('products').textContent=error.message;return}$('products').innerHTML='';for(const p of data||[]){const d=document.createElement('div');d.className='item';d.innerHTML='<div class="row"><b></b><span></span><span class="muted"></span><button class="soft">EDIT</button><button class="danger">DELETE</button></div><div class="muted"></div>';d.querySelector('b').textContent=p.title;d.children[0].children[1].textContent=money(p.price_inr);d.children[0].children[2].textContent=p.category+' • '+p.role_scope+' • '+(p.active?'ACTIVE':'HIDDEN');d.children[1].textContent=p.description||'';d.querySelectorAll('button')[0].onclick=()=>{for(const [k,v] of Object.entries({pid:p.id,title:p.title,category:p.category,scope:p.role_scope,price:p.price_inr,validity:p.validity_label,sort:p.sort_order,desc:p.description,active:p.active}))$(k).type==='checkbox'?$(k).checked=v:$(k).value=v;$('formTitle').textContent='Edit Catalogue Item'};d.querySelectorAll('button')[1].onclick=async()=>{if(confirm('Delete this item? Existing order records are retained.')){const {error}=await sb.from('gc_store_products').delete().eq('id',p.id);if(error)alert(error.message);else loadProducts()}};$('products').appendChild(d)}}
$('form').onsubmit=async e=>{e.preventDefault();const row={title:$('title').value.trim(),category:$('category').value,role_scope:$('scope').value,price_inr:Number($('price').value),validity_label:$('validity').value,sort_order:Number($('sort').value)||100,description:$('desc').value,active:$('active').checked,updated_at:new Date().toISOString()},id=$('pid').value,q=id?sb.from('gc_store_products').update(row).eq('id',id):sb.from('gc_store_products').insert(row),{error}=await q;if(error){$('formMsg').textContent=error.message;return}$('formMsg').textContent='Saved.';$('form').reset();$('pid').value='';$('sort').value=100;$('active').checked=true;$('formTitle').textContent='Add Catalogue Item';loadProducts()};$('clear').onclick=()=>{$('form').reset();$('pid').value='';$('sort').value=100;$('active').checked=true};
async function loadOrders(){const {data,error}=await sb.rpc('gc_admin_store_orders');if(error){$('orders').textContent=error.message;return}$('orders').innerHTML='';if(!data?.length){$('orders').textContent='No orders yet.';return}for(const o of data){const d=document.createElement('div');d.className='item';d.innerHTML='<div class="row"><b></b><span class="status"></span><strong></strong></div><p class="muted"></p><p class="muted"></p><textarea rows="2" placeholder="Admin note (optional)"></textarea><p class="row"><button>VERIFY PAYMENT</button><button class="danger">REJECT</button></p>';d.querySelector('b').textContent=o.member_role.toUpperCase()+' • '+o.auth_user_id;d.querySelector('.status').textContent=o.status;d.querySelector('strong').textContent=money(o.total_inr);d.children[1].textContent=(o.items||[]).map(x=>x.title).join(', ');d.children[2].textContent='Order '+o.id+' • UTR: '+(o.utr||'Not submitted');const act=async v=>{const {error}=await sb.rpc('gc_admin_store_verify_order',{p_order_id:o.id,p_decision:v,p_note:d.querySelector('textarea').value});if(error)alert(error.message);else loadOrders()};d.querySelectorAll('button')[0].onclick=()=>act('VERIFY');d.querySelectorAll('button')[1].onclick=()=>act('REJECT');if(o.status!=='PAYMENT_SUBMITTED')d.querySelectorAll('button').forEach(b=>b.disabled=true);$('orders').appendChild(d)}}
$('refreshProducts').onclick=loadProducts;$('refreshOrders').onclick=loadOrders;(async()=>{const {data}=await sb.auth.getSession();if(!data.session){$('gate').textContent='No Admin session. Please sign in through the Admin Dashboard first.';return}const {data:ok,error}=await sb.rpc('gc_is_staff_admin_v2');if(error||ok!==true){$('gate').textContent='Admin authorization failed. Open this page from the authenticated Admin Dashboard.';return}$('gate').classList.add('hidden');$('app').classList.remove('hidden');await Promise.all([loadProducts(),loadOrders()])})();
</script></body></html>
