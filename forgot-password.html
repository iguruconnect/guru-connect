<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>GURU CONNECT — Password Reset</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#eef5ff,#f8fbff);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#0f172a;padding:18px}
.card{width:min(500px,100%);background:#fff;border:1px solid #dbe5f0;border-radius:24px;padding:28px;box-shadow:0 25px 70px rgba(15,23,42,.14)}
.logo{width:100%;height:82px;object-fit:contain;object-position:left center}.eyebrow{font-size:11px;font-weight:900;letter-spacing:.12em;color:#155eef}.title{font-size:25px;font-weight:900;margin:6px 0}.sub{font-size:13px;line-height:1.55;color:#64748b}
label{display:block;font-size:12px;font-weight:800;margin:18px 0 7px}input{width:100%;padding:14px;border:1px solid #cbd5e1;border-radius:12px;font-size:16px;outline:0}input:focus{border-color:#2563eb;box-shadow:0 0 0 3px #2563eb18}
button{width:100%;margin-top:14px;padding:14px;border:0;border-radius:12px;background:#155eef;color:#fff;font-weight:900;font-size:14px;cursor:pointer}button:disabled{opacity:.6}
.msg{margin-top:14px;padding:12px;border-radius:12px;font-size:12px;font-weight:700;line-height:1.5}.info{background:#eff6ff;color:#1e3a8a;border:1px solid #bfdbfe}.ok{background:#ecfdf5;color:#047857;border:1px solid #a7f3d0}.bad{background:#fef2f2;color:#991b1b;border:1px solid #fecaca}
a{display:block;text-align:center;margin-top:16px;color:#155eef;text-decoration:none;font-size:12px;font-weight:800}
</style>
</head>
<body>
<main class="card">
<img class="logo" src="guru-connect-brand.png" alt="GURU CONNECT">
<div class="eyebrow">SECURE ACCOUNT RECOVERY</div>
<div class="title">Reset your password</div>
<div class="sub">Enter your registered email. We will send one fresh Supabase recovery email. Use only the newest email; older recovery links/codes are intentionally rejected by Supabase.</div>
<label for="email">REGISTERED EMAIL</label>
<input id="email" type="email" autocomplete="email" inputmode="email" placeholder="you@example.com">
<button id="send">SEND RESET EMAIL</button>
<div id="msg"></div>
<a href="index.html">← Back to GURU CONNECT</a>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(async function(){
'use strict';
const URL='https://hzqqswrnawrfgufbxgay.supabase.co';
const KEY='sb_publishable_Oc5HvqDpisv76XrdsyFhiw_IpostIDu';
const sb=supabase.createClient(URL,KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});
const emailEl=document.getElementById('email'),btn=document.getElementById('send'),msg=document.getElementById('msg');
try{const q=new URLSearchParams(location.search);if(q.get('email'))emailEl.value=q.get('email')}catch(_){}
btn.onclick=async()=>{
 const email=emailEl.value.trim().toLowerCase(); msg.className='msg';msg.textContent='';
 if(!/^\\S+@\\S+\\.\\S+$/.test(email)){msg.classList.add('bad');msg.textContent='Please enter a valid registered email address.';return}
 btn.disabled=true;btn.textContent='SENDING…';
 try{
   try{await sb.auth.signOut({scope:'local'})}catch(_){}
   const redirectTo=new URL('reset-otp.html',location.href).href;
   const r=await sb.auth.resetPasswordForEmail(email,{redirectTo});
   if(r.error)throw r.error;
   msg.classList.add('ok');
   msg.innerHTML='✓ Reset email sent. <b>Open the newest email</b> and click its reset button. If you receive more than one, use only the latest one. Check Spam/Junk too.';
 }catch(e){
   console.error(e);msg.classList.add('bad');
   msg.textContent='Could not send reset email: '+(e?.message||e);
 }finally{btn.disabled=false;btn.textContent='SEND RESET EMAIL'}
};
})();
</script>
</body>
</html>
