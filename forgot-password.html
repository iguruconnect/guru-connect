</head><body><main class="card"><img class="logo" src="guru-connect-brand.png" alt="GURU CONNECT"><h2 style="text-align:center;margin:0">Reset your password</h2><p style="text-align:center;color:#64748b;font-size:13px;line-height:1.55">Enter your registered email. We will send a secure password-reset link. No OTP is required.</p><label class="label">REGISTERED EMAIL</label><input id="email" class="input" type="email" autocomplete="email"><button id="send" class="btn">SEND RESET LINK</button><div id="msg" class="msg"></div><div class="links"><a href="index.html">← Login</a> &nbsp;•&nbsp; <a href="index.html">Home</a></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const U='https://hzqqswrnawrfgufbxgay.supabase.co',K='sb_publishable_Oc5HvqDpisv76XrdsyFhiw_IpostIDu',sb=supabase.createClient(U,K,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}}),$=id=>document.getElementById(id),msg=$('msg');$('email').value=new URLSearchParams(location.search).get('email')||'';function show(t,ok=false){msg.textContent=t;msg.className='msg show '+(ok?'ok':'err')}$('send').onclick=async()=>{const email=$('email').value.trim().toLowerCase();if(!/^\S+@\S+\.\S+$/.test(email))return show('Enter a valid registered email address.');const b=$('send');b.disabled=true;b.textContent='SENDING…';try{const redirect=new URL('reset-password.html',location.href).href;const r=await sb.auth.resetPasswordForEmail(email,{redirectTo:redirect});if(r.error)throw r.error;show('✓ Reset link sent. Open the newest email and click the reset link. Check Spam/Junk if necessary.',true)}catch(e){show(e?.message||'Could not send the reset email.')}finally{b.disabled=false;b.textContent='SEND RESET LINK'}};</script><style id="gc-branded-popup-style">

<script id="gc-branded-popup-script">(()=>{if(window.__gcBrandedPopupInstalled)return;window.__gcBrandedPopupInstalled=true;const overlay=document.getElementById('gc-popup-overlay');if(!overlay)return;const title=overlay.querySelector('#gc-popup-title'),msg=overlay.querySelector('#gc-popup-message'),icon=overlay.querySelector('#gc-popup-icon'),ok=overlay.querySelector('#gc-popup-ok');let queue=[],busy=false;function render(){if(!queue.length){overlay.classList.remove('gc-open');busy=false;return}busy=true;const item=queue[0];title.textContent=item.title;msg.textContent=item.message;icon.className=item.kind==='error'?'gc-error':item.kind==='warn'?'gc-warn':'';icon.textContent=item.kind==='error'?'!':item.kind==='warn'?'⚠':'✓';ok.textContent=item.button||'CONTINUE';overlay.classList.add('gc-open');ok.focus()}function close(){queue.shift();render()}ok.addEventListener('click',close);overlay.addEventListener('click',e=>{if(e.target===overlay)close()});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&overlay.classList.contains('gc-open')){e.preventDefault();close()}});const nativeAlert=window.alert.bind(window);window.alert=function(value){const message=String(value??'');const low=message.toLowerCase();const kind=/fail|error|unable|not saved|not updated|denied|invalid|expired/.test(low)?'error':/warning|please|cannot|missing/.test(low)?'warn':'success';queue.push({title:kind==='error'?'Action Unsuccessful':kind==='warn'?'Please Note':'Action Completed',message,kind});if(!busy)render()};window.gcShowPopup=(message,options={})=>{queue.push({title:options.title||'GURU CONNECT',message:String(message??''),kind:options.kind||'success',button:options.button});if(!busy)render()};})();</script></body></html>
