<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GURU CONNECT — Password Reset</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,#eef6ff,#f8fbff,#f5f3ff);font-family:Inter,Arial,sans-serif}
.card{width:min(480px,100%);background:#fff;border:1px solid #dbe3ef;border-radius:26px;padding:30px;box-shadow:0 24px 70px #0f172a18}
.logo{display:block;width:260px;height:70px;object-fit:contain;margin:auto auto 15px}
h2{text-align:center;margin:0}.intro{text-align:center;color:#64748b;font-size:13px;line-height:1.55}
.label{display:block;font-size:11px;font-weight:950;color:#475569;margin:14px 0 6px}
.input{width:100%;padding:14px;border:1px solid #cbd5e1;border-radius:12px;font:700 14px Inter;outline:0}
.btn{width:100%;margin-top:17px;padding:14px;border:0;border-radius:12px;background:#155eef;color:#fff;font-weight:950;cursor:pointer}
.btn.secondary{background:#0f766e}.btn:disabled{opacity:.6;cursor:not-allowed}
.msg{display:none;margin-top:13px;padding:13px;border-radius:11px;font-size:13px;font-weight:750;line-height:1.5}
.msg.show{display:block}.ok{background:#ecfdf5;color:#166534}.err{background:#fff1f2;color:#991b1b}
.otpbox{display:none;margin-top:18px;padding:16px;border:1px solid #bfdbfe;border-radius:16px;background:#eff6ff}
.otpbox.show{display:block}.otp{text-align:center;letter-spacing:.45em;font-size:24px;font-weight:900}
.small{text-align:center;color:#64748b;font-size:11px;line-height:1.5;margin-top:10px}
.links{text-align:center;margin-top:17px;font-size:13px;font-weight:800}.links a{color:#155eef;text-decoration:none}
</style>
</head>
<body>
<main class="card">
<img class="logo" src="guru-connect-brand.png" alt="GURU CONNECT">
<h2 id="title">Reset your password</h2>
<p id="intro" class="intro">Enter your registered email. We will send a secure password-reset link.</p>

<label class="label">REGISTERED EMAIL</label>
<input id="email" class="input" type="email" autocomplete="email">

<button id="send" class="btn">SEND RESET LINK</button>

<section id="adminOtpBox" class="otpbox">
  <div style="font-size:12px;font-weight:900;color:#0f4c81;text-align:center">STAFF / ADMIN OTP VERIFICATION</div>
  <input id="otp" class="input otp" inputmode="numeric" autocomplete="one-time-code" maxlength="8" placeholder="ENTER OTP">
  <label class="label">NEW PASSWORD</label>
  <input id="p1" class="input" type="password" minlength="8" autocomplete="new-password" placeholder="New password (8+ characters)">
  <label class="label">CONFIRM PASSWORD</label>
  <input id="p2" class="input" type="password" minlength="8" autocomplete="new-password" placeholder="Confirm new password">
  <button id="verify" class="btn secondary" disabled>VERIFY OTP & SET PASSWORD</button>
  <div class="small">Enter the newest OTP sent to the Staff/Admin email. The reset flow will not create a new account.</div>
</section>

<div id="msg" class="msg"></div>
<div class="links"><a href="login.html">← Login</a> &nbsp;•&nbsp; <a href="index.html">Home</a></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const U='https://hzqqswrnawrfgufbxgay.supabase.co',
K='sb_publishable_Oc5HvqDpisv76XrdsyFhiw_IpostIDu',
ADMIN='guruconnect.in@gmail.com',
sb=supabase.createClient(U,K,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}}),
$=id=>document.getElementById(id),
msg=$('msg'), emailInput=$('email'), send=$('send'), otpBox=$('adminOtpBox'),
otpInput=$('otp'), verify=$('verify'), p1=$('p1'), p2=$('p2');

function show(t,ok=false){msg.textContent=t;msg.className='msg show '+(ok?'ok':'err')}
function isAdminEmail(){return emailInput.value.trim().toLowerCase()===ADMIN}
function setAdminMode(){
  const admin=isAdminEmail();
  $('title').textContent=admin?'Staff / Admin Password Reset':'Reset your password';
  $('intro').textContent=admin
    ? 'We will send a secure OTP to the authorized Staff/Admin email. Enter the OTP below to set a new password.'
    : 'Enter your registered email. We will send a secure password-reset link.';
  send.textContent=admin?'SEND ADMIN OTP':'SEND RESET LINK';
  otpBox.classList.toggle('show',admin && otpBox.dataset.sent==='1');
}
emailInput.value=new URLSearchParams(location.search).get('email')||'';
emailInput.addEventListener('input',()=>{otpBox.dataset.sent='';otpInput.value='';verify.disabled=true;setAdminMode()});
setAdminMode();

otpInput.addEventListener('input',()=>{
  otpInput.value=(otpInput.value||'').replace(/\D/g,'').slice(0,8);
  verify.disabled=!((otpInput.value||'').length>=6);
});

send.onclick=async()=>{
  const email=emailInput.value.trim().toLowerCase();
  if(!/^\S+@\S+\.\S+$/.test(email))return show('Enter a valid registered email address.');
  send.disabled=true;send.textContent='SENDING…';
  try{
    const current=await sb.auth.getUser();
    if(current?.data?.user?.is_anonymous===true)await sb.auth.signOut({scope:'local'});

    if(email===ADMIN){
      const r=await sb.auth.signInWithOtp({
        email:ADMIN,
        options:{shouldCreateUser:false}
      });
      if(r.error)throw r.error;
      otpBox.dataset.sent='1';
      otpBox.classList.add('show');
      verify.disabled=true;
      show('✓ Admin OTP sent. Check Inbox and Junk/Spam, then enter the newest OTP below.',true);
      otpInput.focus();
    }else{
      const redirect=new URL('reset-password.html',location.href).href;
      const r=await sb.auth.resetPasswordForEmail(email,{redirectTo:redirect});
      if(r.error)throw r.error;
      show('✓ Reset link sent. Open the newest email and click the reset link. Check Spam/Junk if necessary.',true);
    }
  }catch(e){
    console.error('Password reset request failed:',e);
    show(e?.message||'Could not send the password reset request.');
  }finally{
    send.disabled=false;
    send.textContent=isAdminEmail()?'SEND ADMIN OTP':'SEND RESET LINK';
  }
};

verify.onclick=async()=>{
  const token=(otpInput.value||'').replace(/\D/g,'');
  const a=p1.value,b=p2.value;
  if(token.length<6)return show('Enter the complete OTP from the newest Staff/Admin email.');
  if(a.length<8)return show('Password must be at least 8 characters.');
  if(a!==b)return show('Passwords do not match.');
  verify.disabled=true;verify.textContent='VERIFYING…';
  try{
    const r=await sb.auth.verifyOtp({email:ADMIN,token,type:'email'});
    if(r.error)throw r.error;
    if(!r.data?.user)throw new Error('Supabase did not return the Staff/Admin account.');
    if(String(r.data.user.email||'').toLowerCase()!==ADMIN)throw new Error('This OTP did not authenticate the authorized Staff/Admin account.');

    const up=await sb.auth.updateUser({password:a});
    if(up.error)throw up.error;
    show('✓ Staff/Admin password updated successfully. You can now login with the new password.',true);
    setTimeout(async()=>{try{await sb.auth.signOut({scope:'local'})}catch(_){}location.href='login-staff-password.html?reset=success'},1200);
  }catch(e){
    console.error('Admin OTP password reset failed:',e);
    show(e?.message||'OTP verification or password update failed.');
    verify.disabled=false;verify.textContent='VERIFY OTP & SET PASSWORD';
  }
};
</script>
</body>
</html>
