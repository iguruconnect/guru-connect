<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GURU CONNECT - Admin Password Reset</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:Arial,sans-serif;background:#f1f5f9;margin:0;display:flex;min-height:100vh;align-items:center;justify-content:center}.card{background:white;width:min(460px,92vw);padding:30px;border-radius:22px;box-shadow:0 15px 45px #0002}h1{margin:0 0 8px;color:#123b8f}.muted{color:#64748b;font-size:13px;line-height:1.5}label{display:block;font-size:12px;font-weight:800;margin:16px 0 6px}input{width:100%;box-sizing:border-box;padding:13px;border:1px solid #cbd5e1;border-radius:12px;font-size:15px}button{width:100%;padding:13px;border:0;border-radius:12px;background:#123b8f;color:white;font-weight:800;margin-top:14px;cursor:pointer}button:disabled{opacity:.6;cursor:wait}.secondary{background:#e2e8f0;color:#0f172a}.status{margin-top:14px;padding:11px;border-radius:10px;background:#f8fafc;font-size:13px;line-height:1.45}.ok{color:#047857}.err{color:#b91c1c}</style></head><body><main class="card"><h1>Admin Password Reset</h1><p class="muted">Reset the GURU CONNECT Staff/Admin password using the OTP sent to <b>guruconnect.in@gmail.com</b>.</p><label>Admin Email</label><input id="email" type="email" value="guruconnect.in@gmail.com" autocomplete="email"><button id="send">SEND OTP TO ADMIN EMAIL</button><div id="otpArea" style="display:none"><label>OTP received by email</label><input id="otp" inputmode="numeric" maxlength="6" placeholder="Enter OTP" autocomplete="one-time-code"><label>New Password</label><input id="pass" type="password" minlength="8" placeholder="Minimum 8 characters" autocomplete="new-password"><label>Confirm New Password</label><input id="pass2" type="password" minlength="8" placeholder="Re-enter new password" autocomplete="new-password"><button id="verify">VERIFY OTP &amp; SET NEW PASSWORD</button></div><div id="status" class="status"></div><button class="secondary" onclick="location.href='index.html'">BACK TO GURU CONNECT</button></main><script>const URL='https://hzqqswrnawrfgufbxgay.supabase.co',KEY='sb_publishable_Oc5HvqDpisv76XrdsyFhiw_IpostIDu',ADMIN='guruconnect.in@gmail.com';const supabase=window.supabase.createClient(URL,KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});const $=id=>document.getElementById(id);function status(t,c=''){ $('status').className='status '+c;$('status').textContent=t}function email(){return $('email').value.trim().toLowerCase()}$('send').onclick=async()=>{if(email()!==ADMIN)return status('Please use the registered Admin email: '+ADMIN,'err');$('send').disabled=true;status('Sending OTP…');try{const r=await supabase.auth.resetPasswordForEmail(ADMIN,{redirectTo:location.href});if(r.error)throw r.error;$('otpArea').style.display='block';status('OTP sent. Check guruconnect.in@gmail.com, including Spam/Junk. Enter the newest OTP below.','ok')}catch(e){status('Could not send the reset OTP: '+(e.message||e),'err')}finally{$('send').disabled=false}};$('verify').onclick=async()=>{const token=$('otp').value.trim(),p=$('pass').value,p2=$('pass2').value;if(!/^\d{6}$/.test(token))return status('Enter the 6-digit OTP from the email.','err');if(p.length<8)return status('New password must be at least 8 characters.','err');if(p!==p2)return status('The two passwords do not match.','err');$('verify').disabled=true;status('Verifying OTP…');try{const r=await supabase.auth.verifyOtp({email:ADMIN,token,type:'recovery'});if(r.error)throw r.error;if(!r.data?.session)throw new Error('OTP was accepted but no recovery session was created. Please request a fresh OTP and try again.');const u=r.data.user;if(String(u?.email||'').toLowerCase()!==ADMIN)throw new Error('This OTP is not for the configured Admin account.');const up=await supabase.auth.updateUser({password:p});if(up.error)throw up.error;status('✓ Password updated successfully. You can now log in with your new password.','ok');$('otpArea').style.display='none';setTimeout(()=>location.href='login-staff.html?reset=success',1800)}catch(e){status('OTP verification/reset failed: '+(e.message||e),'err')}finally{$('verify').disabled=false}};</script></body></html>
